<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316846f'/><path d='M14 40c0-11 8-20 18-20s18 9 18 20H14z' fill='%23fffdf9'/><path d='M22 40c1-6 4-11 10-13M32 40c0-6 2-10 6-12' stroke='%2316846f' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --surface:#fffdf9; --sunk:#eee8dc; --line:#e2dacb; --ink:#1e1913; --muted:#6f6556; --faint:#a39a8a;
  --accent:#16846f; --accent-ink:#ffffff; --accent-soft:#d9f1ea;
  --reg:#5b5347; --reg-soft:#ece6da;
  --sea:#a86410; --sea-soft:#fbead0;
  --spe:#7b3fa0; --spe-soft:#efe2f7;
  --warn:#b4321f; --warn-soft:#fbe1dc;
  --ok:#2c7a3f; --ok-soft:#dcf0e0;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 2px 8px rgba(40,30,10,.05);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16130f; --surface:#1f1b16; --sunk:#2a251e; --line:#3a3329; --ink:#f3ede3; --muted:#b5aa98; --faint:#7d7466;
  --accent:#4fd1b5; --accent-ink:#0d1f1a; --accent-soft:#163a32;
  --reg:#cfc5b4; --reg-soft:#2d281f; --sea:#f0b45c; --sea-soft:#3a2a12; --spe:#d3a6ee; --spe-soft:#33213f;
  --warn:#ff8a75; --warn-soft:#45201a; --ok:#7fd396; --ok-soft:#1c3523; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16130f; --surface:#1f1b16; --sunk:#2a251e; --line:#3a3329; --ink:#f3ede3; --muted:#b5aa98; --faint:#7d7466;
  --accent:#4fd1b5; --accent-ink:#0d1f1a; --accent-soft:#163a32;
  --reg:#cfc5b4; --reg-soft:#2d281f; --sea:#f0b45c; --sea-soft:#3a2a12; --spe:#d3a6ee; --spe-soft:#33213f;
  --warn:#ff8a75; --warn-soft:#45201a; --ok:#7fd396; --ok-soft:#1c3523; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:12px}

/* app shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:10px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;position:relative}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav .dot{position:absolute;top:-5px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:14px}
main{max-width:1500px;margin:0 auto;padding:16px 16px 80px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:24px;letter-spacing:-.02em}
.weeknav{display:flex;align-items:center;gap:4px}
.weeknav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:18px}
.weeknav .btn{width:auto;white-space:nowrap;height:36px}

/* badges */
.b{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.b.reg{background:var(--reg-soft);color:var(--reg)}
.b.sea{background:var(--sea-soft);color:var(--sea)}
.b.spe{background:var(--spe-soft);color:var(--spe)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.acc{background:var(--accent-soft);color:var(--accent)}

/* decision lane */
.lane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.lane h3{font-size:15px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lane-items{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.dcard{flex:0 0 auto;min-width:200px;max-width:260px;text-align:left;border:1px dashed var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.dcard.late{border-color:var(--warn);background:var(--warn-soft)}
.dcard b{display:block;font-size:14px}
.dcard .small{display:block}
.lane-empty{font-size:14px;color:var(--muted)}

/* week board */
.board{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.col{background:var(--sunk);border-radius:14px;padding:8px;min-height:300px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.col.today{outline:2px solid var(--accent);outline-offset:-2px}
.col.drop{background:var(--accent-soft)}
.colh{display:flex;align-items:baseline;gap:6px;padding:2px 4px}
.colh b{font-family:var(--f-display);font-size:17px}
.colh .small{color:var(--muted)}
.colh .add{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
.sale{background:var(--surface);border-radius:10px;padding:8px;border:1px solid var(--line);text-align:left;width:100%}
.sale-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:4px}
.sale ul{list-style:none;margin:0;padding:0;font-size:13px}
.sale li{display:flex;gap:6px;align-items:baseline;padding:1px 0}
.sale li .q{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:24px;text-align:right}
.sale li .ch{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sale li .miss{color:var(--warn);font-weight:700;font-size:12px}
.sale .empty{font-size:13px;color:var(--muted)}
.tod{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:4px 4px 0}

.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--reg);border-radius:10px;padding:8px 10px;text-align:left;width:100%;display:flex;gap:8px;align-items:flex-start;box-shadow:var(--shadow)}
.card.k-order{border-left-color:var(--spe)}
.card.k-restock{border-left-color:var(--accent)}
.card.k-custom{border-left-color:var(--faint)}
.card.sea{border-left-color:var(--sea)}
.card.done{opacity:.55}
.card.done .ct{text-decoration:line-through}
.card[draggable="true"]{cursor:grab}
.chk{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;margin-top:1px;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:14px;height:14px}
.cbody{flex:1;min-width:0;cursor:pointer}
.ct{font-weight:600;font-size:14px;line-height:1.3}
.cm{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.cur{background:var(--ink)}
.csrc{font-size:12px;color:var(--muted);margin-top:3px}

/* sheets & dialogs */
.scrim{position:fixed;inset:0;background:rgba(20,15,8,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding:18px 18px 40px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.sheet-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.sheet-h h3{font-size:22px;letter-spacing:-.01em}
.x{margin-left:auto;border:0;background:var(--sunk);border-radius:8px;width:34px;height:34px;font-size:20px;flex:0 0 auto}
.sec{margin-top:18px}
.sec h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:var(--f-body);font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:14px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=password],input[type=time],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.li .grow{flex:1;min-width:0}
.chain{display:flex;flex-direction:column;gap:4px}
.chain .st{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border-radius:8px;background:var(--bg)}
.chain .st.cur{outline:2px solid var(--accent)}
.chain .st .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:84px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px}
.pill:hover{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.err{background:var(--warn);color:#fff}

/* today */
.today-wrap{max-width:760px}
.tl{display:flex;flex-direction:column;gap:8px}
.big .card{padding:12px}
.big .ct{font-size:16px}
.big .chk{width:28px;height:28px}
.logrow{display:grid;grid-template-columns:1fr repeat(4,72px);gap:6px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.logrow input{padding:6px;font-size:15px;text-align:center}
.logrow.h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
@media (max-width:560px){.logrow{grid-template-columns:1fr repeat(4,56px)}}

/* month */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 4px}
.md{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;font-size:12px}
.md.out{opacity:.4}
.md.today{outline:2px solid var(--accent)}
.md .n{font-family:var(--f-display);font-weight:700;font-size:15px}
.md .ln{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
@media (max-width:700px){.md{min-height:70px;padding:4px}.md .ln .t{display:none}}

/* orders */
.otabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.otabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.otabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ocard.req{border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-soft)}
.oh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.oh b{font-family:var(--f-display);font-size:18px}
.oitems{margin:0;padding-left:18px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.kv span{color:var(--muted)}
.links{display:flex;flex-direction:column;gap:8px}
.linkbox{display:flex;gap:6px}
.linkbox input{font-family:var(--f-mono);font-size:12px}

/* setup */
.stabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.stabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.stabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tbl td input{width:64px;text-align:center;padding:5px}
.tbl tr.grp td{background:var(--sunk);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.pcard h4{font-size:16px}
.stepday{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.stepday h5{margin:0 0 6px;font-size:13px;font-family:var(--f-body);font-weight:700;color:var(--muted)}
.steprow{display:grid;grid-template-columns:1fr 120px 70px auto;gap:6px;margin-bottom:6px;align-items:center}
.ingrow{display:grid;grid-template-columns:1fr 80px 70px auto;gap:6px;margin-bottom:6px}
.partrow{display:grid;grid-template-columns:1fr 130px 80px 64px auto;gap:6px;margin-bottom:6px;align-items:center}
@media (max-width:560px){.steprow,.partrow{grid-template-columns:1fr 1fr}.steprow [data-f=title],.partrow [data-f=recipe_id]{grid-column:1 / -1}.ingrow{grid-template-columns:1fr 70px 60px auto}}
.stock{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:18px}
.stepper input{width:70px;text-align:center}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.low i{background:var(--warn)}

/* login */
.login{max-width:380px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:28px;letter-spacing:-.02em}
.err{color:var(--warn);font-size:14px}
.note{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:900px){.board{grid-template-columns:repeat(7,82vw)}}
@media (prefers-reduced-motion:no-preference){.card,.btn,.dcard{transition:background .15s,border-color .15s,opacity .15s}}

/* loading */
.top{position:sticky}
.busy{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden;background:transparent}
.busy i{position:absolute;top:0;bottom:0;width:30%;background:var(--accent);border-radius:2px;animation:busy 1s ease-in-out infinite}
@keyframes busy{0%{left:-30%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.busy i{animation:none;left:0;width:100%;opacity:.6}}
.sk{background:linear-gradient(90deg,var(--sunk) 0%,var(--surface) 50%,var(--sunk) 100%);background-size:200% 100%;border-radius:10px;height:64px;animation:sk 1.2s ease-in-out infinite}
.col .sk{background:linear-gradient(90deg,var(--line) 0%,var(--surface) 50%,var(--line) 100%);background-size:200% 100%}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
main[aria-busy="true"] .board{transition:opacity .2s}

/* recipe colours */
.card.rc{border-left-color:var(--rc);background:color-mix(in srgb,var(--rc) 7%,var(--surface))}
.card.rc .dots i.on{background:color-mix(in srgb,var(--rc) 45%,var(--surface))}
.card.rc .dots i.cur{background:var(--rc)}
.card.rc .dots i{background:color-mix(in srgb,var(--rc) 18%,var(--surface))}
.card.rc .rname{color:color-mix(in srgb,var(--rc) 70%,var(--ink));font-weight:600}
.dots i{width:7px;height:7px}
.pdot{display:none;width:8px;height:8px;border-radius:50%;background:var(--rc);margin-right:5px;vertical-align:middle;flex:0 0 auto}
[style*="--rc"] > span > .pdot,.sheet-h .pdot{display:inline-block}
.pcard.rc{border-left:5px solid var(--rc)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{position:relative;width:32px;height:32px;cursor:pointer}
.sw input[type=radio]{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw input:checked + span{box-shadow:0 0 0 2px var(--ink)}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.sw.none span{background:var(--bg);color:var(--muted);font-weight:700}
.sw.custom{width:auto;display:flex;align-items:center}
.sw.custom input[type=radio]{width:0;height:0}
.sw.custom input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;padding:2px;background:var(--surface);cursor:pointer}
.sw.custom input[type=radio]:checked ~ input[type=color]{box-shadow:0 0 0 2px var(--ink)}

/* lab */
.labwrap{display:flex;flex-direction:column;height:calc(100dvh - 58px)}
.labwrap.hidden{display:none}
.labbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--accent-soft);color:var(--ink);font-size:14px;border-bottom:1px solid var(--line)}
.labbar.hidden{display:none}
#labFrame,#rbFrame{flex:1;width:100%;border:0;background:var(--bg)}

.labbody{position:relative;flex:1;display:flex;min-height:0}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);overflow:auto;padding:16px;z-index:5}

.li.fresh{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* stock */
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--rc,var(--line));border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}

.onhand > div:first-child{flex:1;min-width:140px}
.onhand .big{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px}
.strip .cell{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--ok-soft);border-radius:7px;padding:4px 0;font-size:11px;min-width:0}
.strip .cell b{font-size:13px;font-family:var(--f-mono)}
.strip .cell .dw{color:var(--muted);font-weight:700;text-transform:uppercase}
.strip .cell .dn{color:var(--muted)}
.strip .cell .nd{color:var(--muted);font-family:var(--f-mono)}
.strip .cell.low{background:var(--sea-soft)}
.strip .cell.short{background:var(--warn-soft);color:var(--warn)}
.strip .cell.inc{box-shadow:inset 0 0 0 2px var(--accent)}
.warnt{color:var(--warn)}
@media (max-width:560px){.strip{grid-template-columns:repeat(7,minmax(0,1fr))}}

/* header: sections + grouped nav */
.top-in{gap:10px 18px}
.sect{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.sbtn{border:0;background:transparent;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--muted);padding:6px 12px;border-radius:11px;white-space:nowrap}
.sbtn b{font-weight:800}
.sbtn.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.sbtn.on b{color:var(--accent)}
.sbtn.lab.on{background:var(--lab);color:#fff}
.sbtn.lab.on b{color:#fff}
.sbtn:not(.on):hover{color:var(--ink)}
.subnav{flex:1 1 420px;display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.nav.tools{background:transparent;gap:6px;padding:0}
.nav.tools button{border:1px solid var(--line);background:var(--surface)}
.nav.tools button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
:root{--lab:#5e2f8c;--lab-soft:#efe6f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lab:#9a63d1;--lab-soft:#2c1f3a}}
:root[data-theme="dark"]{--lab:#9a63d1;--lab-soft:#2c1f3a}
body[data-section="lab"] .top{background:color-mix(in srgb,var(--lab-soft) 85%,var(--bg));border-bottom-color:color-mix(in srgb,var(--lab) 30%,var(--line))}

body.in-lab{overflow:hidden}
.labbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;font-size:14px;color:var(--ink);padding:0;background:transparent;border:0}
.labbar.pick{background:var(--accent-soft);border-radius:10px;padding:6px 10px}
.labwrap{height:auto}
@media (max-width:700px){.sbtn{font-size:17px;padding:5px 9px}.labtip{display:none}.subnav{flex-basis:100%}}
@media (max-width:560px){
  .top-in{padding:8px 12px;gap:6px}
  .subnav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px}
  .subnav::-webkit-scrollbar{display:none}
  .subnav .spacer{flex:0 0 2px}
  .nav button{padding:6px 9px;font-size:14px}
  .nav.tools{gap:4px}
}

/* sales */
.srows{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:minmax(150px,1fr) 68px 148px 68px 112px 172px 48px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow.h{text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:0;padding:0}
.srow input[type=number]{text-align:center;padding:6px}
.srow .stepper input{width:64px}
.sname{display:flex;flex-direction:column;min-width:0}
.sname > span:first-child{font-weight:600}
[style*="--rc"] > .sname > span > .pdot{display:inline-block}
.soldout{display:flex;gap:4px;align-items:center}
.soldout input{width:108px;padding:6px}
.srow[data-state="pending"] .sstate::after{content:"…"}
@media (max-width:700px){.srow{grid-template-columns:1fr 1fr;row-gap:6px}.srow.h{display:none}.srow .sname{grid-column:1/-1}.srow .sstate{display:none}}
.stbl td.num{text-align:right;white-space:nowrap;font-family:var(--f-mono);font-size:13px}
.wbars{display:flex;gap:4px;align-items:flex-end;height:56px}
.wb{display:flex;flex-direction:column;align-items:center;gap:2px;width:18px}
.wb span{font-size:10px;color:var(--muted)}
.wcol{position:relative;width:14px;height:40px;background:var(--sunk);border-radius:4px 4px 0 0}
.wcol .av{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--accent) 55%,var(--surface));border-radius:4px 4px 0 0}
.wcol .av.out{background:var(--accent)}
.wcol .tq{position:absolute;left:-3px;right:-3px;height:2px;background:var(--ink);border-radius:1px}
.sugg{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px}
.srow.h span:first-child{text-align:left}

.leftbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-weight:600;font-size:14px;min-height:36px;white-space:nowrap}
.leftbtn.todo{border-color:var(--sea);background:var(--sea-soft);color:var(--sea)}
.leftbtn .small{font-weight:500}
.lsplit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.lsplit.hidden{display:none}
.lsplit label.f{width:110px}
.lsplit input{text-align:center;padding:6px}
.lsplit .unassigned{margin-left:auto;align-self:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tile b{font-family:var(--f-display);font-size:26px;line-height:1.1}
.tile small{color:var(--muted);font-size:12px}
.lbreak{white-space:normal}
@media (max-width:700px){.srow{grid-template-columns:1fr 1fr}.lsplit label.f{width:calc(50% - 6px)}}
.leftbtn span{pointer-events:none}

/* ===== Recipes section ===== */
:root{--rb:#9a5b13;--rb-soft:#f8ebd8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rb:#e3a356;--rb-soft:#33261a}}
:root[data-theme="dark"]{--rb:#e3a356;--rb-soft:#33261a}
.sbtn.rb.on{background:var(--rb);color:#fff}
.sbtn.rb.on b{color:#fff}
body[data-section="recipes"] .top{background:color-mix(in srgb,var(--rb-soft) 85%,var(--bg));border-bottom-color:color-mix(in srgb,var(--rb) 30%,var(--line))}
body[data-section="recipes"] .busy i{background:var(--rb)}
body[data-section="recipes"] .nav button[aria-current="page"]{color:var(--rb)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.rsearch{flex:1 1 220px;max-width:360px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px}
.addcard{align-items:center;justify-content:center;color:var(--muted);min-height:84px;border-style:dashed}
.rpage{max-width:1040px}
.rhead{padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.rhead.rc{border-left:5px solid var(--rc);padding-left:14px}
.rhead .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rhead h2{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;margin:4px 0 8px}
.rfacts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.rfacts b{color:var(--ink);margin-right:4px}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px}
@media (max-width:760px){.rgrid{grid-template-columns:minmax(0,1fr);gap:18px}}
.rcol h3{font-size:20px;margin:6px 0 10px}
.rcol h4{font-size:15px;margin:16px 0 6px}
.rscale{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.rscale .chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:14px;min-height:32px}
.rscale .chip[aria-pressed="true"]{background:var(--rb);border-color:var(--rb);color:#fff}
.rtarget{display:flex;align-items:center;gap:6px;font-size:14px;margin-left:auto}
.rtarget input{width:84px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:15px}
.igrp{font-family:var(--f-mono);font-size:11px!important;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px!important}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.ilist .iname{flex:1;min-width:0}
.ilist .iname .muted{font-size:13px}
.ilist b{white-space:nowrap;font-variant-numeric:tabular-nums}
.method{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:9px;font-size:15px;line-height:1.5}
.method li::marker{font-family:var(--f-mono);font-size:13px;color:var(--rb);font-weight:600}
.oven{margin-top:14px;padding:12px;border-radius:12px;background:var(--rb-soft)}
.oven h4{margin:0 0 6px!important}
.ost{display:flex;gap:12px;align-items:baseline;padding:3px 0;font-size:15px}
.ost b{min-width:64px;font-variant-numeric:tabular-nums}
.rnotes{white-space:pre-line;font-size:15px;margin:0}
.bing{display:grid;grid-template-columns:minmax(0,2fr) minmax(64px,.7fr) minmax(70px,.8fr) minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1.3fr) auto;gap:6px;margin-bottom:6px;align-items:center}
.bing input,.bing select,.boven input{min-width:0;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px}
@media (max-width:640px){.bing{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px 78px;padding-bottom:8px;border-bottom:1px dashed var(--line)}.bing [data-f=name]{grid-column:1 / 3}.bing [data-f=grp]{grid-column:1}.bing [data-f=note]{grid-column:2 / 5}.bing [data-f=kos]{grid-column:1 / 4}.bing .btn{justify-self:end}}
.bing [data-f=kos].linked{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.bnewbtn{white-space:nowrap;flex:none}
@media (max-width:700px){.bnewbtn .lg{display:none}}
.cards .pcard h4{text-transform:none;letter-spacing:normal;color:var(--ink);font-size:16px}
.boven{display:grid;grid-template-columns:80px 80px minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
@media print{
  .top,.noprint,#busy,.toast{display:none!important}
  body,html{background:#fff;color:#000}
  .rgrid{grid-template-columns:1fr 1.3fr;gap:20px}
  .oven{background:#f3f3f3}
  #main{padding:0!important}
}
/* ===== Recipes page (recipes.html) ===== */
body.rbpage{background:var(--bg)}
.rbpage main{max-width:1180px}
.rbtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 14px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--sunk);border-radius:10px}

.rtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 10px}

.mfrom .li{background:var(--surface)}
.mfrom .li > b{font-variant-numeric:tabular-nums;white-space:nowrap}
.mfrom .linkbtn{color:var(--ink);text-decoration:none;font-size:15px}
.mfrom .linkbtn .pdot,.tst[style*="--rc"] .pdot{display:inline-block}
.rhead + .rsec{border-top:0;margin-top:0}
.tline{display:flex;flex-direction:column;gap:8px}
.tday{display:flex;gap:12px;align-items:flex-start}

/* ===== Shopping ===== */
.shopr{margin:0 0 8px;align-items:center}

.shopr .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shopcus{display:inline-flex;gap:4px;align-items:center;font-size:14px;color:var(--muted)}
.shopcus input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px;font-size:14px;min-width:0}
.shop .seg{margin:4px 0 6px}

.shopfor .pdot{display:inline-block}

@media print{.shopli .have{border:0}.shop .bar .btn{display:none}}
.ilist .mh{text-transform:none;letter-spacing:0;font-weight:400;padding:0;font-size:12px;color:var(--muted);white-space:nowrap;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.ksug{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:-2px 0 4px}
.ksug[hidden]{display:none}
.kchip{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;min-height:28px}

.sthead{display:grid;grid-template-columns:auto auto minmax(0,1fr) 120px 64px auto;gap:6px;align-items:center}
.grip{cursor:grab;color:var(--muted);font-size:16px;padding:0 2px;user-select:none;touch-action:none}
.stno{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:18px}
.stmove{display:inline-flex;gap:2px}
.steprow textarea{width:100%;margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px;min-height:38px;resize:vertical}
.stopts{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:4px;font-size:13px;color:var(--muted)}

.stuses{flex-basis:100%}
@media (max-width:560px){.sthead{grid-template-columns:auto auto minmax(0,1fr)}.sthead select,.sthead [data-f=minutes]{grid-column:span 1}.stmove{grid-column:1 / -1;justify-content:flex-end}}
.bing{grid-template-columns:minmax(0,2fr) minmax(64px,.7fr) minmax(70px,.8fr) minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1.3fr) minmax(0,1.2fr) auto}
.bing [data-f=step]{min-width:0;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 4px;color:var(--muted)}
.bing [data-f=step].set{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
@media (max-width:640px){.bing [data-f=step]{grid-column:1 / 3}}
.mday{font-family:var(--f-mono);font-size:12px!important;letter-spacing:.06em;text-transform:uppercase;color:var(--rb);margin:14px 0 6px!important}
.method.steps li p{margin:3px 0 0;color:var(--ink)}
.suses{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:13px;color:var(--muted)}
.suses b{color:var(--ink);font-weight:600}
.tsteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
/* ===== costs ===== */
.ilist .icost{position:relative;min-width:66px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:4px;white-space:nowrap}
.ilist .icost i{position:absolute;left:0;bottom:-3px;height:3px;background:color-mix(in srgb,var(--rb) 55%,transparent);border-radius:2px}
.ilist .icost.none{opacity:.5}
.ptable{display:flex;flex-direction:column;max-width:560px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.prow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:15px}
.prow:last-child{border-bottom:0}
.prow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.prow.total{background:var(--sunk);font-weight:700}
.prow.ours input{width:90px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:15px}
.prow.ours > span{display:inline-flex;gap:8px;align-items:center}

.kpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.kopt{position:relative;display:flex}
.kopt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.kopt span{flex:1;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.kopt small{color:var(--muted);font-size:12px}
.kopt input:checked+span{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.kopt input:focus-visible+span{outline:2px solid var(--accent)}

  const row = { name: g("name").trim(), kind: g("kind"), status: g("status") || "idea", yield_qty: g("yield_qty") === "" ? null : +g("yield_qty"), yield_unit: g("yield_unit") || null, yield_note: g("yield_note").trim() || null,
    method: g("method").trim() || null, oven, notes: g("notes").trim() || null, source: g("source").trim() || null, origin: g("origin").trim() || null, color: g("color") || null, updated_at: new Date().toISOString() };
  if (!row.name) throw new Error("Give the component a name.");
  let id = r.id;
  if (id) await DB.upd("bk_recipes", id, row); else { row.position = S.recipes.length + 1; if (r.parent_id) row.parent_id = r.parent_id; id = (await DB.ins("bk_recipes", row))[0].id; }
  const { changed: stepsChanged, ids: keyId } = await saveSteps(id, $$("#rDays [data-step]", form).map((el, i) => ({ key: el.dataset.key, id: el.dataset.step, day: +$("[data-f=day]", el).value || 1, title: $("[data-f=title]", el).value.trim(), time_hint: $("[data-f=time_hint]", el).value || null, minutes: $("[data-f=minutes]", el).value === "" ? null : +$("[data-f=minutes]", el).value, body: $("[data-f=body]", el).value.trim() || null, card: $("[data-f=card]", el).checked || $("[data-f=card]", el).disabled, hands_off: $("[data-f=hands_off]", el).checked, position: i })));
  await saveIngs(id, $$("#bIngs [data-ing]", form).map(el => { const v = f => $(`[data-f=${f}]`, el).value.trim(); return { name: v("name"), qty: v("qty") === "" ? null : +v("qty"), unit: v("unit") || "g", grp: v("grp") || null, note: v("note") || null, kos: v("kos"), step_id: keyId.get(v("step")) || null }; }));
  await load(); closeSheet(); toast("Saved."); changed(stepsChanged || !!usesOf(id).length); open(id, 1, null);
}
/* returns { changed, ids: step key → saved step id } */
async function saveSteps(id, list) {
  const steps = list.filter(s => s.title || s.body).map(s => ({ ...s, title: s.title || s.body.split(/[.\n]/)[0].slice(0, 60) })), old = stepsOf(id), ids = new Map();
  const F = ["day", "title", "time_hint", "minutes", "body", "card", "hands_off", "position"];
  const same = old.length === steps.length && old.every((o, i) => o.id === steps[i].id && F.every(f => (o[f] ?? null) === (steps[i][f] ?? null) || (f === "card" && (o.card !== false) === steps[i].card) || (f === "hands_off" && !!o.hands_off === steps[i].hands_off)));
  steps.forEach(s => { if (s.id !== "new") ids.set(s.key, s.id); });
  if (same) return { changed: false, ids };
  await DB.del("bk_recipe_steps", old.filter(o => !steps.some(s => s.id === o.id)).map(o => o.id));
  for (const s of steps.filter(s => s.id !== "new")) { const { id: sid, key, ...rest } = s; await DB.upd("bk_recipe_steps", sid, rest); }
  const ns = steps.filter(s => s.id === "new");
  if (ns.length) { const made = await DB.ins("bk_recipe_steps", ns.map(({ id: _, key, ...rest }) => ({ ...rest, recipe_id: id }))); ns.forEach((s, i) => ids.set(s.key, made[i].id)); }
  return { changed: true, ids };
}
async function saveIngs(id, list) {
  await kitchen();
  const find = t => t ? S.kIngr.find(x => x.name.toLowerCase() === t.toLowerCase()) : null;
  /* kos = the Kitchen OS field from the editor (undefined for copies and drafts, which keep their link) */
  const link = i => { const k = find(i.kos) || find(i.name); return k ? k.id : i.kos === undefined ? (i.ingredient_id || null) : null; };
  const rows = list.filter(i => i.name).map((i, n) => ({ recipe_id: id, name: i.name, ingredient_id: link(i), qty: i.qty ?? null, unit: i.unit || "g", grp: i.grp || null, note: i.note || null, step_id: i.step_id || null, position: n + 1 }));
  await DB.del("bk_recipe_ingredients", S.ings.filter(i => i.recipe_id === id).map(i => i.id));
  if (rows.length) await DB.ins("bk_recipe_ingredients", rows);
}

/* ---------- tests ---------- */
function planSheet(r) {
  const tm = addDays(todayISO(), 1);
  openSheet(`${head("Plan a test bake", esc(r.name))}
    <div class="list"><div class="grid2"><label class="f">Day<input type="date" id="tpDate" value="${tm}"></label>
      <label class="f">Time<select id="tpTod"><option value="">Any time</option>${TOD.map(x => `<option>${x}</option>`).join("")}</select></label></div>
      <label class="f">What are you trying this time? <span class="small muted">optional</span><input type="text" id="tpChanges" placeholder="e.g. less sugar, rye instead of spelt"></label>
      <p class="small muted">Adds a “Test bake” card to the planner on that day. Tap it there to open the recipe and log how it went.</p>
      <div class="row"><button type="button" class="btn primary" data-act="tpsave">Add to planner</button></div></div>`);
}
async function savePlan() {
  const r = rec(V.id), date = $("#tpDate").value; if (!r || !date) return;
  const changes = $("#tpChanges").value.trim() || null;
  const task = (await DB.ins("bk_tasks", { date, title: `Test bake: ${r.name}`, kind: "custom", time_hint: $("#tpTod").value || null, notes: changes ? `Trying: ${changes}` : "Test bake from Recipes" }))[0];
  await DB.ins("bk_recipe_trials", { recipe_id: r.id, date, task_id: task.id, status: "planned", changes });
  if ((r.status || "idea") === "idea") await DB.upd("bk_recipes", r.id, { status: "testing", updated_at: new Date().toISOString() });
  await load(); closeSheet(); changed(); render();
  toastLink(`Test bake added to ${fmtD(date)}.`, "See it in the planner", () => post("rb:goto", { view: "week", date }));
}
function trialSheet(r, t) {
  t = t || { date: todayISO(), result: null, changes: "", notes: "", status: "done" };
  const st = r.status || "idea";
  openSheet(`${head(t.id ? (t.status === "planned" ? "How did it go?" : "Edit test") : "Log a test", esc(r.name))}
    <div class="list"><label class="f">Day<input type="date" id="trDate" value="${t.date}"></label>
      <div class="f"><span>Result</span><div class="seg" role="radiogroup" aria-label="Result">${Object.entries(RESULT).map(([k, v]) => `<label class="segopt"><input type="radio" name="trRes" value="${k}" ${t.result === k ? "checked" : ""}><span>${v[0]}</span></label>`).join("")}</div></div>
      <label class="f">What did you change?<input type="text" id="trChanges" value="${esc(t.changes || "")}" placeholder="e.g. 20% less sugar, baked 5 min longer"></label>
      <label class="f">Notes<textarea id="trNotes" placeholder="Texture, taste, what to try next">${esc(t.notes || "")}</textarea></label>
      ${st !== "keeper" ? `<label class="chk2"><input type="checkbox" id="trKeep"> Mark it as a keeper (it worked really well)</label>` : ""}
      <div class="row"><button type="button" class="btn primary" data-act="trsave" data-id="${t.id || ""}">Save</button><span class="spacer"></span>${t.id ? `<button type="button" class="btn warn" data-act="trdel" data-id="${t.id}">Delete</button>` : ""}</div></div>`,
    sh => { sh.querySelectorAll("[name=trRes]").forEach(el => el.addEventListener("change", () => { const k = sh.querySelector("#trKeep"); if (k) k.checked = el.value === "great" && el.checked; })); });
}
async function saveTrial(id) {
  const r = rec(V.id); if (!r) return;
  const res = $("[name=trRes]:checked")?.value || null;
  const row = { recipe_id: r.id, date: $("#trDate").value || todayISO(), result: res, changes: $("#trChanges").value.trim() || null, notes: $("#trNotes").value.trim() || null, status: "done" };
  const old = id ? S.trials.find(t => t.id === id) : null;
  if (old) await DB.upd("bk_recipe_trials", id, row); else await DB.ins("bk_recipe_trials", row);
  if (old && old.task_id) { try { await DB.upd("bk_tasks", old.task_id, { status: "done" }); } catch {} }
  const keep = $("#trKeep")?.checked;
  const next = keep ? "keeper" : (r.status || "idea") === "idea" ? "testing" : null;
  if (next) await DB.upd("bk_recipes", r.id, { status: next, updated_at: new Date().toISOString() });
  await load(); closeSheet(); changed(); render(); toast(keep ? "Saved as a keeper ★" : "Test logged.");
}
async function makeVariation(r) {
  const row = { name: `${r.name} (variation)`, kind: r.kind, status: "testing", yield_qty: r.yield_qty, yield_unit: r.yield_unit, yield_note: r.yield_note, method: r.method, oven: r.oven || [], notes: r.notes, source: r.source, origin: r.origin, color: r.color, parent_id: r.id, position: S.recipes.length + 1 };
  const id = (await DB.ins("bk_recipes", row))[0].id;
  const old = stepsOf(r.id), st = old.map(({ id: _, recipe_id: __, ...s }) => ({ ...s, recipe_id: id }));
  const made = st.length ? await DB.ins("bk_recipe_steps", st) : [], map = new Map(old.map((o, i) => [o.id, made[i]?.id]));
  await saveIngs(id, ingsOf(r.id).map(i => ({ ...i, step_id: i.step_id ? map.get(i.step_id) || null : null })));
  await load(); changed(); open(id, 1, `A copy of ${r.name}. Change what you want to try, then plan a test bake.`); await kitchen(); editSheet(id);
}
/* drafts arriving from the Taste Lab or a planner idea */
let lastDraft = { key: "", at: 0 };
async function addDraft(d) {
  const key = (d.origin || "") + "|" + (d.name || ""); if (key === lastDraft.key && Date.now() - lastDraft.at < 4000) return; lastDraft = { key, at: Date.now() };
  const row = { name: (d.name || "Untitled idea").slice(0, 120), kind: RKIND1[d.kind] ? d.kind : "bake", status: d.status || "idea", yield_qty: d.yield_qty ?? null, yield_unit: d.yield_unit || null, yield_note: d.yield_note || null,
    method: (Array.isArray(d.method) ? d.method.join("\n") : d.method) || null, oven: d.oven || [], notes: d.notes || null, source: d.source || null, origin: d.origin || null, position: S.recipes.length + 1 };
  const id = (await DB.ins("bk_recipes", row))[0].id;
  if ((d.ings || []).length) await saveIngs(id, d.ings);
  await load(); changed();
  open(id, 1, `Added from ${d.origin || "an idea"}. Make it yours with Edit, then plan a test bake.`);
}
function toastLink(msg, label, fn) {
  toast(msg); const t = $("#toast"); if (!t) return;
  const b = document.createElement("button"); b.type = "button"; b.className = "toastbtn"; b.textContent = label; b.onclick = () => { t.hidden = true; fn(); }; t.appendChild(b);
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 6000);
}

/* ---------- actions ---------- */
const ACT = {
  close: () => closeSheet(),
  rtab: el => { V.tab = el.dataset.t; store.set("bk.rtab", V.tab); V.q = ""; V.id = V.pid = null; render(); },
  vstatus: el => { V.status = el.dataset.k; renderList(); },
  bopen: el => open(el.dataset.id),
  popen: el => openP(el.dataset.id),
  bback: () => { V.id = null; V.pid = null; V.from = null; render(); window.scrollTo({ top: 0 }); },
  bnew: el => guard(async () => { await kitchen(); editSheet(null, { kind: el.dataset.k || "bake" }); }),
  bedit: el => guard(async () => { await kitchen(); editSheet(el.dataset.id); }),
  pnew: el => productSheet(null, el.dataset.k || "regular"),
  pedit: el => productSheet(el.dataset.id),
  pdel: el => guard(async () => { const p = prod(el.dataset.id); if (!p || !confirm(`Delete ${p.name}? Its planned days and steps go too. To pause it, untick Active instead.`)) return; await DB.del("bk_products", [p.id]); await load(); closeSheet(); changed(true); V.pid = null; render(); toast("Product deleted."); }),
  padd: () => { const p = prod(V.pid); if (p) addDaySheet(p); },
  adsave: () => guard(saveAddDay),
  ptmpl: () => post("rb:goto", { view: "setup", tab: "template" }),
  costset: () => post("rb:goto", { view: "setup", tab: "settings" }),
  kpick: el => { const row = el.closest("[data-ing]"); $("[data-f=kos]", row).value = el.dataset.v; ksug(row); },
  knone: el => { const row = el.closest("[data-ing]"); row.dataset.nosug = "1"; ksug(row); },
  addpart: () => $("#pParts").insertAdjacentHTML("beforeend", $("#partTpl").innerHTML),
  bading: () => { $("#bIngs").insertAdjacentHTML("beforeend", $("#bIngTpl").innerHTML); refreshStepRefs($("#bForm")); const rows = $$("#bIngs [data-ing]"); const last = rows[rows.length - 1], prev = rows[rows.length - 2]; if (prev) $("[data-f=grp]", last).value = $("[data-f=grp]", prev).value; $("[data-f=name]", last).focus(); },
  badov: () => $("#bOven").insertAdjacentHTML("beforeend", $("#bOvTpl").innerHTML),
  addstep: el => { const box = el.closest(".stepday"); $(".dsteps", box).insertAdjacentHTML("beforeend", $("#stepTpl").innerHTML.replace(/data-key="[^"]*"/, `data-key="n${uid()}"`)); relabelDays(el.closest("form")); const t = $$("[data-f=title]", box); t[t.length - 1]?.focus(); },
  addday: el => { const days = $("#rDays"); const n = $$(".stepday", days).length + 1; days.insertAdjacentHTML("beforeend", `<div class="stepday" data-day="${n}"><h5></h5><div class="dsteps">${$("#stepTpl").innerHTML.replace(/data-key="[^"]*"/, `data-key="n${uid()}"`)}</div><button type="button" class="btn sm" data-act="addstep">+ Step</button></div>`); relabelDays(el.closest("form")); },
  stup: el => moveStep(el, -1),
  stdown: el => moveStep(el, 1),
  splitmethod: el => { const form = el.closest("form"), ta = form.querySelector("[name=method]"); const lines = ta.value.split(/\n+/).map(x => x.trim()).filter(Boolean); if (!lines.length) return;
    let box = $("#rDays .stepday", form); if (!box) return; const list = $(".dsteps", box);
    for (const l of lines) { list.insertAdjacentHTML("beforeend", $("#stepTpl").innerHTML.replace(/data-key="[^"]*"/, `data-key="n${uid()}"`)); const row = list.lastElementChild; $("[data-f=title]", row).value = l.split(/(?<=[.!?])\s/)[0].replace(/[.!?]$/, "").slice(0, 70); $("[data-f=body]", row).value = l; }
    ta.value = ""; el.closest(".sec").hidden = true; relabelDays(form); toast(`${lines.length} steps added to day 1. Move them where they belong, then save.`); },
  rmrow: el => { const row = el.closest("[data-ing],[data-oven],[data-part],[data-step]"); const form = el.closest("form"); row.remove(); if (form && $("#rDays", form)) { const boxes = $$("#rDays .stepday", form); const last = boxes[boxes.length - 1]; if (boxes.length > 1 && last && !$("[data-step]", last)) last.remove(); relabelDays(form); } },
  bdelete: el => guard(async () => { const r = rec(el.dataset.id); if (!r) return; const u = [...new Set(usesOf(r.id).map(x => x.p.name))]; if (!confirm(`Delete ${r.name}?${u.length ? ` ${u.join(", ")} will lose this component.` : ""}`)) return; await DB.del("bk_recipes", [r.id]); await load(); closeSheet(); changed(!!u.length); V.id = null; render(); toast("Deleted."); }),
  bx: el => { V.x = +el.dataset.x; renderRecipe(rec(V.id)); },
  bprint: () => window.print(),
  bstatus: el => guard(async () => { const r = rec(V.id); if (!r) return; await DB.upd("bk_recipes", r.id, { status: el.dataset.k, updated_at: new Date().toISOString() }); await load(); changed(); render(); }),
  bvar: () => guard(async () => { const r = rec(V.id); if (r) await makeVariation(r); }),
  bidea: () => { const r = rec(V.id); if (!r) return; post("rb:idea", { text: r.name, id: r.id }); },
  tplan: () => { const r = rec(V.id); if (r) planSheet(r); },
  tpsave: () => guard(savePlan),
  tlog: () => { const r = rec(V.id); if (r) trialSheet(r); },
  tedit: el => { const r = rec(V.id), t = S.trials.find(x => x.id === el.dataset.id); if (r && t) trialSheet(r, t); },
  trsave: el => guard(() => saveTrial(el.dataset.id || null)),
  trdel: el => guard(async () => { if (!confirm("Delete this test?")) return; await DB.del("bk_recipe_trials", [el.dataset.id]); await load(); closeSheet(); changed(); render(); })
};
document.addEventListener("click", e => { const a = e.target.closest("[data-act]"); if (!a) return; const fn = ACT[a.dataset.act]; if (fn) { e.preventDefault(); fn(a); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#scrim")) closeSheet(); });
document.addEventListener("input", e => {
  if (e.target.id === "rSearch") { V.q = e.target.value; renderCards(); }
  if (e.target.closest?.("#rDays") && e.target.dataset.f === "title") refreshStepRefs(e.target.closest("form"));
  const row = e.target.closest?.(".bing[data-ing]");
  if (row && ["name", "kos"].includes(e.target.dataset.f)) { if (e.target.dataset.f === "name") delete row.dataset.nosug; clearTimeout(KSUG_T); KSUG_T = setTimeout(() => ksug(row), 250); }
  if (e.target.id === "pSearch") { V.q = e.target.value; const pos = e.target.selectionStart; renderProducts(); const s = $("#pSearch"); s.focus(); try { s.setSelectionRange(pos, pos); } catch {} }
});
document.addEventListener("change", e => {
  if (e.target.matches?.("#bIngs [data-f=step]")) { e.target.dataset.cur = e.target.value; refreshStepRefs(e.target.closest("form")); }
  if (e.target.id === "rTarget") { const r = rec(V.id), y = recYield(r); const v = +e.target.value; if (y && v > 0) { V.x = v / y.q; renderRecipe(r); } }
  if (e.target.id === "pPrice") { const p = prod(V.pid), v = e.target.value === "" ? null : Math.max(0, +e.target.value); if (p) guard(async () => { await DB.upd("bk_products", p.id, { price: v }); await load(); renderProduct(prod(p.id)); changed(); toast("Price saved."); }); }
  if (e.target.id === "pN") { const v = Math.round(+e.target.value); if (v > 0) { V.n = v; renderProduct(prod(V.pid)); } }
});
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data) return;
  const d = e.data;
  if (d.type === "rb:open") { const known = !d.id || d.id === "products" || d.id === "components" || (d.id.startsWith("p/") ? prod(d.id.slice(2)) : rec(d.id)); if (!known) guard(load).then(() => openKey(d.id, d.x, d.from)); else openKey(d.id, d.x, d.from); }
  if (d.type === "rb:list") { V.id = V.pid = null; V.from = null; render(); }
  if (d.type === "rb:reload") guard(load).then(render);
  if (d.type === "rb:draft") guard(() => addDraft(d.draft || {}));
  if (d.type === "rb:log") { const t = S.trials.find(x => x.id === d.trial); if (t) { V.pid = null; V.id = t.recipe_id; render(); trialSheet(rec(t.recipe_id), t); } }
});
(async () => {
  if (!EMBED) return;
  const th = store.get("bk.theme", null); if (th) document.documentElement.dataset.theme = th;
  await guard(async () => {
    if (!(await AUTH.session())) { $("#main").innerHTML = `<p class="muted">Sign in on the planner first.</p>`; return; }
    await load(); render(); kitchen().then(() => { if (V.pid && prod(V.pid)) renderProduct(prod(V.pid)); });
  });
  post("rb:ready");
})();
