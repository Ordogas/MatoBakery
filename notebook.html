<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>Bakery Notebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a notebook — slim nav rail on the left, the page in the middle, what the page works out (tasks, costs, pairings) beside it; stacks on phones */
:root{
  --bg:#eef0eb; --paper:#fbfbf8; --ink:#1d2320; --muted:#5f6a64; --line:#d6dad2; --soft:#e4e8e0;
  --link:#2450c4; --red:#b8361f; --qbg:#e6ecf9; --qfg:#1f3f99; --ok:#2f7a4a; --warn:#a2610b; --okbg:#e2f1e6; --warnbg:#f8ecd8; --redbg:#f8e3de;
  --lab:#6b4fa3; --labbg:#eee8f7;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121514; --paper:#1a1e1c; --ink:#e4e8e3; --muted:#9aa49e; --line:#2d3330; --soft:#232826;
  --link:#86a6ff; --red:#ff806a; --qbg:#1f2a47; --qfg:#b9cbff; --ok:#6fcf8f; --warn:#f0b35a; --okbg:#173022; --warnbg:#33270f; --redbg:#3a1d17;
  --lab:#c3a8f5; --labbg:#2a2238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --paper:#1a1e1c; --ink:#e4e8e3; --muted:#9aa49e; --line:#2d3330; --soft:#232826;
  --link:#86a6ff; --red:#ff806a; --qbg:#1f2a47; --qfg:#b9cbff; --ok:#6fcf8f; --warn:#f0b35a; --okbg:#173022; --warnbg:#33270f; --redbg:#3a1d17;
  --lab:#c3a8f5; --labbg:#2a2238; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px}
.brand{font:700 21px/1.1 var(--f-display);letter-spacing:-.01em}
.brand small{display:block;font:400 12px/1.4 var(--f-body);color:var(--muted);letter-spacing:0;margin-top:4px}
.search{position:relative}
.search input,.bigsearch{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:15px}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .12);z-index:30;overflow:hidden;min-width:260px}
.results button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer}
.results button[aria-selected="true"],.results button:hover{background:var(--soft)}
.results small{color:var(--muted);white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:8px;font-weight:700}
.nav a:hover{background:var(--soft)}
.nav a[aria-current="page"]{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.nav .n{font:600 12px var(--f-mono);color:var(--muted)}
.railfoot{margin-top:auto;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
main{min-width:0;padding-block:26px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px}
h1{font:700 clamp(28px,4vw,38px)/1.1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 19px/1.25 var(--f-display);margin:0;text-wrap:balance}
h3{font:700 16px/1.3 var(--f-display);margin:14px 0 4px}
.eyebrow{font:600 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.head .t{display:flex;flex-direction:column;gap:8px;min-width:0}
.lede{margin:-8px 0 18px;max-width:70ch;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.4;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 9px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card+.card{margin-top:16px}
.cols>.card,.grid>.card{margin-top:0}
.card>h2{margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card.lab{border-color:color-mix(in srgb,var(--lab) 35%,var(--line))}
.card.lab>h2 .src{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--lab);background:var(--labbg);padding:4px 7px;border-radius:5px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack>.card+.card{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
/* page text */
.body p{margin:0 0 6px;max-width:68ch}
.body ul,.body ol{margin:4px 0 8px;padding-left:22px}
.body li{margin:3px 0;max-width:70ch}
.body .gap{height:8px}
.body .dayh{display:flex;align-items:baseline;gap:8px;border-top:1px dashed var(--line);padding-top:12px;margin-top:14px}
.body .dayh span{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:var(--paper);padding:3px 7px;border-radius:5px}
.props{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0 0 10px;padding:10px 12px;background:var(--soft);border-radius:8px;font-size:15px}
.props span{font:600 12px/1.9 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wl{text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--link) 35%,transparent)}
.wl:hover{border-bottom-color:var(--link)}
.wl.red{color:var(--red);border-bottom:1px dashed color-mix(in srgb,var(--red) 60%,transparent)}
.q{font:600 .86em var(--f-mono);background:var(--qbg);color:var(--qfg);padding:1px 5px;border-radius:4px;white-space:nowrap}
.q.miss{background:var(--redbg);color:var(--red)}
/* plan rows */
.plan{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 0;border-bottom:1px solid var(--soft)}
.plan .pt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;flex:1 1 260px;min-width:0}
.plan .pname{font:700 16px var(--f-display)}
.plan .extra{font-size:14px;color:var(--muted)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.step button{border:0;background:none;width:30px;height:32px;cursor:pointer;font:700 17px var(--f-mono);color:var(--muted)}
.step button:hover{background:var(--soft);color:var(--ink)}
.step input{width:44px;height:32px;border:0;border-inline:1px solid var(--line);text-align:center;font:700 16px var(--f-mono);background:none;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.pick{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--soft) no-repeat right 10px center/9px 6px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(-45deg,transparent 50%,var(--muted) 50%);background-size:5px 5px,5px 5px;background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;border-radius:20px;padding:5px 30px 5px 12px;font-size:14px;font-weight:700;max-width:100%;cursor:pointer}
.pick.need{background-color:var(--warnbg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill{font:600 12px/1 var(--f-mono);padding:5px 7px;border-radius:20px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.red{background:var(--redbg);color:var(--red)} .pill.lab{background:var(--labbg);color:var(--lab)}
.logc{display:flex;gap:6px;align-items:center}
.logc input{width:60px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--paper);font:600 14px var(--f-mono)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{background:var(--redbg);color:var(--red)}
.empty{color:var(--muted);padding:6px 0}
.adder{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.adder .lbl{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chipbtn{border:1px dashed var(--muted);background:none;border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink)}
.chipbtn:hover{border-style:solid;background:var(--soft)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.inl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inl input[type=text],.inl select{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:6px 9px;font-size:14px;min-width:0}
/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:18px}
.strip a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 2px}
.strip a[aria-current="date"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.strip b{font:700 15px var(--f-display)} .strip small{font:600 11px var(--f-mono);opacity:.75}
.strip .today{box-shadow:inset 0 -3px 0 var(--link)}
/* tasks */
.tgroup{padding:12px 0;border-top:1px solid var(--soft)}
.tgroup:first-of-type,.saleh+.tgroup{border-top:0;padding-top:2px}
.saleh{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.saleh:first-of-type{margin-top:4px}
.tgh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px;margin-bottom:6px}
.tgh h3{margin:0;font-size:16px}
.tgh small{color:var(--muted);font-size:13px}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:5px 0}
.task input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--ok)}
.task.done .tb{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.warnbox a{color:inherit;font-weight:700}
.upcoming{display:flex;flex-direction:column}
.up{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--soft);text-decoration:none;color:var(--ink)}
.up:first-child{border-top:0}
.up b{font:700 14px var(--f-display)}
.up span{font-size:14px;color:var(--muted)}
.up:hover b{color:var(--link)}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:top}
th{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--f-mono)}
.wk{table-layout:fixed;min-width:660px}
.wk col.c0{width:150px}
.wk td{text-align:center;padding:4px}
.wk td:first-child,.wk th:first-child{text-align:left}
.wk th.today{color:var(--link)}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;border-radius:8px;text-decoration:none;color:var(--ink);background:var(--soft);padding:4px}
.cell:hover{outline:1px solid var(--muted)}
.cell b{font:700 18px var(--f-mono)}
.cell small{font-size:11px;color:var(--muted);line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.none{background:none;border:1px dashed var(--line);color:var(--muted)}
.cell .lf{color:var(--warn)} .cell .so{color:var(--ok)}
/* buy list */
.buy{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--soft)}
.buy input[type=checkbox]{width:18px;height:18px;margin:0;align-self:center;accent-color:var(--ok)}
.buy.done .nm{text-decoration:line-through;color:var(--muted)}
.buy .meta{grid-column:2/4;font-size:13px;color:var(--muted)}
.buy .amt{font:600 14px var(--f-mono);text-align:right;white-space:nowrap}
.total{display:flex;justify-content:space-between;font:700 15px var(--f-display);padding-top:10px}
/* library */
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px}
.shelf{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.shelf:hover{border-color:var(--muted)}
.shelf.lab{border-color:color-mix(in srgb,var(--lab) 30%,var(--line))}
.shelf .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.shelf b{font:700 17px var(--f-display)}
.shelf .n{font:600 13px var(--f-mono);color:var(--muted)}
.shelf small{color:var(--muted);font-size:13px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.shelfhead{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.shelfhead.lab{color:var(--lab)}
.facets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.facet{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:13px;font-weight:700}
.facet[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.facet .c{font:600 11px var(--f-mono);opacity:.7;margin-left:4px}
.az{display:flex;flex-wrap:wrap;gap:2px;margin:6px 0 4px}
.az button{border:0;background:none;font:600 13px var(--f-mono);padding:3px 6px;border-radius:5px;cursor:pointer;color:var(--link)}
.az button:hover{background:var(--soft)}
.plist{columns:3 240px;column-gap:24px}
.plist .letter{break-after:avoid;font:700 15px var(--f-display);padding:10px 0 2px;color:var(--muted)}
.plist a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;break-inside:avoid;padding:5px 0;border-bottom:1px solid var(--soft);text-decoration:none;color:var(--ink)}
.plist a:hover span:first-child{color:var(--link)}
.plist small{color:var(--muted);font-size:12px;font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.mine::after{content:"●";color:var(--ok);font-size:9px;margin-left:5px;vertical-align:2px}
.badge{font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:5px 7px;border-radius:5px;background:var(--soft);color:var(--muted);align-self:flex-start}
.badge.lab{background:var(--labbg);color:var(--lab)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.sres{margin-top:14px}
.sres h3{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
/* side panels */
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:15px}
.kv .v{font-family:var(--f-mono);text-align:right}
.kv .sum{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--soft);font-size:14px;text-decoration:none}
.chip.plain{color:var(--muted)}
.chip.bold{background:var(--labbg)}
.ctx{padding:7px 0;border-top:1px solid var(--soft);font-size:14px}
.ctx:first-child{border-top:0}
.ctx .from{font-weight:700;margin-right:6px}
.sub{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
.sub:first-child{margin-top:0}
.ratio td:first-child{font-weight:700;width:38%}
/* ideas */
.idea{display:flex;flex-direction:column;gap:8px}
.idea h3{margin:0;font-size:18px}
.idea .why{font-size:14px;color:var(--muted);margin:0}
.idea .row{margin-top:auto}
.sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.selchip{display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:var(--paper);border-radius:20px;padding:4px 6px 4px 12px;font-weight:700;font-size:14px}
.selchip button{border:0;background:none;color:inherit;cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.score{font:600 11px var(--f-mono);color:var(--muted);margin-left:4px}
/* editor */
.editor{position:relative}
.editor textarea{width:100%;min-height:340px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:12px;font:14px/1.6 var(--f-mono)}
.ac{position:absolute;left:12px;right:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .14);z-index:20;max-height:240px;overflow:auto}
.ac button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:6px 10px;cursor:pointer;font-size:14px}
.ac button[aria-selected="true"]{background:var(--soft)}
.help{font-size:13px;color:var(--muted);margin:8px 0 12px;line-height:1.7}
.help code{font:12px var(--f-mono);background:var(--soft);padding:1px 5px;border-radius:4px}
.tpl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.pop{position:fixed;z-index:50;width:min(380px,calc(100vw - 32px));max-height:320px;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgb(0 0 0 / .18);padding:14px 16px;pointer-events:none;font-size:14px}
.pop h2{font-size:17px;margin-bottom:8px}
.pop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--paper))}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:14px}
.crumbs ol{display:flex;flex-wrap:wrap;list-style:none;margin:0;padding:0;gap:4px 6px;font-size:14px;color:var(--muted)}
.crumbs li+li::before{content:"›";margin-right:6px}
.crumbs a{color:var(--link);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.tm{font:600 11px/1 var(--f-mono);background:var(--soft);color:var(--muted);padding:4px 6px;border-radius:5px;white-space:nowrap;display:inline-block}
.body li .tm{float:right;margin:3px 0 0 10px}
.tgh .tm{margin-left:6px}
.bn{font-size:13px;color:var(--muted);white-space:nowrap}
.have{width:92px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--paper);font:600 13px var(--f-mono)}
.buy .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.covered .buy{opacity:.75}
.vlist{display:flex;flex-wrap:wrap;gap:8px 18px}
.vlist label{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px;z-index:60}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:14px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav a{padding:6px 10px}
  .nav .n{display:none}
  .railfoot{display:none}
  main{padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .card{padding:14px}
  .strip{gap:4px}.strip a{padding:6px 0}
  .up{grid-template-columns:76px minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}}

the yolks (amylase) that would otherwise thin the cream overnight.","ratio":[["Milk","1000 g"],["Egg yolks","160–200 g"],["Sugar","180–250 g"],["Cornstarch / flour","70–100 g"],["Butter (optional)","50–100 g"],["Bake-stable version","Starch up to 110–120 g, or bake-stable custard powder"]],"temps":[["Boil","1–2 min after it thickens"],["Cool","below 10 °C fast, film on contact"]],"steps":["Heat milk (infused if wanted) with half the sugar.","Whisk yolks with the rest of the sugar and the starch.","Temper the hot milk into the yolks, return to the pan.","Whisk over heat until it boils and thickens, then keep boiling 1–2 min.","Off the heat, add butter; spread thin on a tray, film on contact, chill fast."],"oven":"Standard pâtissière boils out and can split in long bakes. With extra starch (or custard powder), it holds inside danish and tarts.","r":"Do not hold at room temp","fr":"2–3 days","fz":"Poor; starch weeps after thawing","fails":[["Thin the next day","Not boiled long enough; boil 1–2 min after thickening."],["Lumps","Whisk constantly, sieve, or blend while warm."],["Floury taste","Undercooked starch; cook longer."],["Skin forms","Film directly on the surface."]],"uses":["Danish (bake-stable)","Choux, éclairs, bomboloni","Fruit tarts","Base for diplomat, mousseline, frangipane"],"vary":["Diplomat: pâtissière + 30–50% whipped cream (+ a little gelatin)","Mousseline: pâtissière beaten with 25–50% soft butter","Chiboust: pâtissière + Italian meringue + gelatin","Flavors: praline, chocolate, coffee, infusions"],"eq":["Heavy pan","Whisk","Sieve","Tray + film"],"at":"20 min","tt":"2 h to chill"},{"id":"ang","n":"Crème anglaise","f":"cust","d":1,"o":"no","what":"Pouring custard cooked only with egg yolks. The foundation of crémeux, bavarois and ice cream.","how":"Yolk proteins thicken the liquid between 80 and 85 °C. Above that they scramble, so there is no boiling.","ratio":[["Milk / cream (1:1 for crémeux)","1000 g"],["Egg yolks","160–200 g"],["Sugar","100–200 g"]],"temps":[["Cook to","82–84 °C (coats a spoon)"],["Never","boil"]],"steps":["Heat milk/cream with any infusion.","Whisk yolks and sugar lightly.","Temper, return to the pan, stir constantly to 82–84 °C.","Strain at once into a cold bowl; blend for smoothness."],"oven":"A sauce, not a filling. As crème brûlée/pot de crème it is baked gently in a bain-marie.","r":"No","fr":"2 days","fz":"Not as a sauce","fails":[["Grainy / scrambled","Overheated; blend immediately and strain."],["Thin","Stopped below 80 °C."]],"uses":["Base for crémeux and bavarois","Sauce","Ice cream base"],"vary":["Chocolate crémeux","Bavarois (+ gelatin + whipped cream)","Infused: tea, spice, herbs"],"eq":["Thermometer","Spatula","Sieve","Stick blender"],"at":"15 min","tt":"15 min"},{"id":"cre","n":"Crémeux","f":"cust","d":2,"o":"no","what":"A set, sliceable custard cream. Either an anglaise poured over chocolate, or fruit purée cooked with eggs and finished with butter.","how":"The custard sets with yolk protein, plus cocoa butter (chocolate crémeux) or gelatin and butter (fruit crémeux). It freezes well, which makes it the classic entremet insert.","ratio":[["Chocolate crémeux","Anglaise (milk:cream 1:1, ~15–20% yolks, ~8–10% sugar) poured over chocolate"],["Dark 64–70%","≈ 35–45% of anglaise weight"],["Milk / white","≈ 60–80% of anglaise weight, plus a little gelatin"],["Fruit crémeux","Purée 100 · whole egg/yolk 40–60 · sugar 20–30 · butter 30–50"],["Gelatin for inserts","≈ 0.5–1% of total weight"]],"temps":[["Cook custard","82–84 °C"],["Add butter","35–40 °C"],["Pipe/pour","~30 °C"]],"steps":["Cook the anglaise (or fruit + eggs + sugar) to 82–84 °C.","Pour over chocolate and/or bloomed gelatin; blend to a glossy emulsion.","Fruit version: cool to 35–40 °C, then blend in butter.","Pour into inserts and freeze, or chill at least 4 h."],"oven":"No. It's an insert or a tart filling poured into a baked shell.","r":"1–2 h","fr":"3 days","fz":"Yes, very well","fails":[["Rubbery","Too much gelatin; cut it back."],["Grainy","Overcooked eggs, or emulsion broken; blend hot."],["Curdles (fruit)","Acid + heat: stir constantly, stop at 84 °C."],["Too soft to slice","More chocolate or a little gelatin."]],"uses":["Entremet inserts","Tart filling","Choux","Verrines"],"vary":["Caramel crémeux","Coffee, praline, tea","Mango–passion, apricot, raspberry, blood orange","Brown butter crémeux"],"eq":["Thermometer","Stick blender","Insert moulds"],"at":"25 min","tt":"4 h–overnight"},{"id":"curd","n":"Curd & lemon cream","f":"cust","d":2,"o":"partial","what":"Acidic fruit juice thickened with eggs and enriched with butter. Lemon cream is the version where the butter is blended in cold after cooking.","how":"Egg proteins set the juice at ~80 °C. Blending butter in at ~60 °C makes a light emulsion instead of a dense cooked fat.","ratio":[["Classic curd","Juice 100 · sugar 80–100 · eggs 100 · butter 75–100"],["Hermé lemon cream","Juice ~175 · sugar ~200 · eggs ~200 · butter ~300"],["Baked curd (tarts)","More egg, less butter, often a little cream"]],"temps":[["Cook to","80–82 °C over a bain-marie"],["Blend butter at","~60 °C"]],"steps":["Rub sugar with zest; whisk in eggs and juice.","Cook over a bain-marie, whisking, to 80–82 °C.","Strain; cool to ~60 °C.","Blend in butter in pieces, then keep blending a few minutes; chill 4 h."],"oven":"Butter-emulsion curds split in the oven; fill baked shells. A baked curd (more egg) sets in a tart.","r":"1–2 h","fr":"4 days–1 week","fz":"Yes, up to 2 months","fails":[["Metallic taste","Use stainless or glass, not aluminium."],["Thin","Below 80 °C."],["Greasy","Butter blended too hot."]],"uses":["Lemon tart","Choux, doughnuts","Under meringue","Macarons"],"vary":["Passion fruit, yuzu, lime","Sea buckthorn","Herb-infused (tarragon, basil)","Curd + gelatin for inserts"],"eq":["Bain-marie","Thermometer","Blender","Sieve"],"at":"30 min","tt":"4–5 h"},{"id":"fran","n":"Frangipane","f":"cust","d":1,"o":"yes","what":"Almond cream (crème d'amande), often with pastry cream folded in. Made to be baked.","how":"Creamed butter and egg hold air; ground nuts give body; in the oven the egg sets it into a moist, cake-like filling.","ratio":[["Crème d'amande","Butter : sugar : ground almonds : egg = 1 : 1 : 1 : 1"],["Frangipane","2 parts crème d'amande + 1 part pâtissière"],["Flour (optional)","~10% for stability"]],"temps":[["Bake","160–180 °C"],["Butter","soft, ~18–20 °C"]],"steps":["Cream soft butter and sugar (don't whip in too much air).","Add ground nuts, then eggs gradually.","Fold in pastry cream and rum/vanilla if using.","Pipe into tarts or pastries and bake until set and golden."],"oven":"Fully oven-safe; this is its purpose.","r":"Baked: 1–2 days","fr":"Raw: 1 week","fz":"Raw: 3 months","fails":[["Puffs and sinks","Over-creamed; mix, don't whip."],["Greasy","Butter too warm or split; add eggs slowly."]],"uses":["Bourdaloue and fruit tarts","Croissant aux amandes, bostock","Danish","Galette des rois"],"vary":["Pistachio, hazelnut, walnut","Brown butter","Praline frangipane","Buckwheat flour"],"eq":["Mixer with paddle","Piping bag"],"at":"15 min","tt":"15 min"},{"id":"cheese","n":"Cream cheese filling","f":"cust","d":1,"o":"yes","what":"Sweetened cream cheese bound with egg or starch. The baked version is the classic danish filling; a no-bake version uses gelatin and white chocolate.","how":"Egg proteins and starch set it in the oven without it running. In the no-bake version, gelatin and cocoa butter do the setting.","ratio":[["Baked","Cream cheese 500 · sugar 80–120 · yolk/egg 30–50 · starch 15–25 · zest"],["No-bake","Cream cheese 300 · white chocolate 100–150 · cream 200 (half whipped) · gelatin ~1%"]],"temps":[["Bake","170–190 °C with the pastry"],["Soften cheese","room temp first"]],"steps":["Soften the cream cheese and beat smooth on low.","Add sugar, then starch and egg; don't overbeat.","Add zest or vanilla.","Pipe into the pastry and bake."],"oven":"The baked version is oven-safe.","r":"Baked pastries: same day","fr":"3–4 days","fz":"Baked: yes","fails":[["Cracks / puffs","Over-beaten; mix on low."],["Runs in the oven","More starch or egg."],["Lumps","Cheese was cold."]],"uses":["Danish","Buns with compote","Cheesecake tarts","Choux (no-bake)"],"vary":["Varškė or quark","Basque cheesecake cream","Cheesecake cream with fruit swirl","Tres leches cream"],"eq":["Mixer","Piping bag"],"at":"10 min","tt":"10 min"},{"id":"bc","n":"Buttercream","f":"cust","d":2,"o":"no","what":"Butter whipped into a sweet base. Four main types by base: Swiss or Italian meringue, French (yolk), German (custard).","how":"Butter fat is the structure; the base adds air (meringue) or richness (yolk, custard). Temperature controls everything: too cold curdles, too warm turns soupy.","ratio":[["Swiss meringue","Whites 100 : sugar 150–200 : butter 250–300"],["Italian meringue","Same; sugar cooked to 118–121 °C"],["French","Yolks 100 : sugar 200 (syrup) : butter 300–400"],["German","Pâtissière 1 : butter 0.5–1"]],"temps":[["Swiss whites","to 70 °C"],["Italian syrup","118–121 °C"],["Butter","~18–20 °C"]],"steps":["Make the base (meringue, pâte à bombe or custard).","Cool to ~25 °C.","Add soft butter in pieces on medium speed.","Beat until smooth; flavor."],"oven":"No; it melts.","r":"A day in a cool room","fr":"1 week","fz":"Months; re-beat","fails":[["Curdled","Too cold; warm the bowl and beat."],["Soupy","Too warm; chill 10 min, beat."]],"uses":["Layer cakes","Macarons","Cupcakes","Paris-Brest (as mousseline)"],"vary":["Praline","Brown butter","Fruit (freeze-dried powder)","Caramel"],"eq":["Stand mixer","Thermometer"],"at":"30 min","tt":"30 min"},{"id":"setgan","n":"Set ganache","f":"gan","d":1,"o":"no","what":"An emulsion of chocolate and cream (plus sugars and butter). The ratio decides whether it's a sauce, a tart filling or a truffle.","how":"Cocoa butter crystallises as it cools and sets the ganache. A higher sugar ratio and less water mean a longer shelf life.","ratio":[["Dark, soft (tarts)","Chocolate 1 : cream 1"],["Dark, firm (truffles)","Chocolate 2 : cream 1"],["Milk","Chocolate 2–2.5 : cream 1"],["White","Chocolate 2.5–3 : cream 1"],["Shelf life boost","Add invert sugar / glucose; butter at the end"]],"temps":[["Emulsify at","35–40 °C"],["Butter in at","~35 °C"],["Pipe/frame","~30 °C"],["Crystallise","12–24 h at 16–18 °C"]],"steps":["Heat cream (with glucose / invert sugar).","Pour over chopped chocolate in thirds, emulsifying each time.","Blend with a stick blender, without adding air.","Blend in soft butter at ~35 °C; pour into a frame or shells."],"oven":"No; it melts. Bake chunks of a firm ganache into cookies only.","r":"Bonbon: 1–3 weeks","fr":"1–2 weeks","fz":"Yes","fails":[["Split / oily","Add a little warm cream and blend."],["Grainy","Chocolate overheated; re-blend."],["Too soft","More chocolate."]],"uses":["Tarts","Bonbons and bars","Macarons","Cake fillings"],"vary":["Caramel ganache","Olive oil ganache","Fruit purée ganache","Infused ganache"],"eq":["Stick blender","Thermometer","Frame"],"at":"20 min","tt":"12–24 h"},{"id":"wgan","n":"Whipped ganache","f":"gan","d":1,"o":"no","what":"A light ganache made with lots of cream, rested cold and then whipped like cream. Pipes sharp and holds better than Chantilly.","how":"After a night in the fridge, cocoa butter crystals are stable enough to hold air bubbles when whipped.","ratio":[["White / caramel","Chocolate 1 : total cream 2–2.5"],["Milk","1 : 2.5–3"],["Dark","1 : 3–4"],["Method split","Heat ~⅓ of the cream, add the rest cold"],["Gelatin (optional)","~0.2–0.5% for extra hold"]],"temps":[["Hot cream","~80 °C"],["Mature","12 h at 4 °C"]],"steps":["Heat part of the cream (with any infusion, glucose).","Pour over chocolate, emulsify.","Blend in the cold cream; film on contact.","Chill at least 12 h, then whip to soft, pipeable peaks."],"oven":"No; pipe after baking.","r":"2–4 h, holds shape","fr":"Base 2–3 days; whipped, same day","fz":"Inside assembled desserts","fails":[["Won't whip","Not rested long enough or too warm."],["Grainy","Overwhipped; melt a portion and re-whip."],["Weak","Chocolate under 30% cocoa butter; increase chocolate."]],"uses":["Tart topping","Choux, éclairs","Entremet layer","Macarons"],"vary":["Vanilla","Yogurt or kefir","Caramel–tonka","Miso caramel"],"eq":["Stick blender","Stand mixer"],"at":"15 min","tt":"Overnight"},{"id":"nam","n":"Namelaka","f":"gan","d":2,"o":"no","what":"A Valrhona creation: between ganache and pastry cream. Milk, glucose and gelatin over chocolate, then cold cream. Very creamy, piped or spooned.","how":"Gelatin and cocoa butter give a soft set without eggs or starch.","ratio":[["White chocolate","Milk 1 : chocolate 1.7–1.8 : cream 2"],["Glucose","~5% of milk"],["Gelatin","~0.5–0.7% of total weight"],["Dark / milk","Use less chocolate"]],"temps":[["Milk","just boiling"],["Rest","12 h, film on contact"]],"steps":["Heat milk (infused if wanted) with glucose; add bloomed gelatin.","Pour over chocolate in thirds; emulsify.","Blend in the cold cream.","Film on contact; set overnight; whisk briefly before piping."],"oven":"No.","r":"2–3 h","fr":"3–4 days","fz":"Possible, slight texture change","fails":[["Too firm","Infusion lost liquid; reweigh."],["Runny","Not enough gelatin, especially with acidic fruit."]],"uses":["Choux, éclairs","Tarts","Quenelles","Cups"],"vary":["Masala / chai","Black currant (purée replaces some milk)","Fruit couverture","Coffee, matcha"],"eq":["Stick blender","Thermometer"],"at":"20 min","tt":"Overnight"},{"id":"chant","n":"Whipped cream & Chantilly","f":"air","d":1,"o":"no","what":"Sweetened whipped cream, and the ways to make it hold: mascarpone, gelatin, white chocolate, or cultured dairy.","how":"Fat globules partly break and link around air bubbles. Cold cream (35%+ fat) whips best; stabilisers slow the collapse.","ratio":[["Chantilly","Cream 35% 1000 · sugar 80–100 · vanilla"],["Mascarpone","Replace 20–30% of the cream"],["Gelatin","~0.5–1% of cream, melted into a little warm cream"],["Kefir / skyr","Fold up to 30–40% strained cultured dairy into whipped cream"]],"temps":[["Cream","4 °C"],["Bowl","chilled"]],"steps":["Chill cream, bowl and whisk.","Whip with sugar to soft peaks.","Add stabiliser if using.","Finish to the peak you need; pipe or fold."],"oven":"No.","r":"1–2 h","fr":"Plain: same day; stabilised: 2 days","fz":"No","fails":[["Buttery / grainy","Overwhipped; fold in a little liquid cream."],["Weeps","Stabilise it, or whip just before use."]],"uses":["Choux","Pavlova","Diplomat cream","Layer cakes"],"vary":["Whipped kefir or skyr","Aquafaba (vegan)","Infused cream (cold infuse overnight)"],"eq":["Stand mixer or whisk"],"at":"10 min","tt":"10 min"},{"id":"mou","n":"Mousse & bavarois","f":"air","d":2,"o":"no","what":"A flavor base lightened with whipped cream and/or meringue, set with gelatin or chocolate. Bavarois is the version built on crème anglaise.","how":"Air from the whipped cream or meringue; structure from gelatin or cocoa butter. Folding temperature decides the texture.","ratio":[["Fruit mousse","Purée 100 : whipped cream 80–100 : sugar 10–25 : gelatin ~1–1.5% of total"],["Bavarois","Anglaise 1 : whipped cream 1, gelatin ~1–1.5%"],["Chocolate","Base of pâte à bombe, anglaise or meringue + chocolate + whipped cream"],["Lighter","Replace part of the cream with Italian meringue"]],"temps":[["Fold base at","~30 °C (fluid, cool to touch)"],["Cream","soft peaks, not stiff"]],"steps":["Make the base and add bloomed gelatin.","Cool to ~30 °C.","Fold in whipped cream (and/or meringue) in thirds.","Pour into moulds around a frozen insert; freeze."],"oven":"No.","r":"~1 h","fr":"2–3 days","fz":"Yes, the classic entremet route","fails":[["Dense / streaky","Base too cold when folding."],["Runny / collapsed","Base too warm, melted the cream."],["Rubbery","Too much gelatin."]],"uses":["Entremets","Domes and petits gâteaux","Verrines","Charlottes"],"vary":["Apricot, mango, berry","Chocolate","Praline","Yogurt mousse"],"eq":["Stand mixer","Thermometer","Moulds"],"at":"30 min","tt":"Overnight"},{"id":"mer","n":"Meringue","f":"tex","d":2,"o":"yes","what":"Egg whites whipped with sugar. French (raw), Swiss (warmed) and Italian (hot syrup). A building block for mousse, buttercream and decor.","how":"Whisking unfolds egg proteins around air; sugar stabilises the foam. Heat (Swiss, Italian) makes it more stable and food-safe.","ratio":[["French","Whites 1 : sugar 1–2 (raw)"],["Swiss","Whites 1 : sugar 2, heated to 70 °C"],["Italian","Whites 1 : sugar 2, syrup at 118–121 °C"]],"temps":[["Swiss","70 °C"],["Italian syrup","118–121 °C"],["Bake dry","90–110 °C"]],"steps":["Clean, grease-free bowl.","French: whip whites, add sugar gradually. Swiss: heat whites and sugar to 70 °C, then whip. Italian: whip whites while pouring hot syrup.","Whip to glossy stiff peaks.","Use at once in mousse, or pipe and bake."],"oven":"Baked meringue is oven-dried. In fillings, Italian or Swiss is the safe choice when raw egg is an issue.","r":"Baked: weeks, dry","fr":"Italian in mousse: as the mousse","fz":"In mousse: yes","fails":[["Won't whip","Grease or yolk in the bowl."],["Weeps","Sugar not dissolved; heat longer (Swiss)."]],"uses":["Mousse","Buttercream","Pavlova","Lemon meringue tarts"],"vary":["Aquafaba meringue","Brown sugar","Freeze-dried fruit powder"],"eq":["Stand mixer","Thermometer"],"at":"15 min","tt":"15 min"},{"id":"comp","n":"Compote & confit","f":"fruit","d":1,"o":"partial","what":"Cooked fruit set to a spoonable or sliceable texture, usually with pectin NH. The fruit insert in most modern pastry.","how":"Pectin NH gels with the fruit's own calcium and sets as it cools. It melts again when reheated (thermoreversible), so you can remelt and repour it.","ratio":[["Fruit / purée","1000 g"],["Sugar","150–300 g"],["Pectin NH","10–15 g soft insert; up to 20–30 g for a firm, bake-stable set"],["Acid","Lemon juice or citric acid at the end"]],"temps":[["Add pectin","40–50 °C"],["Boil","1–2 min"]],"steps":["Warm fruit/purée to 40–50 °C.","Rain in sugar pre-mixed with pectin, whisking.","Boil 1–2 min.","Off the heat, add acid and any pieces of fruit; pour and set."],"oven":"Oven-safe when the set is firm and sugar is high enough; a loose compote boils out of pastry.","r":"Hours","fr":"5–7 days","fz":"Yes","fails":[["Lumpy","Pectin added without sugar."],["Won't set","Too little pectin, or acid added too early."],["Gelatin version won't set","Raw pineapple, kiwi or papaya digest gelatin; cook them or use pectin."]],"uses":["Inserts","Danish with cream cheese","Tart bases","Verrines"],"vary":["Bilberry, black currant, lingonberry","Tropical","Strawberry–grapefruit","Apple tatin (caramelised)"],"eq":["Saucepan","Scale","Thermometer"],"at":"20 min","tt":"2 h–overnight"},{"id":"jam","n":"Bake-stable fruit filling","f":"fruit","d":1,"o":"yes","what":"Fruit filling designed for the oven: high sugar with pectin, or starch-thickened fruit. What bakeries put inside buns and danish.","how":"High sugar plus yellow (slow-set) pectin makes an irreversible gel that won't melt. Starch gives a cloudier but simpler stable set.","ratio":[["Jam style","Fruit 1000 · sugar 550–700 · yellow pectin 8–15 g · acid; cook to 60–65% Brix"],["Starch style","Fruit 1000 · sugar 150–250 · cornstarch / modified starch 40–70 g"]],"temps":[["Jam end point","~104–105 °C, or 60–65 °Brix"],["Starch","boil until clear"]],"steps":["Cook fruit with most of the sugar.","Add pectin mixed with the rest of the sugar (or starch slurry).","Cook to the end point; add acid.","Cool fully before piping into pastry."],"oven":"Yes; built for it.","r":"Jam: weeks after opening if cool","fr":"Weeks","fz":"Starch style: weeps","fails":[["Runs out of pastry","Not cooked far enough; more pectin or starch."],["Rubbery","Too much pectin."]],"uses":["Danish","Buns and doughnuts","Linzer, tarts","Turnovers"],"vary":["Apricot, raspberry, plum","Low-sugar with LM pectin","Pairs with frangipane or cream cheese"],"eq":["Saucepan","Thermometer or refractometer"],"at":"30 min","tt":"Overnight cool"},{"id":"gel","n":"Gels & jellies","f":"fruit","d":1,"o":"partial","what":"Fruit liquid set with agar or gelatin. Agar gives firm or blended fluid gels; gelatin gives soft melting jellies and whipped jellies.","how":"Agar dissolves only at a full boil, sets at ~35–45 °C and doesn't melt until ~85 °C. Gelatin dissolves below 60 °C and melts near body temperature.","ratio":[["Agar fluid gel","0.8–1% of liquid; set, then blend"],["Agar firm","1–1.5%"],["Gelatin soft jelly","~1–1.5% (200 bloom)"],["Whipped jelly","Gelatin ~1–1.5%, whipped at 20–25 °C"]],"temps":[["Agar","boil 30–60 s"],["Gelatin","dissolve ≤ 60 °C, never boil"],["Whip jelly at","20–25 °C"]],"steps":["Mix agar with sugar; whisk into the liquid; boil. Or melt bloomed gelatin into warm liquid.","Agar: set completely, then blend until glossy for a fluid gel.","Gelatin: pour and chill, or cool until syrupy and whip to a foam."],"oven":"Agar holds on warm items and survives brief heat. Gelatin melts.","r":"Agar: a day; gelatin: 1–2 h","fr":"3–4 days","fz":"Gelatin: yes. Agar: weeps.","fails":[["Agar won't set","Never boiled."],["Gelatin won't set","Boiled, too much acid, or raw enzymes in fruit."],["Agar weeps","Normal over time; use within days."]],"uses":["Dots on tarts","Inserts","Plated desserts","Glazes"],"vary":["Lemon, yuzu, makrut lime","Whipped raspberry jelly","Passion jelly insert"],"eq":["Saucepan","Blender","Squeeze bottle"],"at":"15 min","tt":"1–3 h"},{"id":"car","n":"Caramel","f":"sug","d":2,"o":"partial","what":"Sugar cooked to amber, then usually deglazed with cream and butter. The cooking temperature after deglazing sets the texture.","how":"Sucrose breaks down into hundreds of flavor compounds as it browns. Dry caramel (sugar alone) is faster and more complex; wet (with water) is more forgiving.","ratio":[["Sauce","Sugar 100 · cream 100–150 · butter 20–40 · salt"],["Color","160–170 °C light, 170–180 °C dark"],["After deglazing","103–106 °C sauce · ~108 °C soft filling · 118–121 °C chewy"]],"temps":[["Amber","170–180 °C"],["Sauce end","103–106 °C"]],"steps":["Dry: melt sugar in small additions in a light pan, stirring as each melts. Wet: dissolve in water, don't stir, wash down crystals.","Take to amber, a shade before you want it.","Deglaze with hot cream gradually.","Add butter and salt; cook to the texture temperature."],"oven":"Sauce runs. Firmer caramels can go into baking but melt.","r":"Days","fr":"2–3 weeks","fz":"Yes","fails":[["Crystallised","Stirred a wet caramel or stray crystals; add water, dissolve, restart."],["Seized when deglazing","Cream was cold; use hot cream."],["Bitter","Too dark; it keeps cooking off the heat."]],"uses":["Base for crémeux, ganache, whipped caramel","Sauce","Tatin","Bars and bonbons"],"vary":["Coconut caramel","Miso caramel","Brown butter","Fruit-deglazed (passion)"],"eq":["Light-colored heavy pan","Thermometer"],"at":"20 min","tt":"30 min"},{"id":"pral","n":"Praline paste","f":"sug","d":2,"o":"partial","what":"Nuts coated in caramel, cooled and blended into a smooth paste. The flavor base behind praliné creams, crunches and gianduja.","how":"Long blending releases the nuts' oil, which turns the caramelised nuts from powder into a fluid paste.","ratio":[["Classic 50%","Nuts 1 : sugar 1"],["Less sweet 60%","Nuts 1.5 : sugar 1"],["Salt","~0.5%"]],"temps":[["Roast nuts","150–160 °C"],["Caramel","amber"]],"steps":["Roast nuts gently.","Make a dry caramel; add warm nuts and coat (or pour caramel over them).","Cool completely on a mat; break up.","Blend: powder first, then a fluid paste; rest the machine if hot."],"oven":"Folded into frangipane or rolled into laminated dough it's fine; on its own it melts and oils out.","r":"Weeks–months, airtight","fr":"Longer","fz":"Yes","fails":[["Stays gritty","Blend longer; seeds and low-fat nuts need more time."],["Bitter","Caramel too dark."],["Rancid","Walnut and seed pastes go faster; small batches."]],"uses":["Paris-Brest mousseline","Crunch layers","Gianduja","Bun and babka swirls"],"vary":["Walnut, pecan, pistachio","Buckwheat & seed (nut-free)","Chunky praliné"],"eq":["Heavy pan","Silicone mat","Strong food processor"],"at":"30 min","tt":"45 min"},{"id":"gian","n":"Gianduja","f":"sug","d":2,"o":"partial","what":"Finely ground nuts and sugar mixed with chocolate. Melt-in-the-mouth, sliceable or pipeable.","how":"Like chocolate itself: cocoa butter crystallises and sets the nut paste. Tempering gives snap and shelf life.","ratio":[["From nuts","Nuts 1 : icing sugar 1 : chocolate 1"],["From praline","Praline paste 1–1.2 : chocolate 1"]],"temps":[["Mix at","30–35 °C"],["Crystallise","16–18 °C"]],"steps":["Roast and peel nuts.","Blend with icing sugar to a fine fluid paste.","Mix with melted, ideally tempered, chocolate.","Pour into a frame or pipe; let it crystallise."],"oven":"Chunks bake into cookies and buns well; smooth fillings melt and re-set.","r":"Weeks, cool and dry","fr":"Longer","fz":"Yes","fails":[["Soft, greasy","Too warm; temper or cool longer."],["Gritty","Paste not fine enough."]],"uses":["Bonbons, bars","Entremet layer","Babka, croissants","Spread"],"vary":["Dark, milk, white","Almond, pistachio, walnut","With feuilletine"],"eq":["Food processor","Thermometer","Frame"],"at":"40 min","tt":"Overnight"},{"id":"crunch","n":"Crunch layers","f":"tex","d":1,"o":"no","what":"Crisp elements bound with fat (chocolate, cocoa butter, praline) so they stay crisp against creams.","how":"Fat coats the crisp pieces and slows moisture getting in. Without a fat binder, crisp layers go soft in hours.","ratio":[["Royaltine","Praline 100 : chocolate 40–60 : feuilletine 50–70"],["Yogurt / fruit crunch","White chocolate 100 · cocoa butter ~10 · yogurt powder 10–15 · fruit powder 5–10 · crisp 40–60"],["Spread","2–4 mm"]],"temps":[["Chocolate","~30–35 °C when mixing"]],"steps":["Crush crisp element (feuilletine, puffed rice, kataifi, crushed biscuit).","Melt chocolate with praline or cocoa butter and powders.","Fold together.","Spread thin in a ring or frame; chill."],"oven":"No; the binder melts.","r":"About 1 week, dry","fr":"About 1 week","fz":"Up to 3 months","fails":[["Goes soft","Too little fat; use powders, not wet fruit."],["Hard as a brick","Too thick or too much chocolate."]],"uses":["Entremet bases","Tart bases","Bars","Cruffin and choux surprise"],"vary":["Royaltine","Walnut crunch","Strawberry or bilberry yogurt crunch","Pistachio kataifi"],"eq":["Bowl","Offset spatula","Ring or frame"],"at":"10 min","tt":"40 min"},{"id":"streu","n":"Streusel & crumble","f":"tex","d":1,"o":"yes","what":"Rubbed butter, sugar and flour (often nuts) baked on top of or under a filling.","how":"Cold butter in small pieces gives crunchy clusters; ground nuts add tenderness.","ratio":[["Classic","Butter 1 : sugar 1 : flour 1 (: ground nuts 1)"],["Salt","~1%"]],"temps":[["Bake","160–170 °C"]],"steps":["Rub cold butter into the dry ingredients until clumpy.","Chill or freeze.","Scatter on buns or tarts, or bake alone for a crumble garnish."],"oven":"Yes.","r":"Baked: days, airtight","fr":"Raw: 1 week","fz":"Raw: months","fails":[["Melts flat","Butter too warm; freeze before baking."]],"uses":["Buns and muffins","Fruit tarts","Crunch garnish"],"vary":["Rye or buckwheat flour","Cocoa","Brown butter"],"eq":["Bowl"],"at":"10 min","tt":"30 min"},{"id":"halva","n":"Halva","f":"sug","d":2,"o":"partial","what":"Sugar syrup cooked hot and worked into tahini or ground seeds, which crystallises into a crumbly, fibrous block. Two families: Middle Eastern tahini halva and the Eastern European sunflower halva.","how":"Syrup at 120–125 °C hits the warm sesame or seed paste and partly crystallises as you stir. Brief mixing gives strands; overmixing gives a dense, sugary block. Factory halva uses soapwort extract for its fibres; at home the texture is softer and more fudgy.","ratio":[["Tahini halva","Tahini 1 : sugar 0.8–0.9 (+ ~25% water, some glucose)"],["Sunflower halva","Roasted, finely ground sunflower seeds 1 : sugar 0.6–0.7 (+ honey)"],["Syrup","Cook to 120–125 °C"],["Add-ins","Pistachio, cocoa ripple, vanilla, salt ~0.5%"]],"temps":[["Syrup","120–125 °C"],["Tahini","warm, ~40–50 °C"]],"steps":["Stir the tahini well (oil separates), warm it with vanilla and salt.","Cook sugar, water and glucose to 120–125 °C.","Pour the syrup into the tahini and fold with a strong spatula only until it pulls together and looks matte and stringy (30–60 s).","Press at once into a lined tin; cover and leave 12–24 h to set."],"oven":"Crumbled halva bakes well into buns, babka and cookies (it softens and caramelises). Halva cream goes in after baking.","r":"Weeks, airtight and cool","fr":"Months","fz":"Yes","fails":[["Oily, won't set","Syrup didn't reach 120 °C."],["Hard, sandy","Overmixed or syrup too hot."],["Separating","Tahini wasn't stirred smooth first."]],"uses":["Babka and swirl buns","Crumble on tarts and choux","Halva cream for choux and croissants","Cookies"],"vary":["Sunflower halva (very local)","Pistachio or cocoa ripple","Halva cream (tahini whipped ganache)","Halva + dulce de leche"],"eq":["Thermometer","Heavy pan","Strong spatula","Lined tin"],"at":"20 min","tt":"Overnight"},{"id":"poppy","n":"Poppy seed filling","f":"sug","d":1,"o":"yes","what":"Ground poppy seeds cooked with milk, sugar or honey and butter into a thick paste. The filling for aguonų vyniotinis, makowiec, Mohnstrudel and hamantaschen.","how":"Seeds must be ground (or scalded and ground) to release flavor. Cooking with milk softens them; egg and crumbs bind the paste so it stays put in the oven.","ratio":[["Base","Poppy seeds 1 : milk 0.8–1 : sugar/honey 0.4–0.5 : butter 0.15"],["Binder","1 egg per 250 g seeds, or 5–10% breadcrumbs/semolina"],["Add-ins","Raisins, candied peel, walnuts, zest, rum"]],"temps":[["Simmer","10–15 min"],["Bake","170–180 °C with the dough"]],"steps":["Grind the seeds in a spice grinder or poppy mill (or scald with boiling milk, soak 1 h and grind).","Cook with milk, sugar, honey and butter, stirring, until thick (10–15 min).","Cool; stir in zest, raisins, rum and the egg (or crumbs).","Spread on dough leaving a border; roll and bake."],"oven":"Yes; made for it.","r":"Baked: 2–3 days","fr":"Filling: 4–5 days","fz":"Yes, months","fails":[["Bitter","Old seeds (rancid oil); buy fresh and taste them."],["Runny","Cook longer or add binder."],["Gritty","Grind finer."]],"uses":["Aguonų vyniotinis / makowiec","Buns and kolache","Strudel","Hamantaschen"],"vary":["Walnut and honey (Christmas)","Orange peel and rum","Poppy + varškė layers","Poppy pastry cream"],"eq":["Spice grinder or poppy mill","Saucepan"],"at":"30 min","tt":"1–2 h"},{"id":"dulce","n":"Dulce de leche","f":"sug","d":1,"o":"partial","what":"Milk and sugar cooked slowly until brown and thick (confiture de lait), or condensed milk caramelised gently. In Lithuania it's the boiled condensed milk inside riešutėliai.","how":"Long, gentle heat drives Maillard browning between milk proteins and sugars while water evaporates. A pinch of baking soda helps it brown and stops it curdling.","ratio":[["From milk","Whole milk 1000 : sugar 250–300 : baking soda 1–2 g → about 400–450 g"],["From condensed milk","1 can (397 g) in an open dish, covered, in a water bath at ~220 °C for 1–1.5 h"]],"temps":[["Simmer","gentle, 1.5–2.5 h"],["Oven method","water bath, ~220 °C"]],"steps":["Bring milk, sugar and vanilla to a boil.","Stir in the baking soda (it foams up).","Simmer gently, stirring more often as it thickens, until caramel-coloured and spoon-coating.","Blend if grainy; jar while hot."],"oven":"Thick versions hold in short bakes (cookies, alfajores) but thin and can scorch in long ones. Best piped after baking.","r":"Days, cool","fr":"3–4 weeks","fz":"Yes","fails":[["Grainy","Blend or sieve."],["Too thin","Cook longer."],["Scorched","Heavy pan, lower heat, stir the bottom."],["Exploding cans","Never boil sealed cans that might boil dry. Open-dish and jar methods are safer."]],"uses":["Croissant and babka swirl","Riešutėliai and alfajores","Choux and tarts","Bun filling"],"vary":["Salted","Coffee","Goat's milk (cajeta)","With walnuts"],"eq":["Wide heavy pan","Whisk","Blender"],"at":"15 min","tt":"2–3 h"},{"id":"marz","n":"Almond paste & marzipan","f":"sug","d":1,"o":"yes","what":"Ground almonds bound with sugar. Almond paste (around 50% almond) is for baking inside pastry; marzipan (sweeter) is for modelling and covering.","how":"More almond means softer, more aromatic and better for baking. Sugar and a little egg white or syrup bind it.","ratio":[["Almond paste 50%","Blanched almonds 1 : icing sugar 1 + ~15% egg white"],["Marzipan","Almonds 1 : icing sugar 1.5–2"],["Flavor","Bitter almond extract, rose water, orange zest"]],"temps":[["Cooked marzipan","syrup at 118 °C"],["Raw method","no heat"]],"steps":["Blitz blanched almonds with icing sugar to a fine meal (pulse; don't let it turn to butter).","Add egg white and flavoring; pulse until it clumps.","Knead smooth, wrap and rest overnight."],"oven":"Almond paste bakes beautifully inside pastry (gevulde koek, bear claws, stollen).","r":"Weeks, wrapped","fr":"Months","fz":"Yes","fails":[["Oily","Over-processed or too warm."],["Crumbly","Add a few drops of egg white or syrup."]],"uses":["Stollen core","Bear claws, gevulde koek","Croissants with frangipane","Petits fours"],"vary":["Pistachio paste","Persipan (apricot kernels)","Orange marzipan"],"eq":["Food processor"],"at":"15 min","tt":"Overnight"},{"id":"pdf","n":"Pâte de fruit","f":"fruit","d":3,"o":"yes","what":"Fruit purée cooked with lots of sugar and yellow pectin into a firm, sliceable jelly. A confection, an insert, and a fruit layer that survives the oven.","how":"Yellow (slow-set) pectin, very high sugar (~72–75 °Brix) and acid form a gel that won't melt again.","ratio":[["Purée","1000"],["Sugar","1000–1100 (about 10% of it mixed with the pectin)"],["Yellow pectin","12–18 g"],["Glucose","150–200"],["Citric acid solution 50%","10–15 g, added last"]],"temps":[["Pectin in at","~50 °C"],["Cook to","106–107 °C (72–75 °Brix)"]],"steps":["Warm the purée to 50 °C; whisk in the pectin mixed with some sugar; boil.","Add the rest of the sugar and glucose in stages, keeping the boil.","Cook to 106–107 °C.","Off the heat, stir in the acid quickly and pour into a lined frame.","Set 12 h at room temp; cut and roll in sugar."],"oven":"Yes, holds its shape.","r":"Weeks, dry","fr":"Not needed","fz":"No (sweats)","fails":[["Too soft","Not cooked far enough."],["Sets in the pan","Acid added too early or too slowly."],["Grainy","Sugar crystallised; add glucose, wash down the pan."]],"uses":["Confections","Inserts","Layer in tarts","On danish"],"vary":["Raspberry, black currant","Sea buckthorn","Quince (membrillo style)"],"eq":["Thermometer or refractometer","Frame"],"at":"40 min","tt":"Overnight"},{"id":"candy","n":"Candied peel & zest","f":"fruit","d":2,"o":"yes","what":"Citrus peel (or ginger, rhubarb, petals and leaves) cooked slowly in syrup until translucent, then dried or rolled in sugar. Chewy and bitter-sweet. Quick candied zest is the fast version for garnish.","how":"Blanching takes out the harsh bitterness and softens the pith. Raising the syrup strength step by step swaps the water in the peel for sugar without shrivelling it; glucose stops it crystallising.","ratio":[["Peel","500 g, blanched weight"],["Starting syrup","Water 500 · sugar 500 · glucose 100"],["Strengthen","+150–200 g sugar per day for 2–4 days, to about 75 °Brix"],["Quick zest","Fine strips, blanched once · syrup 1:1 · simmer 10–15 min"],["Crystallised petals and leaves","Brush with egg white (or aquafaba), dust with caster sugar, dry 24 h"]],"temps":[["Blanch","3 times, each from cold water to a boil"],["Candy","bare simmer, about 103–105 °C; never a rolling boil"],["Finish for long keeping","syrup at 107–108 °C"],["Dry","overnight at room temp, or 50 °C oven 1–2 h"]],"steps":["Cut the peel into quarters or strips, leaving a thin layer of pith.","Blanch three times, starting in cold water each time; drain.","Simmer gently in the starting syrup for 30 min, then leave it to soak overnight.","Each day, bring it back to a simmer with more sugar, until the peel is translucent all the way through (2–4 days). One long, very gentle session also works, with a slightly firmer result.","Drain and dry on a rack, then roll in sugar, keep in its syrup, or dip in tempered chocolate (orangettes)."],"oven":"Yes. Diced peel bakes into buns, panettone, stollen and cookies.","r":"Months, dry or in syrup","fr":"Months","fz":"Yes","fails":[["Hard and shrivelled","Syrup too strong too soon, or boiled hard. Raise it gradually and keep it at a bare simmer."],["Still bitter","Blanch more times, or thin the pith."],["Grainy, crystallised","No glucose, or stirred. Add glucose and shake the pan instead of stirring."],["Sticky, won't dry","Syrup not concentrated enough. Finish to 107–108 °C."]],"uses":["Diced into buns, panettone and stollen","Orangettes and petits fours","Garnish on tarts, choux and cakes","Florentines and cookies","The syrup flavours glazes and soaking syrups"],"vary":["Orange, lemon, grapefruit, yuzu, pomelo","Quick candied zest","Candied ginger","Candied rhubarb ribbons","Crystallised rose, violet, lilac; mint and lemon balm leaves"],"eq":["Wide pan","Thermometer or refractometer","Rack"],"at":"1 h","tt":"2–4 days"},{"id":"fcrisp","n":"Fruit crisps & leathers","f":"fruit","d":1,"o":"no","what":"Fruit dried paper-thin until crisp (apple, pear, quince, pineapple, strawberry chips), or puréed and dried into flexible leathers and fruit papers. Crunch, décor and concentrated fruit with no fat.","how":"Thin, even slices dried at a low temperature lose their water before they brown; a dip in syrup keeps the colour and adds snap. Leathers set from pectin-rich purée, and a little glucose keeps them flexible.","ratio":[["Chips","Fruit sliced 1–2 mm · lemon water, or a warm 1:1 syrup dip"],["Leather","Fruit purée 500 · sugar or honey 50–80 · glucose 30 · lemon juice 10"]],"temps":[["Chips","80–90 °C, 1.5–3 h, turned once"],["Leather","60–70 °C, 4–6 h, until no longer tacky"]],"steps":["Chips: slice very thin on a mandoline and dip in lemon water or warm syrup.","Lay flat on a mat and dry low until they lift off easily; they crisp as they cool.","Leather: cook the purée with sugar and glucose until thick, then spread 2 mm thin on a mat.","Dry until set and not tacky. Cut into strips or discs, or roll up.","Store both airtight, ideally with a silica gel sachet."],"oven":"Dried in the oven, added at the end: moist fillings soften them.","r":"1–2 weeks airtight (chips), about a month (leather)","fr":"No","fz":"No","fails":[["Chewy chips","Sliced too thick or not dried long enough."],["Brown chips","Oven too hot; go lower and longer."],["Leather cracks","Spread too thin or dried too far."],["Leather stays sticky","Under-dried, or a humid day."]],"uses":["Garnish on tarts, cakes and verrines","Crushed into crunch layers","Fruit-paper wraps for petits fours","Stand-up décor on petits gâteaux"],"vary":["Apple with cinnamon sugar","Pear, quince","Pineapple flowers","Strawberry or raspberry leather","Sea buckthorn or black currant paper","Beetroot and carrot chips (savoury)"],"eq":["Mandoline","Silicone mats","Oven or dehydrator"],"at":"20 min","tt":"2–6 h"},{"id":"brit","n":"Brittle & candied nuts","f":"sug","d":2,"o":"partial","what":"Nuts or seeds set in hard caramel and spread thin (brittle), or each nut coated in sugar (caramelised, sugared or oven-candied nuts). The fastest way to add crunch, colour and a bitter edge.","how":"Sugar cooked past hard crack sets glassy. A pinch of baking soda in brittle makes tiny bubbles, so it's lighter and easier to bite. For caramelised nuts, the syrup first crystallises around the nut (sandy), then melts into a caramel shell.","ratio":[["Brittle","Sugar 200 · glucose 100 · water 60 · butter 30 · nuts or seeds 200 · salt 2 · baking soda 2"],["Caramelised nuts","Nuts 250 · sugar 80 · water 25 · butter 5"],["Oven-candied","Nuts 200 · egg white 15 · sugar 50 · spice and salt"]],"temps":[["Brittle syrup","150 °C, then nuts and butter, to golden (about 165 °C)"],["Caramelised nuts","syrup to 118 °C, then stir in the nuts"],["Oven-candied","150 °C, 15–20 min"]],"steps":["Brittle: line a tray with a mat and warm the nuts.","Cook sugar, glucose and water to about 150 °C. Add the nuts and butter and stir until golden.","Off the heat, stir in salt and soda (it foams). Pour and spread thin with an oiled spatula.","Cool and snap. Chop for cookies and streusel, or grind into a crunchy dust.","Caramelised nuts: boil sugar and water to 118 °C, add warm nuts and stir until the sugar turns sandy. Keep stirring over the heat until it melts into caramel, add the butter, spread and separate."],"oven":"Partly. Small chopped pieces melt into cookies as caramel pockets; whole brittle goes on after baking.","r":"2 weeks airtight","fr":"No (gets sticky)","fz":"No","fails":[["Chewy, sticky","Not cooked far enough, or humidity. Cook darker and store airtight."],["Bitter","Too dark; take it off earlier, the heat keeps cooking it."],["Grainy","Stirred before the sugar dissolved. Add glucose and don't stir early."]],"uses":["On tarts, choux and cakes","Chopped into cookies and streusel","Ground into crunch layers and praline","Bars and petits fours","Verrine toppings"],"vary":["Sesame or pumpkin seed","Sunflower and hemp (Nordic)","Cocoa nib","Miso or soy brittle","Spiced pecans","Sugared hazelnuts (dragée style)"],"eq":["Thermometer","Silicone mat","Oiled spatula"],"at":"20 min","tt":"40 min"},{"id":"noug","n":"Nougat & nougatine","f":"sug","d":3,"o":"partial","what":"Two confections built on honey, sugar and nuts. Soft nougat (Montélimar style): hot honey and sugar syrup whipped into egg whites with plenty of toasted nuts, set in a frame and cut. Nougatine: a thin, glassy caramel with chopped nuts, rolled out warm into sheets, discs and shapes.","how":"In nougat, the hot syrup cooks the egg-white foam; the hotter the syrup, the firmer and chewier the nougat. Nougatine is a caramel made pliable with glucose and butter, so it can be rolled while warm and softened again in the oven to reshape.","ratio":[["Soft nougat","Honey 150 · sugar 300 · glucose 75 · water 90 · egg whites 50 · toasted nuts 400 · cocoa butter 20 (optional) · wafer paper"],["Nougatine","Sugar (or fondant) 300 · glucose 200 · butter 30 · chopped nuts or nibs 150"]],"temps":[["Honey","120 °C"],["Sugar syrup","145–150 °C (softer) to 155 °C (firmer)"],["Nougatine caramel","165–175 °C, golden"],["Reshape nougatine","soften at 160 °C"]],"steps":["Nougat: toast the nuts and keep them warm in a 100 °C oven. Line a frame with wafer paper.","Heat the honey to 120 °C. Whip the whites to soft peaks and pour in the honey.","Cook sugar, glucose and water to 145–150 °C and stream it into the whites. Keep whipping until thick and only warm (about 10 min).","Fold in the melted cocoa butter, then the warm nuts. Press into the frame, cover with wafer paper and weigh down. Set 12 h, then cut with an oiled knife.","Nougatine: cook sugar and glucose to a golden caramel, stir in butter and warm nuts, pour onto a mat, roll thin between mats while warm and cut. Soften in the oven to reshape."],"oven":"Nougatine keeps its snap and can be baked as tuiles; soft nougat goes on after baking (it melts).","r":"2–3 weeks airtight","fr":"Not needed","fz":"No (sweats)","fails":[["Nougat soft and sticky","Syrup not hot enough, or a humid day. Cook 3–5 °C higher."],["Nougat rock hard","Syrup too hot."],["Nougatine cracks when rolled","Cooled too far. Warm it in the oven and roll again."],["Nougatine turns tacky","Humidity. Store airtight with silica gel."]],"uses":["Petits fours and bars","Chopped into ice cream, mousses and cookies","Nougatine discs and shards on tarts and entremets","Nougatine cones and bowls"],"vary":["Pistachio, almond, hazelnut","Buckwheat honey and walnut","Dried sour cherry or cranberry","Cocoa nib nougatine","Sesame nougatine","Nougat glacé (frozen, with meringue and cream)"],"eq":["Stand mixer","Thermometer","Frame or tin","Silicone mats","Rolling pin"],"at":"1 h","tt":"Overnight"},{"id":"tuile","n":"Tuiles & lace crisps","f":"tex","d":2,"o":"yes","what":"Thin, snappy decorations baked from a spreadable batter: classic tuile (butter, sugar, flour, egg white), lace or florentine (butter, sugar, glucose, nuts that spread into a web) and fruit tuiles. Shaped while still warm.","how":"A thin layer bakes through before it browns too far. Sugar and butter make it spread and snap; flour and white hold its shape; glucose and nuts make the lacy holes.","ratio":[["Classic tuile","Butter 100 · icing sugar 100 · egg whites 100 · flour 100"],["Lace / florentine","Butter 50 · sugar 50 · glucose 30 · flour 15 · flaked nuts or seeds 60"],["Fruit tuile","Fruit purée 100 · icing sugar 50 · flour 15 · melted butter 25"]],"temps":[["Classic","160–170 °C, 6–8 min, golden edges"],["Lace","170 °C, 8–10 min"],["Shape","within 10–20 s of leaving the oven"]],"steps":["Mix the batter until smooth and rest it at least 1 h in the fridge (it spreads more evenly).","Spread thin through a stencil onto a mat, or drop small spoonfuls for lace.","Bake until evenly golden.","Shape at once over a rolling pin, in a cup or by twisting. If it sets, put it back in the oven for a few seconds.","Cool and store airtight."],"oven":"Baked on their own; added to the item after baking.","r":"3–5 days airtight","fr":"No","fz":"Batter only","fails":[["Soft, bendy","Under-baked, or humidity. Bake longer and store airtight."],["Burnt edges, pale centre","Spread unevenly; use a stencil."],["Spreads into one sheet","Batter too warm or too buttery; chill it."]],"uses":["Garnish on tarts, petits gâteaux and verrines","Rolled cigars filled with cream","Florentine discs dipped in chocolate","With ice cream and plated desserts","A snap against soft creams"],"vary":["Sesame or black sesame","Cocoa or cocoa nib","Oat or buckwheat lace","Rye crumb tuile","Raspberry or sea buckthorn fruit tuile","Parmesan crisp (savoury)"],"eq":["Silicone mats","Stencils","Offset spatula","Rolling pin for shaping"],"at":"20 min","tt":"1 h 30 min (with rest)"},{"id":"mallow","n":"Marshmallow","f":"air","d":2,"o":"partial","what":"Hot sugar syrup whipped with gelatin into a light, bouncy foam that sets. Cut into squares, piped onto tarts and cookies, or torched for a toasted caramel top.","how":"Gelatin traps air as the syrup cools; glucose or invert sugar keeps it soft. Part of the water can be fruit purée or honey for flavour.","ratio":[["Classic","Sugar 300 · glucose or invert 100 · water 100 · gelatin 18 g (bloomed in 90 g water) · vanilla"],["Fruit","Replace the water with 120 g fruit purée; a little citric acid at the end"],["Coating","Icing sugar and cornflour 1:1"]],"temps":[["Syrup","115–120 °C"],["Whip until","35–40 °C, thick and white"],["Pipe at","about 35 °C"]],"steps":["Bloom the gelatin. Line and dust a frame.","Cook sugar, glucose and water to 117 °C.","Pour onto the gelatin in the mixer and whip on high for 8–10 min, until thick, white and lukewarm.","Flavour it, then pipe onto tarts or cookies, or spread in the frame.","Set 4 h or overnight. Cut and roll in the coating; torch just before serving."],"oven":"Partly. Torch it or flash it under the grill; longer baking melts it.","r":"1–2 weeks airtight","fr":"Not needed","fz":"Yes","fails":[["Dense, doesn't hold","Not whipped long enough, or the syrup was too cool."],["Sets before piping","Whipped too long; work faster or pipe it warmer."],["Weeps","Too little gelatin, or acid added too early. Add fruit acid at the end."]],"uses":["Torched on tarts (s'mores style)","On cookies and bars","Squares as petits fours","Inside stuffed cookies","On hot chocolate at the counter"],"vary":["Raspberry, passion fruit","Honey or buckwheat honey","Toasted coconut coating","Coffee","Elderflower","Vegan, with agar or aquafaba (softer)"],"eq":["Stand mixer","Thermometer","Frame or tin","Piping bag"],"at":"30 min","tt":"4 h to overnight"},{"id":"chdec","n":"Chocolate décor & bark","f":"fin","d":2,"o":"no","what":"Tempered chocolate spread thin and cut, curled or set: shards, discs, curls, bark scattered with nuts and fruit, transfer-sheet plaques, piped filigree. Adds snap, shine and a finished look.","how":"Tempering makes cocoa butter set in its stable crystal form, so the chocolate is glossy, snaps cleanly and releases from acetate. Cut it just as it sets, before it turns brittle.","ratio":[["Bark","Chocolate 300 · toppings 100–150 (nuts, nibs, freeze-dried fruit, flaky salt)"],["Seed method","Melt two thirds, stir in one third finely chopped; or 1% cocoa butter powder at 34 °C"]],"temps":[["Dark","melt 50 °C · cool to 28–29 °C · work at 31–32 °C"],["Milk","45 °C · 27–28 °C · work at 29–30 °C"],["White and blond","45 °C · 26–27 °C · work at 28–29 °C"]],"steps":["Temper the chocolate (the seed method is the easiest).","Test it: a smear on foil should set glossy in 3–5 min at room temperature.","Spread thin on acetate. When just set and no longer sticky, cut shapes with a knife or cutter.","For curls, spread on the back of a tray and scrape; for bark, spread and scatter the toppings.","Weigh the acetate down so it sets flat in a cool room, then give it 10 min in the fridge."],"oven":"No. Finishing only.","r":"Weeks at 15–18 °C","fr":"Briefly (risk of bloom)","fz":"No","fails":[["Dull, streaky","Out of temper. Re-temper."],["Shatters when cut","Cut too late; cut as it just sets."],["Melts on the item","Placed on something warm or wet. Add it at the very end."]],"uses":["Shards and discs on tarts and petits gâteaux","Collars and bands","Bark for the counter","Curls on cakes","Plaques with a printed transfer"],"vary":["Dark with cocoa nib and flaky salt","Blond chocolate","White with freeze-dried raspberry","Milk with buckwheat crunch","Ruby chocolate"],"eq":["Thermometer","Acetate","Offset spatula","Cutters"],"at":"30 min","tt":"1 h"},{"id":"glaze","n":"Glazes","f":"fin","d":2,"o":"no","what":"Shiny coatings: mirror glaze (white chocolate, condensed milk, gelatin), neutral glaze (clear, pectin-set) and apricot nappage for fruit and danish.","how":"Gelatin or pectin sets a thin film; glucose and condensed milk add gloss and flexibility. Poured at the right temperature onto a frozen dessert, it sets on contact.","ratio":[["Mirror","Glucose 150 · sugar 150 · water 75 · condensed milk 100 · gelatin 10 g + 60 g water · white chocolate 150"],["Neutral","Water 500 · sugar 150 · glucose 50 · pectin NH 10 · lemon 10"]],"temps":[["Mirror syrup","103 °C"],["Pour mirror at","32–35 °C onto a frozen dessert"],["Neutral","brush at 40–60 °C"]],"steps":["Boil water, sugar and glucose to 103 °C.","Add condensed milk and bloomed gelatin.","Pour over chocolate; blend fully submerged (no bubbles); color; strain.","Use at 32–35 °C over a frozen entremet on a rack."],"oven":"No. Neutral or apricot glaze is brushed on danish straight after baking.","r":"Hours on the dessert","fr":"Glaze itself: 1–2 weeks","fz":"Glaze frozen desserts, thaw in the fridge","fails":[["Runs off","Too warm."],["Too thick, lumpy","Too cool; rewarm."],["Bubbles","Blend submerged and strain."]],"uses":["Entremets","Fruit tarts","Danish shine","Petits gâteaux"],"vary":["Chocolate mirror (cocoa)","Apricot nappage","Colored glazes"],"eq":["Thermometer","Stick blender","Sieve","Rack"],"at":"20 min","tt":"30 min"},{"id":"syrup","n":"Soaking syrups","f":"fin","d":1,"o":"no","what":"Sugar syrups to moisten sponges, glaze babka and buns, and soak babas and savarins.","how":"Sugar holds water in the crumb and slows staling; a hot syrup on hot bread soaks in fast and leaves a shine.","ratio":[["Standard","Sugar 1 : water 1"],["Light (sponges)","Sugar 1 : water 1.5–2"],["Flavor","Zest, vanilla, coffee, liqueur 5–10%"]],"temps":[["Boil","until sugar dissolves"],["Babka/buns","hot syrup on hot bake"]],"steps":["Bring sugar and water to a boil with aromatics.","Cool for sponges; keep hot for babka and buns.","Brush or spoon on; add liqueur off the heat."],"oven":"Applied after baking.","r":"Weeks in the fridge","fr":"Weeks","fz":"Yes","fails":[["Soggy","Too much or too thin."],["Crystallises","Add a little glucose."]],"uses":["Babka and cinnamon buns","Sponge layers","Baba and savarin"],"vary":["Honey and thyme","Citrus","Coffee","Sea buckthorn"],"eq":["Saucepan","Brush"],"at":"5 min","tt":"10 min"},{"id":"nutb","n":"Nut & seed butters","f":"sug","d":1,"o":"partial","what":"Roasted nuts or seeds blended until their oil is released and they become a smooth butter. Also sweet spreads built on them: hazelnut cocoa, pistachio cream.","how":"Long blending ruptures the cells and frees the oil: first a powder, then a thick ball, then a fluid butter. Warm nuts blend faster. Low-fat seeds need a little added oil.","ratio":[["Plain butter","Nuts or seeds 100% + salt 0.5–1%"],["Low-fat seeds","+ 3–8% neutral oil"],["Sweet spread","Nut butter 1 : icing sugar 0.3–0.5 : milk powder 0.1–0.2 : oil 0.1 (+ cocoa or white chocolate)"]],"temps":[["Roast","150–170 °C until fragrant"],["Blend","warm nuts"]],"steps":["Roast nuts or seeds; rub off skins if needed.","Blend while warm, scraping down: powder → clump → fluid butter (5–15 min, resting the motor).","Add salt (and sweeteners, cocoa, oil) at the end.","Jar. Oil separation is normal; stir back in."],"oven":"Swirled into doughs, cookies and babka it bakes well. On its own it oils out and scorches.","r":"Weeks (plain); spreads with milk powder 2–3 weeks","fr":"Months","fz":"Yes","fails":[["Stuck at a dry ball","Keep going; add a spoon of oil only if the motor struggles."],["Seizes when sweetening","Liquid (honey, extract) added; use powdered sweeteners or blend longer."],["Bitter","Over-roasted."]],"uses":["Babka and swirl buns","Croissant and cruffin filling","Cookies","Base for praline-style creams"],"vary":["Almond, cashew, pecan","Sunflower or hemp (nut-free)","Hazelnut cocoa spread","Pistachio cream"],"eq":["Food processor or high-speed blender","Oven"],"at":"20 min","tt":"40 min"},{"id":"cookieb","n":"Cookie & pastry butters","f":"sug","d":1,"o":"partial","what":"Spreads made by blending baked crumbs with fat and something sweet and liquid: speculoos (cookie) butter, croissant butter, black bread butter.","how":"Crumbs bring the flavor and structure; fat and a sweet liquid (milk, condensed milk, honey) turn them into a smooth, spreadable paste.","ratio":[["Cookie butter","Crumbs 1 : fat 0.3–0.4 : sweet liquid 0.3 (+ spice, salt)"],["Pastry butter","Toasted crumbs 1 : soft butter 0.6–0.8 : condensed milk 0.4"],["Smoothness","Grind crumbs fine first, then add liquids"]],"temps":[["Toast crumbs","160 °C, 8–12 min"],["Liquids","warm, so they blend in"]],"steps":["Toast or dry the crumbs; grind to a fine powder.","Warm the liquids (milk, condensed milk, honey) with the fat.","Blend into the crumbs until smooth and spreadable.","Season; jar."],"oven":"Fine swirled into doughs and cookies; on top it browns fast.","r":"Oil-based: 2 weeks · butter/dairy-based: max 1 day","fr":"2–3 weeks","fz":"Yes","fails":[["Grainy","Grind crumbs finer before adding liquid."],["Too stiff","More warm liquid."],["Greasy","Too much fat; add more crumbs."]],"uses":["Croissant and cruffin filling","Swirl buns","Cookie sandwich filling","Toppings for tarts"],"vary":["Speculoos","Croissant","Black bread (juoda duona) with honey","Brown butter shortbread"],"eq":["Food processor","Oven"],"at":"15 min","tt":"30 min"},{"id":"chbar","n":"Chocolate-bound bars & halva","f":"sug","d":1,"o":"no","what":"Seeds, nuts or crumbs held together with chocolate as the only binder: seed 'halva', black bread chocolate bars, crispy bars.","how":"Ground oily seeds become a paste and need little chocolate. Dry crumbs need more, because the chocolate has to coat and glue every piece. Tempered chocolate gives snap and a longer shelf life.","ratio":[["Oily seeds, ground (hemp, sunflower)","Seeds 1 : dark chocolate 0.15–0.25 : sugar 0.05–0.1"],["Dry crumbs (bread, biscuits)","Crumbs 1.5–1.8 : dark chocolate 1 : sugar 0.1–0.15 : salt ~1%"],["Chocolate","Dark 70–90%; tempered or used at 30–32 °C"]],"temps":[["Chocolate","melt to 45 °C, use at 30–32 °C (or temper)"],["Set","cool room temp, 16–18 °C"]],"steps":["Toast or dry the base (seeds, crumbs) and cool.","Grind oily seeds with the sugar to a coarse paste; mix dry crumbs with sugar and salt.","Fold in the melted or tempered chocolate until every piece is coated.","Press firmly into a lined frame or mould; set, then cut."],"oven":"No; chocolate melts. Chunks can go into cookies.","r":"2–4 weeks, airtight","fr":"Longer, but can bloom","fz":"Yes","fails":[["Crumbles","Not enough chocolate, or not pressed hard enough."],["Dull, streaky","Chocolate not tempered or set too warm."],["Soft crumbs","Crumbs not dry enough; dry them at 120 °C."]],"uses":["Bars and bites","Crunch layer in tarts and entremets","Chopped into cookies","Petit fours"],"vary":["Hemp seed halva","Black bread chocolate bar","Sunflower–cocoa halva","Buckwheat and rye crunch bar"],"eq":["Food processor","Thermometer","Frame or mould"],"at":"20 min","tt":"2 h"},{"id":"pud","n":"Stovetop puddings","f":"cust","d":1,"o":"no","what":"Spoonable starch-thickened milk puddings, often with eggs: pistachio, chocolate, vanilla, butterscotch. Softer than pastry cream.","how":"Same science as pastry cream (starch must boil), but with less starch and fewer eggs so it sets soft. Nut butters or chocolate add body and flavor.","ratio":[["Milk","1000"],["Sugar","120–180"],["Cornstarch","40–55 (soft) · 60–70 (tart filling)"],["Eggs or yolks","0–200"],["Butter","20–40 · flavor: nut butter 150–200, or chocolate 100–150"]],"temps":[["Boil","until thick and bubbling, ~1 min"],["Set","3 h+ in the fridge"]],"steps":["Whisk sugar, starch and salt; whisk in eggs, then milk (and nut butt
