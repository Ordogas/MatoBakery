something freezes.","m":"A refractometer replaces guesswork for jams, pâte de fruit, sorbets and syrups.","tips":["Typical targets: sorbet 25–30 °Bx · compote and insert 40–55 · jam 60–65 · pâte de fruit 72–75.","Taste and Brix together: higher Brix with dextrose tastes less sweet."],"t":["comp","jam","pdf"]},{"n":"Salt in sweets","w":"Salt suppresses bitterness and makes sweetness and aroma read stronger. Small amounts don't taste salty; they make flavors pop.","m":"Unsalted caramel, chocolate and praline taste flat. Around 0.3–1% salt is a pastry habit.","tips":["Salt every component a little, not only the caramel.","Flaky salt on top gives contrast; dissolved salt gives roundness."],"t":["car","pral","chbar"]},{"n":"Temperature changes taste","w":"Cold numbs sweetness and aroma; warmth releases them. Fat-based things also taste less sweet and less aromatic when cold.","m":"A mousse tuned at room temperature tastes flat straight from the fridge.","tips":["Taste components at the temperature they'll be served.","Cold desserts need a touch more sugar, acid and salt than you'd think."],"t":["mou","cre","wgan"]},{"n":"Freezing and thawing","w":"Ice crystals form as water freezes. Fast freezing makes small crystals (smooth); slow freezing makes large ones that break structure. Sugar, alcohol and fat lower the freezing point and keep things softer.","m":"Why entremets are blast-frozen and thawed slowly in the fridge, and why starch creams weep after thawing.","tips":["Freeze small and flat, as fast as possible; wrap airtight against freezer burn.","Thaw entremets overnight in the fridge, not at room temperature (condensation)."],"t":["mou","cre","glaze"]},{"n":"Lactic fermentation","w":"Lactic acid bacteria on vegetables and fruit turn sugars into lactic acid when air is excluded and salt keeps competitors out. The acid preserves and adds deep, complex sourness.","m":"Behind sauerkraut, rauginti agurkai, kimchi, fermented fruit and cultured dairy.","tips":["Weigh salt as a %: 2% for shredded vegetables and fruit, 3–5% brine for whole vegetables.","Keep everything under the brine; air is where mould grows."],"t":["ferm","ferfruit"]}],"SEASON":[{"m":"January","p":"Stored apples and pears, cranberries, root vegetables, cabbage, citrus at its best (blood orange, Seville orange)","f":"—","d":"Seville orange marmalade time","r":["c-pdf","b-curd","v-kraut","c-syrup"]},{"m":"February","p":"Citrus, stored apples, frozen berries, beetroot, celeriac","f":"—","d":"Užgavėnės (Shrove Tuesday): blynai, spurgos (doughnuts)","r":["s-dipl","s-jam","b-curd","c-dulce"]},{"m":"March","p":"Forced rhubarb (late), citrus, sprouts and microgreens","f":"Birch sap (late March–April)","d":"Kaziuko mugė (early March fair): riestainiai, honey cakes","r":["l-gira","c-syrup","v-labneh"]},{"m":"April","p":"Rhubarb, radish, spring onions, nettles","f":"Wild garlic, birch sap, nettle, sorrel","d":"Easter (Velykos): margučiai, babka, varškė desserts","r":["v-wildg","s-cheese","c-sunhalva"]},{"m":"May","p":"Rhubarb, asparagus, radishes, lovage, early herbs","f":"Spruce tips, dandelion, wild garlic, sorrel, birch leaves","d":"","r":["l-sprucesugar","l-sprucepick","l-dilloil","p-strgr"]},{"m":"June","p":"Strawberries (late June), peas, broad beans, early cucumbers, herbs","f":"Elderflower, linden flowers (late June–July)","d":"Joninės (Midsummer, 24 June): cheese, honey, beer","r":["p-strgr","v-pea","v-dillcuc","w-creme"]},{"m":"July","p":"Strawberries, raspberries, black and red currants, gooseberries, sour cherries, cucumbers, dill","f":"Bilberries (late July), chanterelles, linden flowers","d":"Pickling season","r":["p-bcnam","v-agurkai","p-bilcard","l-currantleaf"]},{"m":"August","p":"Bilberries, blueberries, raspberries, plums, early apples, tomatoes, zucchini","f":"Chanterelles, porcini, heather (honey)","d":"","r":["l-bilferm","l-plum","v-tomjam","v-dux"]},{"m":"September","p":"Apples, pears, plums, sea buckthorn, pumpkin, cabbage","f":"Lingonberries, rowan, ros function searchAll(q, lim = 400) {
  const lq = q.toLowerCase().trim(); if (!lq) return [];

  const push = (t, kind, rank) => { const k = t.toLowerCase(); if (seen.has(k)) return; seen.add(k); out.push({ t, kind, rank }); };
  const kindOfP = t => isDay(t) ? "Diary" : t in OWN ? "Your pages" : GENSRC[t] === "planner" ? "From Recipes" : "Kitchen OS";
  for (const t of Object.keys(DB.pages)) { const label = isDay(t) ? dayShort(t) : t; const i = label.toLowerCase().indexOf(lq); if (i >= 0) push(t, kindOfP(t), i === 0 ? 0 : 1); }
  for (const e of REFT) { const i = e.title.toLowerCase().indexOf(lq); if (i >= 0) push(e.title, KINDL[e.kind], i === 0 ? 0 : 1); }
  LAB.ING.forEach(x => { if (x.al.some(a => a.toLowerCase().includes(lq))) push(x.n, KINDL.ing, 2); });
  for (const t of Object.keys(DB.pages)) if (DB.pages[t].toLowerCase().includes(lq)) push(t, kindOfP(t), 3);
  return out.sort((a, b) => a.rank - b.rank || a.t.localeCompare(b.t)).slice(0, lim);
}

document.addEventListener("keydown", e => {
  const id = e.target.id;
  if (id === "ed" && AC.open) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); AC.i = (AC.i + (e.key === "ArrowDown" ? 1 : -1) + AC.items.length) % AC.items.length; $$("#ac button").forEach((b, i) => b.setAttribute("aria-selected", i === AC.i)); return; }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); acPick(AC.i); return; }
    if (e.key === "Escape") { $("#ac").hidden = true; AC.open = false; return; }
  }
  if (id === "ed" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('[data-act="saveed"]').click(); return; }
  const lists = { q: [QS, "#qres", qGo], pfq: [PS, "#pfres", i => pfAdd(PS.items[i])] };
  if (lists[id]) {
    const [S, box, go] = lists[id];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!S.items.length) return; S.i = (S.i + (e.key === "ArrowDown" ? 1 : -1) + S.items.length) % S.items.length; $$(box + " button").forEach((b, i) => b.setAttribute("aria-selected", i === S.i)); }
    else if (e.key === "Enter") { e.preventDefault(); if (S.items.length) go(S.i); }
    else if (e.key === "Escape") { $(box).hidden = true; e.target.blur(); }
    return;
  }
  if (e.key === "Enter" && id.startsWith("nfi-")) { e.preventDefault(); $(`[data-act="newflav"][data-li="${id.slice(4)}"]`).click(); return; }
  if (e.key === "Enter" && id === "nnote") { e.preventDefault(); $('[data-act="addnote"]').click(); return; }
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
});

    $("#view").innerHTML = `<div class="card"><h2>Couldn't load the notebook</h2><p>${esc(e.message)}</p><p class="small muted">If it says nb_pages doesn't exist, the notebook's tables haven't been set up in Supabase yet (sql/001_notebook.sql). If it says permission denied, sign in with the planner's admin account.</p><button type="button" class="btn" data-act="signout">Sign out</button></div>`; return;
  }
  $("#livefoot").hidden = false; $("#demofoot").hidden = true; setSync("Connected to Supabase");
  route();
}
(async () => {
  if (!LIVE) { loadDemo(); route(); return; }
  SB = window.supabase.createClient(NB.url, NB.key);
  const { data } = await SB.auth.getSession();
  if (!data.session) showLogin(); else start();
})();
</script>
