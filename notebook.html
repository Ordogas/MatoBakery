er).","Cook over medium heat, whisking constantly, until thick with large bubbles.","Strain; whisk in butter and flavorings.","Pour into cups or a baked shell; film on contact; chill at least 3 h."],"oven":"No. For a cream pie or tart, use the firmer starch ratio and fill a baked shell.","r":"No","fr":"2–4 days","fz":"No (weeps)","fails":[["Thin","Not boiled long enough, or too little starch."],["Lumpy","Whisk constantly; strain."],["Weeps after a few days","Normal for starch; stir before serving."]],"uses":["Cups and verrines","Cream pies and tarts","Choux (firmer version)","Layered with crumble"],"vary":["Pistachio","Chocolate","Butterscotch (brown sugar)","Rye bread pudding cups"],"eq":["Heavy pan","Whisk","Sieve"],"at":"20 min","tt":"3 h+"},{"id":"icing","n":"Icings & frostings","f":"fin","d":1,"o":"no","what":"Sugar-based finishes: royal icing for piping and decorating, simple icing glaze for buns and danish, and cream cheese frosting.","how":"Royal icing sets hard because egg white proteins dry around the sugar. Glaze icing is just dissolved icing sugar that dries to a thin shell. Frostings are fat-based and stay soft.","ratio":[["Royal icing","Egg white 1 : icing sugar 5–6 (+ a few drops of lemon)"],["Consistency","Stiff for piping details; thin with water for flooding"],["Glaze icing","Icing sugar 100 : liquid 15–20"],["Cream cheese frosting","Cream cheese 2 : butter 1 : icing sugar 1–1.5"]],"temps":[["Cream cheese","cold from the fridge"],["Butter","soft"]],"steps":["Royal: beat white with sifted icing sugar and lemon to stiff peaks (5 min).","Adjust with water a few drops at a time for the consistency you need.","Glaze: stir liquid into icing sugar; spread on cooled or warm bakes.","Frosting: beat butter and sugar, then add cold cream cheese briefly."],"oven":"No. Royal icing can be dried at low heat; glaze goes on warm bakes.","r":"Royal icing dries hard and keeps weeks on cookies","fr":"Royal icing (covered) 3 days · frosting 5 days","fz":"Frosting: yes","fails":[["Royal won't set","Grease in the bowl, or too much water."],["Glaze too thin / transparent","Less liquid; let the bake cool more."],["Runny frosting","Cream cheese beaten too long or too warm; chill and re-beat briefly."],["Raw white","Use pasteurised whites or meringue powder for sale."]],"uses":["Decorated cookies (piparkukai)","Cinnamon and cardamom buns","Danish and pastries","Carrot cake and layer cakes"],"vary":["Lemon glaze","Brown butter glaze","Maple or honey glaze","Coloured royal icing"],"eq":["Mixer","Piping bags","Fine tips"],"at":"10 min","tt":"10 min"},{"id":"flsalt","n":"Flavoured salts & sugars","f":"lab","d":1,"o":"yes","what":"Salt or sugar carrying a concentrated flavor: kelp salt, mushroom salt, sea buckthorn salt, spruce-tip sugar. A finishing seasoning that adds an unexpected note.","how":"Dry, ground ingredients (seaweed, mushrooms, fruit, needles) are blended with salt or sugar, which draws out and preserves aroma. Anything wet is dried at low heat afterwards.","ratio":[["Seaweed / mushroom salt","Dried ingredient 1 : flaky or coarse salt 2–3"],["Fruit salt or sugar","Fruit powder 1 : salt or sugar 3–4"],["Fresh green sugar","Fresh tips or herbs 1 : sugar 4, blended then dried at 40–50 °C"]],"temps":[["Dry","40–60 °C"],["Toast seaweed","briefly in a dry pan"]],"steps":["Dry or toast the flavor ingredient.","Grind to a powder.","Mix with salt or sugar (or blend fresh, then dry).","Store airtight, away from light."],"oven":"Sugars can go on doughs before baking; salts usually go on after for crunch.","r":"Months, airtight","fr":"Not needed","fz":"Not needed","fails":[["Clumps","Not dry enough; dry again and re-sieve."],["Fades","Light and air; make small batches, dark jars."]],"uses":["Caramel and chocolate finishing","Focaccia and savoury pastries","Butter and cream infusions","Rims and crusts"],"vary":["Kelp salt","Porcini salt","Sea buckthorn salt","Spruce-tip or lemon verbena sugar"],"eq":["Spice grinder","Dehydrator or oven"],"at":"15 min","tt":"1–12 h"},{"id":"ucar","n":"Unusual caramels & reductions","f":"lab","d":2,"o":"partial","what":"Caramel and syrup made from liquids other than plain sugar and cream: beer caramel, whey caramel (like Norwegian brunost), gira (kvass) syrup, birch syrup.","how":"Reducing a flavorful liquid concentrates its sugars, acids and proteins; the milk sugar and protein in whey brown into a fudgy, cheese-like caramel. Bitterness (beer) and sourness (kvass) balance the sweetness.","ratio":[["Beer caramel","Dark beer 1, reduced to ¼, + sugar 0.5 caramelised + cream 0.4"],["Whey caramel","Whey 10 : cream 1, reduced to about 1/8"],["Syrups","Liquid reduced by 70–85%, + sugar to taste"]],"temps":[["Reduce","steady simmer"],["Finish","103–106 °C for sauce"]],"steps":["Reduce the liquid (beer, whey, kvass) in a wide pan.","Make or add the caramel, or let the sugars in the reduction brown.","Finish with cream and butter or keep as a syrup.","Season with salt; strain."],"oven":"Like caramel: sauce runs, firm versions hold briefly.","r":"Days","fr":"2–4 weeks","fz":"Yes","fails":[["Bitter","Beer reduced too hard; balance with cream and salt."],["Grainy whey caramel","Stir constantly at the end; blend smooth."],["Too thin","Reduce further."]],"uses":["Sauce for buns and tarts","Base for whipped ganache and crémeux","Glaze for babka","With rye, apple, cheese"],"vary":["Beer caramel","Whey caramel","Gira (kvass) syrup","Birch syrup caramel"],"eq":["Wide heavy pan","Thermometer"],"at":"20 min","tt":"1–3 h"},{"id":"infuse","n":"Infused oils, fats & creams","f":"lab","d":1,"o":"partial","what":"Flavor carried in fat: green herb oils, brown butter, hay-infused cream, black currant leaf cream. The quickest way to give a classic cream a new aroma.","how":"Many aromas are fat-soluble. Heat speeds extraction (oils, butter); a cold overnight infusion (cream) keeps aromas fresh and clean.","ratio":[["Green oil","Blanched herbs 1 : neutral oil 2, blended to 60–70 °C"],["Cold cream infusion","Cream + 3–6% leaves or toasted hay, 12–24 h in the fridge"],["Brown butter","Butter loses ~15–20% weight"]],"temps":[["Green oil","blend to 60–70 °C, then chill fast"],["Brown butter","until 'hazelnut', ~150–160 °C solids"]],"steps":["Choose hot (oil, butter) or cold (cream) extraction.","Infuse; strain through a fine cloth or coffee filter.","Chill fast to keep color and aroma.","Use the infused fat in your normal recipe."],"oven":"Brown butter bakes into everything. Green oils and infused creams go into post-bake components.","r":"Oils: days in the dark","fr":"Oils 1–2 weeks · creams 2–3 days","fz":"Oils and butter: yes","fails":[["Brown, grassy oil","Overheated; keep under 70 °C and chill on ice."],["Bitter cream","Leaves left too long; taste at 12 h."],["Burnt butter","Pull at hazelnut colour; it keeps cooking."]],"uses":["Whipped cream and ganache bases","Crémeux and anglaise","Finishing drops on tartlets","Frangipane and doughs (brown butter)"],"vary":["Dill or lovage oil","Spruce-tip oil","Hay cream","Black currant leaf or fig leaf cream"],"eq":["Blender","Coffee filter or cloth","Ice bath"],"at":"20 min","tt":"1–24 h"},{"id":"powder","n":"Powders, dusts & ashes","f":"lab","d":1,"o":"partial","what":"Dried and ground components for colour and concentrated flavor: berry dust, brown butter powder, vegetable ash.","how":"Removing water concentrates flavor and lets you finish a pastry with a dry, intense layer. Maltodextrin turns fats into powders; burning vegetables gives a mineral, smoky ash.","ratio":[["Fruit dust","Purée spread 2 mm, dried at 50–60 °C, ground"],["Fat powder","Fat 1 : tapioca maltodextrin 0.6–1"],["Ash","Leek or onion tops charred black, ground; use sparingly"]],"temps":[["Dry fruit","50–60 °C"],["Char","hot oven 250 °C or open flame"]],"steps":["Dry or char the ingredient completely.","Grind and sieve.","Store airtight with a desiccant if possible.","Dust or sift at the last moment."],"oven":"Fruit dusts colour doughs; most are finishing touches after baking.","r":"Weeks, airtight and dry","fr":"Not needed","fz":"Not needed","fails":[["Clumps","Humidity; add a pinch of maltodextrin or re-dry."],["Bitter ash","Use only tops; very little."]],"uses":["Finishing tarts and choux","Colouring crunch and glazes","Rims and plated desserts","Savoury tartlets (ash)"],"vary":["Bilberry or sea buckthorn dust","Brown butter powder","Leek ash","Rye crumb 'soil'"],"eq":["Dehydrator or oven","Spice grinder","Sieve"],"at":"15 min","tt":"4–12 h"},{"id":"ferfruit","n":"Lacto-fermented fruit","f":"lab","d":2,"o":"partial","what":"Fruit fermented with 2% salt: plums, bilberries, gooseberries. The fruit turns tangy, savoury and complex, and the juice becomes a seasoning.","how":"The same lactic fermentation as sauerkraut, applied to fruit. Salt keeps spoilage organisms out while lactic bacteria add acidity and depth.","ratio":[["Fruit","+ 2% salt by weight (some recipes add 1–2% sugar)"],["Time","5–14 days at 18–22 °C, then fridge"]],"temps":[["Ferment","18–22 °C"],["Then","fridge"]],"steps":["Weigh fruit; add exactly 2% salt; mix.","Pack into a vacuum bag or jar with a weight; keep submerged in its juice.","Ferment, burping bags or jars; taste from day 5.","Refrigerate when sour and complex. Use fruit and juice."],"oven":"Fruit can be baked into tarts; the juice is a cold seasoning or reduced into a glaze.","r":"During fermentation only","fr":"Months","fz":"Yes","fails":[["Mould","Exposed to air; keep submerged, use vacuum bags."],["Too salty for sweets","Rinse fruit; pair the juice with caramel or cream."]],"uses":["Plum tart with brown butter","Juice to season caramel and cream","Reduced into a glaze","With cheese creams"],"vary":["Plums","Bilberries","Gooseberries","Green strawberries"],"eq":["Scale","Vacuum bags or jars","Weights"],"at":"15 min","tt":"1–2 weeks"},{"id":"royale","sv":1,"n":"Savoury custard (royale)","f":"sv_base","d":1,"o":"yes","what":"Eggs and cream or milk that set in the oven. The filling for quiche, savoury tartlets and savoury danish.","how":"Egg proteins set at roughly 70–80 °C. Pull it out with a slight wobble; carry-over heat finishes it.","ratio":[["Base","Eggs 1 : dairy 2 by weight (e.g. 200 g eggs : 400 g cream/milk)"],["Salt","~1% of the mix"],["Fillings","Up to about equal weight, cooked and dry"]],"temps":[["Bake","150–170 °C"],["Done","just set, ~75–80 °C in the centre"]],"steps":["Blind-bake and seal the shell (egg wash, 2 min back in the oven).","Whisk eggs, dairy and seasoning without making foam.","Put cooked, well-drained fillings in the shell; pour the royale over.","Bake low until barely set; rest 15 min before cutting."],"oven":"Yes; it sets in the oven.","r":"Max 2 h","fr":"Baked: 3 days","fz":"Baked quiche: yes","fails":[["Watery","Wet fillings, or overbaked."],["Bubbly, curdled","Oven too hot."],["Soggy base","Blind-bake and seal."]],"uses":["Quiche and tartlets","Savoury danish","Croissant with egg","Savoury flans"],"vary":["Leek and Džiugas","Smoked fish and dill","Spinach and feta","Mushroom duxelles"],"eq":["Tart rings","Whisk"],"at":"15 min","tt":"1 h"},{"id":"bech","sv":1,"n":"Béchamel & mornay","f":"sv_base","d":1,"o":"yes","what":"Milk thickened with a roux; mornay adds cheese. Made thick, it's piped into croissants, croques and savoury danish.","how":"Flour starch gels when the sauce boils. A thick ratio gives a pipeable filling that bubbles and browns in the oven instead of running.","ratio":[["Thick filling","Butter 70–90 : flour 70–90 : milk 1000"],["Mornay","+ 150–200 g grated hard cheese, optional yolk"],["Seasoning","Salt ~0.8%, nutmeg, pepper, mustard"]],"temps":[["Roux","cook 2 min, no colour"],["Sauce","boil 2–3 min"]],"steps":["Melt butter; add flour; cook 2 min without colour.","Whisk in milk gradually; bring to a boil.","Boil 2–3 min, stirring, to cook out the flour.","Season; off the heat add cheese. Film on contact and cool before piping."],"oven":"Yes.","r":"Max 2 h","fr":"3 days","fz":"Poor (weeps); mornay a bit better","fails":[["Lumps","Whisk hard or blend."],["Floury taste","Cook longer."],["Too thin","Reduce or add more roux."]],"uses":["Croissant jambon-fromage","Croque","Savoury danish","Puff pinwheels"],"vary":["Smoked cheese","Mustard and herb","Kimchi mornay","Velouté with stock"],"eq":["Saucepan","Whisk"],"at":"20 min","tt":"1 h to cool"},{"id":"dux","sv":1,"n":"Cooked savoury fillings","f":"sv_base","d":2,"o":"yes","what":"Fillings sealed inside pastry: mushroom duxelles, minced or chopped meat (kibinai), spinach and feta, potato.","how":"Moisture is the enemy: cook water out and cool completely before filling. Raw meat fillings cook inside the pastry, so size and oven temperature decide safety.","ratio":[["Duxelles","Mushrooms 1000 (cooks down to ~400) : shallot 120 : butter 40 : salt ~0.8%"],["Kibinai","Lamb/mutton 1 : onion 0.3 : salt 1–1.2% : pepper, splash of ice water"],["Spinach & feta","Squeezed spinach 1 : feta 0.7 : soft cheese 0.5 : egg 0.15"]],"temps":[["Meat core","≥ 72–75 °C"],["Bake","190–200 °C"]],"steps":["Cook vegetables until dry; season well.","Cool fillings completely before using.","For raw meat fillings, chop or mince, season and keep cold until filling.","Seal, vent and bake until the core is safe."],"oven":"Yes.","r":"Max 2 h","fr":"2–3 days","fz":"Yes","fails":[["Soggy bottom","Filling too wet or warm."],["Dry meat filling","Leaner meat; add fat or ice water."],["Bursts","Vent the top."]],"uses":["Kibinai and hand pies","Pithivier","Burekas and empanadas","Savoury croissants"],"vary":["Mushroom and varškė","Cabbage and sauerkraut","Chicken and mushroom","Smoked fish"],"eq":["Wide pan","Knife or mincer","Probe thermometer"],"at":"30 min","tt":"1–2 h"},{"id":"chcream","sv":1,"n":"Cheese creams","f":"sv_dairy","d":1,"o":"partial","what":"Soft cheese whipped or seasoned: whipped feta, labneh, herbed varškė, goat's cheese and blue cheese creams.","how":"Fat and protein whip to hold air, salt and acid season, and draining whey (labneh) thickens.","ratio":[["Whipped feta","Feta 1 : cream cheese or yogurt 0.5–0.8 : olive oil 0.1"],["Labneh","Yogurt + 0.8–1% salt, strained 12–48 h (loses 40–50%)"],["Herbed varškė","Varškė 1 : sour cream 0.3 : herbs 0.08 : salt ~1%"]],"temps":[["Serve","cool, not fridge-cold, for flavor"]],"steps":["Blend or whip the cheese with the softer dairy until smooth.","Season with salt, acid, herbs or honey.","Chill; pipe or spoon on."],"oven":"Drained, firmer versions (varškė with egg) bake inside pastry. Whipped creams go on after baking.","r":"1–2 h","fr":"3–5 days (labneh in oil 1–2 weeks)","fz":"No","fails":[["Grainy","Blend longer with a splash of liquid."],["Runny","Strain longer, or less liquid."],["Too salty","Soak feta in water, add more cream cheese."]],"uses":["Gougères","Savoury danish topping","Focaccia","Tartlets"],"vary":["Whipped feta, honey and thyme","Labneh with za'atar","Goat's cheese and honey","Blue cheese and mascarpone"],"eq":["Food processor or mixer","Cloth for straining"],"at":"10 min","tt":"10 min (labneh 24 h)"},{"id":"dip","sv":1,"n":"Legume dips","f":"sv_dip","d":1,"o":"partial","what":"Purées of cooked chickpeas, beans or peas: hummus, beet hummus, white bean, pea and herb.","how":"Legumes cooked until they collapse (a pinch of baking soda helps) blend into a smooth base; tahini or oil plus ice water whips it into a light emulsion.","ratio":[["Hummus","Cooked chickpeas 1 : tahini 0.4–0.5 : lemon 0.15 : ice water 0.15–0.25 : salt ~1%"],["Bean dip","Cooked beans 1 : olive oil 0.15 : lemon 0.06 : water as needed"],["Coloured versions","Replace up to 40% of the legumes with roasted beet, peas or squash"]],"temps":[["Legumes","simmer until falling apart"],["Blend","warm"]],"steps":["Cook the legumes very soft; drain, keep some cooking water.","Blend acid, garlic and salt first; rest 10 min.","Add tahini or oil; blend while streaming in ice water.","Add the warm legumes; blend 3–4 min until very smooth. Season."],"oven":"A thin layer can bake under toppings but dries. Best spread after baking.","r":"2 h","fr":"3–4 days","fz":"Yes","fails":[["Grainy","Cook longer with soda; blend warm, longer."],["Heavy","More ice water."],["Bland","Salt and lemon, then taste again after 30 min."]],"uses":["Sabich danish","Flatbreads","Tartlets","Savoury choux"],"vary":["Beet hummus","Pea and mint","White bean and rosemary","Black lentil (beluga)"],"eq":["Food processor or blender"],"at":"20 min","tt":"1–2 h"},{"id":"dipveg","sv":1,"n":"Vegetable & nut dips","f":"sv_dip","d":1,"o":"partial","what":"Roasted vegetables blended with nuts, tahini or bread: baba ghanoush, muhammara, romesco.","how":"Charring and roasting concentrate flavor and remove water; nuts and bread give body and hold the texture.","ratio":[["Baba ghanoush","Roasted eggplant flesh 1 : tahini 0.25 : lemon 0.08"],["Muhammara","Roasted peppers 1 : walnuts 0.5 : crumbs 0.15 : pomegranate molasses 0.1 : oil 0.15"],["Romesco","Peppers + tomato 1 : nuts 0.25 : bread 0.08 : vinegar 0.06 : oil 0.2"]],"temps":[["Roast","220 °C or open flame"]],"steps":["Char or roast the vegetables until collapsed; peel.","Drain the flesh well.","Pulse with nuts, bread or tahini, acid and spice.","Stream in oil; season. Keep some texture."],"oven":"Best after baking. Muhammara and romesco can bake as a thin base under cheese.","r":"2 h","fr":"3–4 days","fz":"Muhammara and romesco: yes","fails":[["Watery","Drain the roasted flesh."],["Bitter","Peel off burnt skin; fresher nuts."]],"uses":["Tartlets","Flatbreads","Gougères","Savoury danish"],"vary":["Smoked eggplant and yogurt","Zucchini and tahini","Carrot and harissa"],"eq":["Grill or oven","Food processor"],"at":"30 min","tt":"1 h"},{"id":"cond","sv":1,"n":"Savoury jams & confits","f":"sv_cond","d":1,"o":"yes","what":"Slow-reduced sweet-savoury preserves: onion confit, tomato jam, fig and port, bacon jam.","how":"Long cooking caramelises sugars and evaporates water; sugar and acid make them stable in the oven and the fridge.","ratio":[["Onion confit","Onions 1000 : fat 60 : sugar 60–100 : vinegar/wine 150–200 : salt ~0.8%"],["Tomato jam","Tomatoes 1000 : sugar 250–350 : vinegar 60 : spices"],["Fruit + savory","Fruit 1 : sugar 0.2–0.3 : wine/vinegar 0.3–0.5 : pepper, herbs"]],"temps":[["Reduce","until a spoon drawn through leaves a trail"]],"steps":["Cook the base slowly until soft and golden.","Add sugar, acid and aromatics.","Reduce until jammy.","Cool and jar."],"oven":"Yes.","r":"Hours","fr":"2–3 weeks (bacon jam 1–2 weeks)","fz":"Yes","fails":[["Burnt","Lower heat; splash of water."],["Too sweet","More acid and salt."],["Runny","Reduce further; it thickens as it cools."]],"uses":["Galettes and pithivier","Cheese tartlets","Gougères","Sausage rolls"],"vary":["Red onion and balsamic","Fig and port","Bacon jam","Tomato and chili"],"eq":["Wide heavy pan"],"at":"20 min","tt":"1–2 h"},{"id":"chut","sv":1,"n":"Chutneys & pickle sauces","f":"sv_cond","d":1,"o":"yes","what":"Chunky spiced fruit-and-vinegar preserves (rhubarb, plum, apple) and pickle sauces like amba.","how":"Vinegar and sugar preserve; whole spices bloomed in oil or simmered in give the character. Chutney keeps texture; pickle sauces are often blended.","ratio":[["Chutney","Fruit 1 : onion 0.25 : sugar 0.3–0.4 : vinegar 0.25–0.3 : spices, salt ~0.8%"],["Quick amba","Firm mango 500 : salt 15 : vinegar 80 : water 150 : turmeric, fenugreek, mustard seed, chili"]],"temps":[["Simmer","until thick and glossy, 30–60 min"]],"steps":["Bloom whole spices in a little oil (or tie in muslin).","Add fruit, onion, sugar and vinegar.","Simmer until thick, stirring more toward the end.","Jar hot; rest a few days for best flavor."],"oven":"Yes.","r":"Hours","fr":"4–6 weeks","fz":"Yes","fails":[["Too sharp","Rest it; vinegar mellows in days."],["Burnt bottom","Lower heat, stir."],["Bitter amba","Too much fenugreek."]],"uses":["Cheese pastries","Sabich","Sausage rolls","Ploughman's-style tartlets"],"vary":["Rhubarb and ginger","Plum and chili","Apple and mustard seed","Mango (amba)"],"eq":["Heavy pan","Jars"],"at":"20 min","tt":"1 h"},{"id":"sauce","sv":1,"n":"Emulsions","f":"sv_sauce","d":2,"o":"no","what":"Cold sauces where oil is held in tiny droplets: toum, aioli, mayonnaise, tahini sauce and green tahini.","how":"Garlic, egg yolk or tahini act as emulsifiers. Oil must go in slowly at first; water or acid keeps the emulsion loose.","ratio":[["Toum","Garlic 1 : oil 4 : lemon 0.5 : ice water 0.5 : salt"],["Aioli / mayo","Yolk 1 : oil 8–10 : lemon or vinegar 0.5–0.8 : mustard"],["Tahini sauce","Tahini 1 : lemon 0.4 : ice water 0.6–1"]],"temps":[["Ingredients","cool room temp"],["Store","cold"]],"steps":["Blend the emulsifier base (garlic + salt + lemon, or yolk + mustard).","Add oil drop by drop until it thickens, then in a thin stream.","Loosen with ice water or acid as it stiffens.","Season; chill."],"oven":"No; finish after baking.","r":"Max 2 h","fr":"Aioli 2–3 days · toum about 1 week · tahini sauce 5 days","fz":"No","fails":[["Splits","Start a fresh base and slowly blend the broken sauce into it."],["Tahini seizes","Keep adding water; it loosens."],["Raw yolk","For sale, use pasteurised yolks."]],"uses":["Sabich","Flatbreads","Savoury croissants","Kibinai side"],"vary":["Green tahini","Saffron aioli","Smoked garlic toum","Miso mayo"],"eq":["Blender or food processor","Whisk"],"at":"15 min","tt":"20 min"},{"id":"herb","sv":1,"n":"Herb sauces","f":"sv_sauce","d":1,"o":"no","what":"Chopped or blended herbs in oil with acid and aromatics: zhug, chermoula, salsa verde, chimichurri, pesto.","how":"These are suspensions, not emulsions. Bright color depends on acid added late, and on blending cold and briefly.","ratio":[["Base","Herbs 1 : oil 0.8–1.5 : acid 0.1–0.2 : garlic 0.05–0.1 : salt ~1%"],["Pesto","Herbs 1 : nuts/seeds 0.4 : hard cheese 0.4 : oil 1.2"]],"temps":[["Blend","cold, short bursts"]],"steps":["Chop or pulse herbs with garlic, chili and spices.","Add oil.","Add acid just before using, to keep the green.","Season and rest 10 min."],"oven":"After baking. Pesto can go under cheese but darkens.","r":"2 h","fr":"About 1 week","fz":"Yes (ice-cube portions)","fails":[["Browns","Acid too early, or blended warm. Blanch basil 5 s."],["Bitter","Over-blended oil; pulse."]],"uses":["Flatbreads and focaccia","Sabich","Savoury danish","Quiche topping"],"vary":["Wild garlic","Dill and horseradish","Chimichurri","Lovage salsa verde"],"eq":["Knife or food processor"],"at":"15 min","tt":"15 min"},{"id":"pick","sv":1,"n":"Quick pickles","f":"sv_acid","d":1,"o":"no","what":"Vegetables in a hot or warm vinegar brine, kept in the fridge: pickled onions, dill cucumbers, chilies, beets, mustard seeds.","how":"Acid (and some salt and sugar) penetrates the vegetables within hours. Use vinegar of at least 5% acidity; the brine is usually cut 1:1 with water.","ratio":[["Standard brine","Vinegar 100 : water 100 : sugar 20–50 : salt 8–10"],["Sweet-sour","Vinegar 100 : water 50 : sugar 60–80 : salt 8"],["Brine volume","About 1 : 1 with vegetables by weight"]],"temps":[["Brine","hot for firm veg (beets, carrots), warm for onions and cucumbers"],["Ready","1 h (onions) to 24 h (cucumbers)"]],"steps":["Cut vegetables evenly.","Pack into clean jars with aromatics.","Heat brine until sugar and salt dissolve; pour over.","Cool, lid and chill. Most are best from the next day."],"oven":"Toppings after baking.","r":"Hours","fr":"2–4 weeks","fz":"No","fails":[["Soft","Brine too hot for delicate vegetables; cut thicker."],["Too sharp","Dilute brine, more sugar."],["Cloudy","Table salt with anti-caking agent; use pure salt."]],"uses":["Sabich and flatbreads","Smoked fish tartlets","Focaccia","Sausage rolls"],"vary":["Sumac red onion","Pickled shallot rings","Pickled rhubarb","Pickled pumpkin"],"eq":["Jars","Saucepan"],"at":"15 min","tt":"1 h–1 day"},{"id":"giard","sv":1,"n":"Giardiniera & mixed pickles","f":"sv_acid","d":2,"o":"no","what":"Mixed crunchy vegetables, salt-brined overnight and then pickled in vinegar (Italian) or vinegar plus oil (Chicago hot giardiniera).","how":"The overnight salt brine draws out water so the vegetables stay crunchy. The vinegar step acidifies them, which is what makes the oil version safe in the fridge.","ratio":[["Salt brine","Water 1000 : salt 50–60, overnight"],["Italian pickle","Vinegar 2 : water 1 : sugar 0.25 : salt ~2%"],["Chicago style","Brined veg 1 : vinegar 0.3–0.4 : oil to cover, plus oregano and chili"]],"temps":[["Brine","cold, 8–12 h in the fridge"],["Pickle liquid","boiled, poured hot (Italian)"]],"steps":["Cut vegetables into bite-size pieces (or chop small for a relish).","Soak overnight in the salt brine, refrigerated; drain and rinse.","Italian: pack and pour hot pickle liquid over. Chicago: toss with vinegar and spices, then cover with oil.","Rest 2–3 days in the fridge before using."],"oven":"Topping or sandwich layer after baking. Chopped giardiniera also goes on focaccia before baking.","r":"Hours","fr":"3–4 weeks","fz":"No","fails":[["Soggy","Skipped the salt brine, or cut too small."],["Oil version tastes flat","More vinegar and chili; let it rest."],["Safety","Never put un-acidified raw vegetables or garlic into oil; keep oil pickles refrigerated."]],"uses":["Focaccia and sandwiches","Mortadella or cheese pastries","Antipasti boards","Pizza and flatbreads"],"vary":["Hot (serrano) or mild","Fennel and orange","Cauliflower-heavy","Finely chopped relish"],"eq":["Large bowl","Jars","Knife"],"at":"40 min","tt":"2–3 days"},{"id":"ferm","sv":1,"n":"Lacto-ferments","f":"sv_acid","d":2,"o":"partial","what":"Vegetables fermented by lactic bacteria with salt: sauerkraut, rauginti agurkai (fermented cucumbers), kimchi, fermented chili sauce.","how":"Salt pulls out water and suppresses unwanted microbes; lactic acid bacteria already on the vegetables turn sugars into acid. Keeping everything under the brine keeps it anaerobic.","ratio":[["Dry salt (shredded veg)","2–2.5% salt of vegetable weight"],["Brine (whole veg)","3–5% salt of water weight"],["Chili mash","2.5–3% of chili weight"],["Kimchi","Salt cabbage, rinse, then ~2% salt in the finished mix"]],"temps":[["Ferment","18–22 °C"],["Then","fridge, to slow it"]],"steps":["Weigh vegetables (and water) and calculate the salt exactly.","Shred and massage with salt until brine forms, or pour brine over whole vegetables.","Pack tightly; weight everything below the brine; loosely cover.","Taste from day 3; move to the fridge when sour enough (days to weeks)."],"oven":"Sauerkraut and kimchi bake well inside fillings (kibinai, croissants with cheese). Fresh ferments as toppings go on after.","r":"During fermentation only","fr":"Months","fz":"Not needed","fails":[["Mould on top","Something poked above the brine; remove generously, re-weight."],["Soft cucumbers","Too warm or too little tannin; add horseradish, currant or oak leaves."],["Slimy","Too warm or too little salt; usually passes in a few days, otherwise discard."]],"uses":["Kimchi or sauerkraut croissants","Kibinai and pirogi fillings","Topping for savoury danish","Hot sauce for flatbreads"],"vary":["Caraway or apple sauerkraut","Red cabbage kraut","Curtido","Fermented carrots with dill"],"eq":["Scale (0.1 g)","Jars or crock","Weights"],"at":"30 min","tt":"3 days–4 weeks"},{"id":"salt","sv":1,"n":"Salt cures","f":"sv_acid","d":1,"o":"partial","what":"Salt (and sugar) used to preserve and concentrate: preserved lemons and cured egg yolks.","how":"Salt draws out moisture and firms the texture. Preserved lemons soften and turn floral over weeks; egg yolks set firm enough to grate.","ratio":[["Preserved lemons","Lemons 1000 : salt 120–150 + extra juice to cover"],["Cured egg yolks","Salt 1 : sugar 1 cure, buried 5–7 days"]],"temps":[["Lemons","room temp 3–4 weeks"],["Yolks","fridge 5–7 days, then dry at 60–65 °C"]],"steps":["Lemons: quarter almost through, pack with salt, press in a jar, top with juice.","Yolks: bury yolks in the cure, cover, refrigerate; rinse and dry.","Use preserved lemon rind finely chopped; grate cured yolks like cheese."],"oven":"Preserved lemon bakes into fillings and doughs. Cured yolk is grated on after baking.","r":"Lemons: months once cured","fr":"Lemons 6–12 months · yolks 1 month","fz":"Not needed","fails":[["Lemons go mouldy","Not covered by juice."],["Yolks still soft","Cure longer or dry longer."]],"uses":["Chermoula and dressings","Savoury danish and tartlets","Focaccia","Pasta-style savoury pastries"],"vary":["Preserved Meyer lemons","Spiced lemons (bay, chili)","Smoked cured yolks"],"eq":["Jars","Small tray"],"at":"20 min","tt":"1–4 weeks"},{"id":"svcr","sv":1,"n":"Spice mixes & dukkah","f":"sv_tex","d":1,"o":"yes","what":"Dry blends of toasted nuts, seeds, herbs and spices: dukkah, za'atar, everything seasoning.","how":"Toasting builds flavor; dry and fat-free (or nearly) means they keep crunch for weeks.","ratio":[["Dukkah","Hazelnuts 100 : sesame 50 : coriander 20 : cumin 10 : salt 6 : pepper 2"],["Za'atar","Thyme 4 : oregano 2 : sumac 3 : sesame 1.5 : salt 0.5"],["Everything","Sesame 3 : poppy 1 : garlic flakes 0.75 : onion flakes 1 : salt 0.75"]],"temps":[["Toast nuts","160 °C"],["Toast spices","dry pan until fragrant"]],"steps":["Toast nuts and seeds separately; toast whole spices.","Cool; pound or pulse coarsely.","Season; store airtight."],"oven":"Seeds and za'atar bake onto dough; dukkah goes on after for crunch.","r":"2–4 weeks, airtight","fr":"Not needed","fz":"Nut mixes yes","fails":[["Bitter","Spices over-toasted."],["Stale","Small batches; airtight."]],"uses":["Focaccia and flatbreads","Labneh and dips","Savoury danish","Gougères"],"vary":["Hemp and caraway","Black sesame dukkah","Nigella and fennel"],"eq":["Pan or oven","Mortar or grinder"],"at":"15 min","tt":"30 min"},{"id":"crispy","sv":1,"n":"Crispy & fried toppings","f":"sv_tex","d":1,"o":"no","what":"Fried or roasted crunch added at the end: crispy shallots and garlic, chili crisp, crispy chickpeas.","how":"Slow frying in oil drives out water evenly so pieces go crisp and golden without burning; they keep colouring after they leave the oil.","ratio":[["Shallots / garlic","2 mm slices, cold oil start, 120–140 °C"],["Chili crisp","Oil 1 : fried aromatics 0.4 : chili flakes 0.12 : salt, sugar"],["Chickpeas","Cooked, dried chickpeas tossed with 5% oil, 200 °C"]],"temps":[["Fry","120–140 °C"],["Roast chickpeas","200 °C, 30–40 min"]],"steps":["Slice evenly; dry well.","Start in cold oil and bring up gently, stirring.","Lift out just before they reach the colour you want.","Drain on paper; salt; store airtight once cold."],"oven":"No; they'd burn or soften. Add after baking.","r":"1–2 weeks, airtight (chili crisp: months)","fr":"Chili crisp: months","fz":"No","fails":[["Uneven or bitter","Uneven slices or oil too hot."],["Soft","Too thick, or stored before fully cold."]],"uses":["Savoury danish and tartlets","Hummus and dips","Focaccia","Gougères"],"vary":["Crispy garlic","Crispy capers","Fried sage","Seed crisp"],"eq":["Deep pan","Slotted spoon","Thermometer"],"at":"20 min","tt":"30 min"},{"id":"fruitbasic","n":"Simple fruit & nut components","f":"fruit","d":1,"o":"partial","what":"Quick building blocks that need little technique: macerated berries, roasted or poached fruit, caramelized apples, candied citrus peel, toasted and candied nuts, oven-dried fruit crisps.","how":"Sugar draws juice out of fruit by osmosis (maceration). Heat softens pectin and concentrates flavor (roasting, poaching). In candying, a heavy syrup slowly replaces the water in the peel, so it keeps for months. Toasting browns the oils and sugars in nuts for deeper flavor.","ratio":[["Macerated berries","Fruit 1000 : sugar 80–150 : lemon 10–20, rest 20–60 min"],["Poaching syrup","Water 1000 : sugar 250–400 : aromatics (part wine, mead or tea)"],["Candied peel","Blanched peel 1 : sugar 1.5 : water 1, simmer until translucent"],["Candied nuts","Nuts 1000 : sugar 300 : water 100"]],"temps":[["Roasting fruit","180–200 °C, 15–30 min"],["Poaching","barely simmering, 80–90 °C"],["Toasting nuts","160–170 °C, 5–15 min"],["Drying","80–100 °C, 1.5–3 h"]],"steps":["Use ripe but firm fruit for roasting and poaching, and very ripe fruit for macerating.","Balance with sugar and acid; taste again after cooking.","Cook fruit until just tender. It keeps softening as it cools.","For pastry, drain the juices and reduce them into a glaze so the filling stays dry.","Toast nuts on a tray and cool them fully before chopping or candying."],"oven":"Partly. Roasted and caramelized fruit, candied peel and nuts bake well. Macerated berries and poached fruit are better added after baking, or drained and thickened first.","r":"Fresh fruit max 2 h; candied peel and nuts keep at room temp","fr":"Macerated 1–2 days · poached 5 days · candied peel for months · candied nuts 2–3 weeks airtight","fz":"Roasted and poached fruit yes; nuts yes","fails":[["Fruit turns to mush","Too ripe or overcooked. Cut larger pieces and cook less."],["Sticky candied nuts","Sugar undercooked or stored in humidity. Dry them in a low oven and store airtight."],["Bitter peel","Blanch two or three times in fresh water first."],["Burnt nuts","Lower the oven. Nuts go from golden to burnt in about a minute."]],"uses":["Danish and tartlet toppings","Inside buns and scrolls","Garnish for choux and entremets","Folded into creams and cheesecake","Crunch on cakes"],"vary":["Strawberries with black pepper","Roasted plums with star anise","Pears poached in mead","Candied orange or yuzu peel","Maple-candied pecans","Apple crisps"],"eq":["Sheet trays","Heavy pan","Thermometer (optional)"],"at":"10–20 min","tt":"20 min–3 h"},{"id":"roastveg","sv":1,"n":"Caramelized & roasted vegetables","f":"sv_base","d":1,"o":"yes","what":"Simple building blocks made by slowly browning or roasting vegetables: caramelized onions, roasted garlic, roasted peppers, slow-roasted tomatoes, sautéed mushrooms, melted leeks, braised red cabbage, squash purée, garlicky greens and potato.","how":"Heat drives off water, which concentrates flavor, while natural sugars caramelize and proteins brown (the Maillard reaction). Low and slow cooking gives sweetness and jamminess; high heat gives char and roasted notes. Removing water also matters for pastry: wet fillings make soggy bottoms, so cook until dry or drain well.","ratio":[["Caramelized onions","Onions 1000 : fat 40–60 : salt ~0.8%, yields 250–350 g"],["Roasted vegetables","Veg 1000 : oil 30–50 : salt 1–1.2%, at 200–220 °C"],["Slow-roasted tomatoes","Tomatoes 1000 : oil 40 : salt 0.8% : sugar 0.8%, 2–2.5 h at 130 °C"],["Weight loss","Expect 40–75%. Weigh after cooking before scaling a filling."]],"temps":[["Slow caramelizing","medium-low, 45–75 min"],["Roasting","200–220 °C"],["Slow roasting / confit","120–150 °C"]],"steps":["Cut evenly so everything cooks at the same rate.","Salt onions and mushrooms early to draw out water; salt roasted veg late if you want crisp edges.","Use a wide pan, or spread in a single layer on trays. Crowding steams instead of browning.","Deglaze the brown bits with a splash of water, wine or vinegar and stir them back in.","Cool on a tray, drain or squeeze if wet, and season again once cold."],"oven":"Yes, once cooked down and drained. Very wet vegetables (tomatoes, courgette, spinach) must be dried or squeezed first.","r":"Max 2 h (cool fast, then refrigerate)","fr":"4–5 days","fz":"Yes, most freeze well in flat bags","fails":[["Onions burn before softening","Lower the heat, add a splash of water, and use a lid for the first 15 min."],["Soggy pastry","Cook longer or drain, or add a binder (cheese, béchamel, breadcrumbs)."],["Bland","Season again when cold, finishing with acid (vinegar, lemon) and salt."],["Steamed, not browned","Pan or tray too crowded. Spread out and raise the heat."]],"uses":["Galettes and tartlets","Focaccia toppings","Savoury danish and scrolls","Sausage rolls and pies","Mixed into cheese creams and dips"],"vary":["Onion and thyme","Roasted garlic butter","Peppers with smoked paprika","Mushrooms with sherry","Leeks with mustard","Red cabbage with apple and caraway"],"eq":["Wide heavy pan","Sheet trays","Baking paper"],"at":"15–20 min","tt":"45 min–3 h"},{"id":"braise","sv":1,"n":"Braised & pulled meats","f":"sv_base","d":2,"o":"yes","what":"Tough, slow-cooked cuts that pull apart and are bound with their own reduced juices: pulled pork, braised short rib, shredded chicken thigh, lamb shoulder.","how":"Long, gentle, moist heat turns the collagen in tough cuts into gelatin over several hours. The gelatin-rich braising liquid, once reduced, binds the shredded meat and sets firm when cold, which makes it easy to portion into pastry.","ratio":[["Braise","Meat 1000 : liquid halfway up the meat : aromatics 200–300 : salt 1.2–1.5%"],["Binding","Shredded meat 1000 : reduced braising liquid 150–250"],["Yield","Bone-in cuts lose ~45–55% (bone and water); boneless ~30–40%"]],"temps":[["Oven braise","150–160 °C, covered, 2.5–4 h"],["Done","fork-tender; pulled pork 90–95 °C internal"],["Reheated in pastry","core ≥ 72 °C"]],"steps":["Season the meat, ideally the day before, and brown it well on all sides.","Brown the aromatics, deglaze, and add liquid to come halfway up the meat.","Cover and braise in a low oven until it pulls apart.","Shred the meat. Skim the fat from the liquid and reduce it to a syrup.","Mix in enough reduced liquid to bind, then chill until set before filling pastry."],"oven":"Yes. Fill pastry with cold, set filling and bake until the core reaches at least 72 °C.","r":"Max 2 h","fr":"3–4 days","fz":"Yes, up to 3 months","fails":[["Tough","Not cooked long enough; keep going."],["Dry and stringy","Too lean a cut, or it boiled hard. Use fattier cuts and keep it at a bare simmer."],["Leaks from the pastry","Too much liquid. Reduce more and chill fully before filling."],["Greasy","Chill the liquid and lift off the fat."]],"uses":["Pies and hand pies","Sausage rolls and empanadas","Filled buns (bao-style, brioche)","Savoury danish"],"vary":["Beer-braised short rib","Pulled pork with apple and mustard","Chicken thigh and mushroom","Lamb shoulder with cumin and apricot"],"eq":["Heavy casserole with lid","Probe thermometer"],"at":"30 min","tt":"3–5 h"}],"REC":[{"id":"b-ang","n":"Vanilla crème anglaise","t":"ang","s":"base","tw":"The reference custard. Base for crémeux and bavarois.","I":[["Whole milk",250],["Cream 35%",250],["Egg yolks",100],["Sugar",100],["Vanilla pod",1,"pcs","split and scraped"]],"M":["Bring milk, cream and vanilla to a simmer; cover and infuse 15 min.","Whisk yolks and sugar just to combine (don't make them foamy).","Pour a third of the hot liquid onto the yolks, whisking, then return everything to the pan.","Cook over medium-low heat, stirring constantly with a spatula, to 82–84 °C.","Strain at once into a cold bowl, remove the pod, blend briefly and chill with film on contact."],"N":["For a crémeux, use it while still hot, straight from the pan."],"L":[],"y":null},{"id":"b-crem","n":"Dark chocolate crémeux","t":"cre","s":"base","tw":"Anglaise poured over dark chocolate. Sliceable when chilled or frozen.","I":[["Whole milk",125],["Cream 35%",125],["Egg yolks",50],["Sugar",25],["Dark chocolate 66–70%",120,"g","chopped"],["Gelatin powder 200 bloom",1,"g","optional, for clean-cut inserts"],["Water (for gelatin)",5]],"M":["Bloom the gelatin in the water if using.","Make an anglaise with milk, cream, yolks and sugar, cooked to 82–84 °C.","Pour it over the chocolate and gelatin in three additions, stirring from the centre to build an emulsion.","Blend with a stick blender (head fully submerged) until glossy.","Pour into moulds or a baked shell; chill at least 4 h, or freeze for inserts."],"N":["Milk chocolate: raise to about 200 g and keep the gelatin. White: about 250 g plus 2 g gelatin."],"L":[],"y":null},{"id":"b-curd","n":"Classic lemon curd","t":"curd","s":"base","tw":"Cooked curd with the butter in the pan. Denser than lemon cream.","I":[["Lemon juice",150],["Lemon zest",2,"pcs","lemons, finely grated"],["Sugar",150],["Whole eggs",150,"g","about 3"],["Egg yolks",40,"g","about 2"],["Butter",120,"g","cubed"]],"M":["Rub the zest into the sugar.","Whisk in eggs, yolks and juice in a heatproof bowl or heavy pan.","Cook over a bain-marie (or low heat), whisking, to 80–82 °C until thick.","Off the heat, whisk in the butter; strain.","Film on contact and chill at least 4 h."],"N":["Use stainless steel or glass; aluminium gives a metallic taste."],"L":[],"y":null},{"id":"b-smbc","n":"Swiss meringue buttercream","t":"bc","s":"base","tw":"The stable, silky all-rounder for cakes and macarons.","I":[["Egg whites",100],["Sugar",180],["Butter, soft (18–20 °C)",300],["Vanilla extract",3],["Salt",1]],"M":["Whisk whites and sugar over a bain-marie to 70 °C, until the sugar dissolves.","Whip on high until stiff, glossy and cooled to about 25 °C.","Add the butter in pieces on medium speed.","If it looks curdled, keep beating; if soupy, chill 10 min and beat again.","Add vanilla and salt; flavor as needed."],"N":["Flavor with 80–120 g praline paste, 60–80 g caramel, or 15–20 g freeze-dried fruit powder."],"L":[],"y":null},{"id":"b-gan","n":"Dark tart ganache (1:1)","t":"setgan","s":"base","tw":"The classic soft-set ganache for tarts and cake fillings.","I":[["Cream 35%",250],["Glucose or honey",25],["Dark chocolate 64%",250,"g","chopped"],["Butter, soft",40]],"M":["Bring cream and glucose to a simmer.","Pour over the chocolate in thirds, stirring from the centre each time.","Blend with a stick blender without adding air.","At about 35 °C, blend in the butter.","Pour into a baked shell at about 30 °C; leave to set at room temp, then chill."],"N":["For truffles or a firm bonbon ganache, double the chocolate (2:1)."],"L":[],"y":null},{"id":"b-chant","n":"Stabilised Chantilly","t":"chant","s":"base","tw":"Whipped cream that holds for a day thanks to mascarpone.","I":[["Cream 35%, cold",500],["Mascarpone, cold",100],["Icing sugar",45],["Vanilla pod",1,"pcs","seeds only"]],"M":["Chill the bowl and whisk.","Loosen the mascarpone with a little of the cream.","Add the rest of the cream, sugar and vanilla seeds.","Whip on medium to soft or firm peaks, depending on use. Stop before it looks grainy."],"N":["Without mascarpone it's a plain Chantilly: use the same day."],"L":[],"y":null},{"id":"b-ital","n":"Italian meringue","t":"mer","s":"base","tw":"Hot-syrup meringue: stable and heated, safe to use in mousses.","I":[["Sugar",200],["Water",60],["Egg whites",100]],"M":["Cook sugar and water to 118–121 °C.","When the syrup reaches about 110 °C, start whipping the whites on medium.","Pour the syrup in a thin stream down the side of the bowl, whipping on high.","Keep whipping until the meringue is just warm and glossy."],"N":["Use in mousses, buttercream or to top tarts (torch it)."],"L":[],"y":290},{"id":"b-streu","n":"Almond streusel","t":"streu","s":"base","tw":"Equal-parts crumble for buns, tarts and garnish.","I":[["Butter, cold, cubed",100],["Demerara or caster sugar",100],["Plain flour",100],["Ground almonds",100],["Salt",1]],"M":["Rub the cold butter into the dry ingredients until it forms clumps.","Chill or freeze the crumbs.","Scatter on buns or tarts before baking, or bake alone at 160–170 °C for 15–20 min."],"N":["Swap half the flour for rye or buckwheat flour for a Baltic version."],"L":[],"y":null},{"id":"b-candy","n":"Candied orange peel","t":"candy","s":"base","tw":"Slow-candied over three days: translucent, chewy, bitter-sweet. Dice it for buns or dip it in chocolate.","I":[["Orange peel",500,"g","from about 6 oranges, blanched weight"],["Water",500],["Sugar",500,"g","to start"],["Glucose",100],["Sugar",400,"g","added over 2 days"],["Caster sugar",100,"g","for rolling (optional)"]],"M":["Cut the peel into quarters or 1 cm strips, leaving a thin layer of pith.","Blanch three times, starting in cold water and bringing to a boil each time; drain.","Bring water, 500 g sugar and glucose to a boil, add the peel and keep it at a bare simmer for 30 min. Leave to soak overnight.","Next day, add 200 g sugar, simmer 20 min and soak overnight again. Repeat once more.","The peel should be translucent. Drain, dry on a rack overnight and roll in sugar, or keep it in its syrup in the fridge."],"N":["Keep the syrup: it makes a very good glaze for buns and babka.","For orangettes, dip dried strips in tempered dark chocolate."],"L":[],"y":900},{"id":"b-noug","n":"Honey & pistachio nougat","t":"noug","s":"base","tw":"Soft Montélimar-style nougat, chewy and nutty. Cut into bars, or chop into mousses and cookies.","I":[["Honey",150],["Sugar",300],["Glucose",75],["Water",90],["Egg whites",50],["Sugar",15,"g","for the whites"],["Pistachios, toasted",200],["Almonds, toasted",200],["Cocoa butter",20,"g","melted, optional"],["Wafer paper",2,"pcs","sheets"]],"M":["Keep the toasted nuts warm in a 100 °C oven. Line a 20 × 20 cm frame with wafer paper.","Heat the honey to 120 °C. Meanwhile whip the whites with 15 g sugar to soft peaks, then pour in the honey with the mixer running.","Cook sugar, glucose and water to 150 °C and stream it into the whites. Whip about 10 min, until thick and only warm.","Switch to the paddle, add the cocoa butter, then the warm nuts.","Press into the frame, cover with wafer paper, weigh down and leave 12 h. Cut with an oiled knife."],"N":["Swap in buckwheat honey and walnuts for a darker, Nordic version.","Cook the syrup to 155 °C for a firmer, longer-keeping nougat."],"L":[],"y":950},{"id":"b-nougatine","n":"Cocoa nib nougatine","t":"noug","s":"base","tw":"Glassy caramel sheet with cocoa nibs, rolled thin. Snaps into shards for tarts and choux.","I":[["Sugar",250],["Glucose",150],["Butter",30],["Cocoa nibs",80],["Flaked almonds, toasted",40]],"M":["Warm the nibs and almonds in a low oven.","Cook sugar and glucose (no water) over medium heat to a golden caramel, about 170 °C.","Stir in the butter, then the warm nibs and almonds.","Pour onto a silicone mat, cover with a second mat and roll thin.","Cut while warm, or let it cool and snap into shards. Soften at 160 °C to reshape."],"N":["Store airtight with a silica gel sachet: it goes tacky in humid air."],"L":[],"y":500},{"id":"b-brit","n":"Nordic seed brittle","t":"brit","s":"base","tw":"Sunflower, pumpkin and sesame in a light, bubbly caramel. Snap it, chop it or grind it.","I":[["Sugar",200],["Glucose",100],["Water",60],["Butter",30],["Sunflower seeds",80],["Pumpkin seeds",80],["Sesame seeds",40],["Flaky salt",3],["Baking soda",2]],"M":["Toast the seeds lightly and keep them warm. Line a tray with a silicone mat.","Cook sugar, glucose and water to 150 °C.","Add the seeds and butter and stir over the heat until deep golden.","Off the heat, stir in salt and soda (it foams). Pour and spread thin with an oiled spatula.","Cool completely, then snap. Store airtight."],"N":["Add hemp seeds or a spoon of miso with the butter for a savoury edge."],"L":[],"y":580},{"id":"b-tuile","n":"Sesame lace tuile","t":"tuile","s":"base","tw":"Thin, lacy sesame crisps that set as they cool. Shape them over a rolling pin while warm.","I":[["Butter",50],["Sugar",50],["Glucose",30],["Plain flour",15],["Sesame seeds",40],["Black sesame seeds",20]],"M":["Melt butter, sugar and glucose together, just to a boil.","Stir in the flour and seeds. Chill at least 1 h.","Roll into hazelnut-sized balls and space them well apart on a mat.","Bake at 170 °C for 8–10 min, until lacy and golden.","Leave 10 s, then lift and shape. Cool and store airtight."],"N":["Replace the sesame with flaked almonds or oats; add orange zest for a florentine."],"L":[],"y":200},{"id":"b-mallow","n":"Buckwheat honey marshmallow","t":"mallow","s":"base","tw":"Bouncy honey marshmallow. Pipe it onto tarts and torch it, or cut squares.","I":[["Gelatin powder 200 bloom",18],["Water (for gelatin)",90],["Sugar",250],["Buckwheat honey",100],["Glucose",50],["Water",80],["Salt",1],["Icing sugar",50,"g","for dusting"],["Cornflour",50,"g","for dusting"]],"M":["Bloom the gelatin in the water in the mixer bowl.","Cook sugar, honey, glucose and water to 117 °C.","Pour onto the gelatin and whip on high for 8–10 min, until thick, white and lukewarm. Add the salt.","Pipe straight onto tarts or cookies, or spread in a lined, dusted frame.","Set at least 4 h. Cut, dust with the icing sugar and cornflour, and torch just before serving."],"N":["Mild honey for a cleaner flavour; buckwheat honey tastes malty and dark."],"L":[],"y":650},{"id":"b-fcrisp","n":"Apple crisps","t":"fcrisp","s":"base","tw":"Paper-thin apple slices dried until glassy. Stand them in creams or crush them into crumbles.","I":[["Apples, firm and tart",2,"pcs"],["Sugar",100],["Water",100],["Lemon juice",10]],"M":["Boil sugar and water, take off the heat and add the lemon juice.","Slice the apples 1–2 mm thin across the core on a mandoline.","Dip each slice in the warm syrup and lay flat on a silicone mat.","Dry at 85 °C for 1.5–2.5 h, turning once, until they lift off easily.","They crisp as they cool. Store airtight with a silica gel sachet."],"N":["Pear and quince work the same way; dust with cinnamon sugar before drying."],"L":[],"y":60},{"id":"b-chdec","n":"Dark chocolate bark","t":"chdec","s":"base","tw":"Tempered dark chocolate with hazelnuts, cocoa nibs and raspberry. For shards on cakes or for the counter.","I":[["Dark chocolate 64–70%",300],["Hazelnuts, toasted",60,"g","roughly chopped"],["Cocoa nibs",15],["Freeze-dried raspberries",10],["Flaky salt",2]],"M":["Temper the chocolate: melt two thirds to 50 °C, stir in the rest finely chopped until it reaches 31–32 °C.","Test a smear on foil: it should set glossy in a few minutes.","Spread 3–4 mm thick on acetate or baking paper.","Scatter the toppings straight away and press in lightly.","Set in a cool room, then 10 min in the fridge. Break into shards."],"N":["For thin cut shapes, spread 1–2 mm thin and cut as soon as it stops being sticky."],"L":[],"y":390},{"id":"p-rasp","n":"Whipped raspberry jelly","t":"gel","s":"pack","tw":"Raspberry purée set with gelatin, whipped to a light foam while it sets.","I":[["Raspberry purée, seedless",400],["Sugar",60],["Lemon juice",15],["Gelatin powder 200 bloom",8],["Water (for gelatin)",40]],"M":["Bloom the gelatin in the water.","Warm about a quarter of the purée with the sugar to 50–60 °C; dissolve the gelatin in it.","Stir into the rest of the purée with the lemon juice.","Cool, stirring now and then, until syrupy (about 20–25 °C).","Whip on high 5–8 min until pale and doubled. Pipe or spread at once and chill 2 h."],"N":["Too warm and it won't foam; too cold and it sets in lumps. Rewarm gently if it goes too far."],"L":[["Raspberry mousse (whipped gelatin method)","Kitchen Confidante","https://kitchenconfidante.com/wprm_print/raspberry-mousse"]],"y":null},{"id":"p-walpral","n":"Walnut praline","t":"pral","s":"pack","tw":"60% nut praline with walnuts toasted lighter than hazelnuts.","I":[["Walnut halves",300],["Sugar",200],["Flaky salt",2]],"M":["Toast walnuts at 150 °C for 10–12 min; keep warm.","Make a dry caramel: melt sugar in small additions to amber (about 175 °C).","Add the warm nuts and stir to coat.","Pour onto a silicone mat and cool completely.","Blitz in a food processor: powder first, then a fluid paste (5–10 min, resting the motor). Add salt."],"N":["Walnuts go rancid faster than hazelnuts; make small batches and keep airtight."],"L":[["How to make praline paste","Full of Plants","https://fullofplants.com/how-to-make-praline-paste/"]],"y":490},{"id":"p-lemtar","n":"Lemon & tarragon cream","t":"curd","s":"pack","tw":"Lemon cream in the Hermé style: butter blended in at 60 °C, tarragon in the juice.","I":[["Lemon juice",180],["Fresh tarragon",6],["Sugar",200],["Lemon zest",3,"pcs","lemons"],["Whole eggs",200,"g","about 4"],["Butter, soft",300]],"M":["Warm the lemon juice, add tarragon, steep 10 min and strain. Cool.","Rub the zest into the sugar; whisk in eggs, then the infused juice.","Cook over a bain-marie, whisking constantly, to 80–82 °C.","Strain into a blender jug and cool to about 60 °C.","Blend in the butter a few pieces at a time, then keep blending 3 min. Film on contact; chill 4 h."],"N":["Whisk to loosen before filling a baked tart shell."],"L":[["Pierre Hermé's lemon cream tart","lovefood","https://www.lovefood.com/recipes/77122/pierre-herme-french-lemon-cream-tart-recipe"]],"y":null},{"id":"p-cartonka","n":"Whipped caramel with tonka","t":"wgan","s":"pack","tw":"Dry caramel deglazed with tonka cream into a whipped ganache.","I":[["Cream 35% (hot part)",130],["Tonka bean",0.5,"pcs","finely grated"],["Sugar (for caramel)",60],["Blond or white chocolate",160],["Gelatin powder 200 bloom",2],["Water (for gelatin)",10],["Cream 35%, cold",260],["Salt",1]],"M":["Heat the hot-part cream with the grated tonka; steep 10 min and reheat.","Bloom the gelatin.","Make a dry caramel to amber; deglaze gradually with the hot tonka cream (it will bubble hard).","Pour over the chocolate and gelatin; blend to an emulsion.","Blend in the cold cream and salt. Film on contact; chill 12 h.","Whip to soft, pipeable peaks."],"N":["Tonka is strong; half a bean is plenty for this batch."],"L":[["Tonka caramel salé éclair (Christophe Bonzon)","Global News","https://globalnews.ca/news/2574459/recipe-tonka-caramel-sale-eclair/amp/"],["Whipped caramel chocolate ganache","IRCA","https://www.ircagroup.com/en/recipes/whipped-caramel-oro-chocolate-ganache"]],"y":null},{"id":"p-cargan","n":"Caramel ganache","t":"setgan","s":"pack","tw":"Caramel built first, then emulsified over milk chocolate. For tarts, bars and bonbons.","I":[["Cream 35%",200],["Invert sugar or honey",20],["Sugar",100],["Glucose",30],["Milk chocolate 35–40%",250],["Salt",2],["Butter, soft",40]],"M":["Heat cream and invert sugar to a simmer.","Cook sugar and glucose to an amber caramel.","Deglaze with the hot cream gradually; bring back to a boil.","Pour over the chocolate and salt; blend to an emulsion.","At about 35 °C, blend in the butter. Pipe or frame at about 30 °C; crystallise overnight."],"N":["For bonbons, use within 2–3 weeks. As a cake filling, keep it in the fridge."],"L":[["Caramel ganache with tonka","Arla Pro","https://www.arlapro.com/en-ar/recipes/filled-chocolates-caramel-ganache-with-tonka"]],"y":630},{"id":"p-bilcard","n":"Bilberry compote with cardamom","t":"comp","s":"pack","tw":"Pectin NH compote; cardamom infused as the berries warm.","I":[["Bilberries (fresh or frozen)",500],["Green cardamom pods",4,"pcs","crushed"],["Sugar",100],["Pectin NH",7],["Lemon juice",15]],"M":["Warm the berries with the crushed cardamom to 45 °C (tie pods in muslin for easy removal).","Mix the pectin into the sugar thoroughly.","Sprinkle in the sugar–pectin, whisking.","Boil 2 min; remove the cardamom.","Off the heat, add lemon juice. Pour into moulds or a tray; set in the fridge."],"N":["For a bake-stable danish filling, raise pectin to about 12 g and sugar to 150 g."],"L":[["Blueberry tartlets (Bernard Besse)","Relais Desserts","https://www.relais-desserts.net/en/?p=19348"]],"y":null},{"id":"p-trop","n":"Tropical compote","t":"comp","s":"pack","tw":"Mango–passion base with diced mango and pre-cooked pineapple.","I":[["Pineapple, diced small",120],["Mango purée",200],["Passion fruit purée",100],["Sugar",70],["Pectin NH",5],["Mango, diced small",120],["Lime zest",1,"pcs","lime"],["Lime juice",10]],"M":["Sauté the pineapple in a dry pan 3 min to soften it and kill its enzymes.","Warm the purées to 45 °C.","Whisk in the sugar mixed with pectin; boil 1–2 min.","Off the heat, fold in mango, pineapple, lime zest and juice.","Pour into insert moulds and freeze, or chill to set."],"N":["Raw pineapple, kiwi and papaya break down gelatin, but pectin sets fine."],"L":[["Mango entremets with mango–passion insert","Gluten Evasion","https://glutenevasion.fr/en/recipe/mango-dessert-on-coconut-dacquoise/"]],"y":null},{"id":"p-masala","n":"Masala namelaka","t":"nam","s":"pack","tw":"Namelaka with milk infused with chai spices and black tea.","I":[["Whole milk (to infuse)",240,"g","top back up to 200 g after straining"],["Black tea leaves",3],["Cinnamon stick",1,"pcs"],["Green cardamom pods",6,"pcs","crushed"],["Fresh ginger, sliced",8],["Cloves",3,"pcs"],["Black peppercorns",4,"pcs"],["Glucose",10],["Gelatin powder 200 bloom",5],["Water (for gelatin)",25],["White chocolate",340],["Cream 35%, cold",390]],"M":["Bring milk and spices to a simmer; add tea, cover and steep 8–10 min. Strain and top up with milk to 200 g.","Reheat with the glucose; add the bloomed gelatin.","Pour over the chocolate in thirds and emulsify.","Blend in the cold cream.","Film on contact; set 12 h. Whisk briefly before piping."],"N":["Don't boil the tea; it turns bitter."],"L":[["Namelaka, Valrhona's method","Time to Cook Online","https://timetocookonline.com/2017/01/30/namelaka/"]],"y":970},{"id":"p-royal","n":"Royaltine","t":"crunch","s":"pack","tw":"Praline, milk chocolate and feuilletine. The classic crunch base.","I":[["Praline paste 50%",200],["Milk chocolate",80],["Feuilletine",120]],"M":["Melt the chocolate and stir in the praline.","Fold in the feuilletine lightly, keeping some flakes.","Spread 3 mm thick in a ring or between baking paper.","Chill 30 min; cut or store."],"N":[],"L":[["Chocolate feuilletine crunch","Sweetly Cakes","https://sweetlycakes.com/en/feuilletine-crunch/"]],"y":null},{"id":"p-mpcrem","n":"Mango & passion fruit crémeux","t":"cre","s":"pack","tw":"Fruit crémeux: purée, eggs, sugar to 82 °C, then butter at 40 °C.","I":[["Mango purée",180],["Passion fruit purée",120],["Sugar",70],["Whole eggs",150,"g","about 3"],["Egg yolks",40],["Gelatin powder 200 bloom",3],["Water (for gelatin)",15],["Butter, soft",120]],"M":["Bloom the gelatin.","Heat the purées with half the sugar.","Whisk eggs and yolks with the rest of the sugar; temper with the hot purée.","Return to the pan and cook, stirring, to 82–84 °C.","Add gelatin; cool to 35–40 °C, then blend in the butter.","Pour into inserts and freeze, or into a baked shell and chill 4 h."],"N":[],"L":[["Apricot–mango entremet (fruit crémeux)","Debic","https://www.debic.com/en/recipes/apricot-mango-entremet"],["Crystelle's mango & passion fruit entremets","The Great British Bake Off","https://thegreatbritishbakeoff.co.uk/recipes/all/crystelle-mango-passion-fruit-entremets/"]],"y":null},{"id":"p-lemgel","n":"Lemon gel","t":"gel","s":"pack","tw":"Agar fluid gel: boiled, set, then blended glossy.","I":[["Water",200],["Lemon juice",200],["Sugar",120],["Agar powder",4],["Lemon zest",1,"pcs","lemon"]],"M":["Mix the agar into the sugar.","Bring water, lemon juice and zest to a simmer; whisk in the sugar–agar.","Boil 1 min, whisking.","Strain into a tray; set completely in the fridge (about 1 h).","Blend until smooth and glossy; pass through a sieve. Fill a squeeze bottle."],"N":["Let air bubbles rise out before use for a shinier gel."],"L":[["The lemon by Cédric Grolet","Pastry Workshop","https://pastry-workshop.com/lemon-shaped-dessert-cedric-grolet/"],["Lemon balm tart with lemon–melissa gel","tasty.lu","https://tasty.lu/en/?p=401091"]],"y":510},{"id":"p-carcrem","n":"Caramel crémeux","t":"cre","s":"pack","tw":"Dry caramel deglazed with cream and milk, set with yolks and gelatin.","I":[["Sugar",100],["Cream 35%",300],["Whole milk",100],["Egg yolks",80],["Gelatin powder 200 bloom",4],["Water (for gelatin)",20],["Butter",40],["Salt",2]],"M":["Bloom the gelatin; warm the cream and milk.","Make a dry caramel to amber.","Deglaze with the hot cream and milk gradually; bring back to a boil to dissolve any lumps.","Temper onto the yolks; cook to 82–84 °C.","Add gelatin, butter and salt; blend. Pour and chill 4 h, or freeze as an insert."],"N":[],"L":[["Caramel crémeux","Matt Adlard","https://mattadlard.com/recipes/caramel-cremeux/"]],"y":null},{"id":"p-caramel","n":"Caramel sauce (wet & dry)","t":"car","s":"pack","tw":"One sauce, two methods: dry for toasty depth, wet for a silky, forgiving cook.","I":[["Sugar",250],["Water",60,"g","wet method only; omit for dry"],["Glucose",40],["Cream 35%, hot",300],["Butter",60],["Salt",4]],"M":["Wet: dissolve sugar, water and glucose, then boil without stirring, washing down crystals. Dry: melt sugar and glucose in small additions, stirring as each melts.","Cook to amber, about 175 °C, and take it off a shade early.","Pour in the hot cream gradually, whisking.","Return to the heat and cook to 104 °C for a thick sauce.","Off the heat, whisk in butter and salt. Cool."],"N":["Cook to about 108 °C for a soft filling that holds a shape, or 118–120 °C for chewy caramels."],"L":[["Making caramel: wet and dry methods","Tasting Table","https://www.tastingtable.com/cook/national/how-to-make-your-own-caramel-dry-caramel"],["Caramel sauce, two ways","Pastry Living","https://pastryliving.com/2-ways-to-make-perfect-caramel-sauce"]],"y":640},{"id":"p-gian","n":"Gianduia","t":"gian","s":"pack","tw":"Hazelnut, icing sugar and milk chocolate in equal parts.","I":[["Hazelnuts, blanched",200],["Icing sugar",200],["Milk chocolate 40%",200],["Salt",1]],"M":["Roast hazelnuts at 160 °C for 12–15 min; rub off any skins.","Blend warm with the icing sugar and salt to a fine, fluid paste (5–10 min).","Melt the chocolate (ideally temper it).","Mix the paste into the chocolate at 30–32 °C.","Pour into a lined frame or moulds; crystallise overnight at cool room temperature."],"N":["For a pipeable version, use it at about 26–28 °C as it starts to thicken."],"L":[["Homemade gianduja (after Christophe Michalak)","Amour de Cuisine","https://www.amourdecuisine.fr/en/article-homemade-gianduja-recipe-and-foolproof-tips.html"],["Gianduja","Culinary Institute of America","https://www.ciafoodies.com/?p=164507"]],"y":null},{"id":"p-tatin","n":"Apple tatin","t":"comp","s":"pack","tw":"Firm apples cooked in amber caramel and butter until translucent but holding.","I":[["Firm, tart apples, peeled",800,"g","weight after peeling and coring"],["Sugar",160],["Butter",60],["Calvados or rum",20],["Vanilla pod",0.5,"pcs"],["Pectin NH",6,"g","only for a sliceable insert"]],"M":["Cut apples into 1.5 cm dice (insert) or quarters (tatin).","Make a dry caramel to deep amber; add butter and vanilla.","Add apples; cook, turning, until translucent but still holding (10–15 min).","Add Calvados. For an insert, sprinkle in the pectin mixed with 20 g of the sugar and boil 1 min.","Pack into a mould and freeze, or cool for baking into pastry."],"N":["Good varieties hold their shape: Granny Smith, Antonovka, Reinette."],"L":[["Apple chocolate entremet (apple insert)","Pastry Workshop","https://pastry-workshop.com/apple-chocolate-entremet/"]],"y":780},{"id":"p-apmou","n":"Apricot mousse","t":"mou","s":"pack","tw":"Fruit mousse lightened with whipped cream and meringue.","I":[["Apricot purée",300],["Sugar",40],["Lemon juice",10],["Gelatin powder 200 bloom",8],["Water (for gelatin)",40],["Cream 35%",250],["Egg whites",60],["Sugar (for meringue)",60]],"M":["Bloom the gelatin. Warm a third of the purée with the sugar; dissolve the gelatin; add the rest of the purée and lemon.","Cool to about 30 °C.","Whip the cream to soft peaks.","Make the meringue: whip whites with the sugar to glossy peaks.","Fold meringue into the purée, then the cream, in thirds.","Pour around a frozen insert in moulds; freeze."],"N":["The pack uses French (raw) meringue. For anything you sell, make an Italian meringue: cook the 60 g sugar with 20 g water to 118 °C and pour it into the whites."],"L":[["Vanilla, apricot and honey entremets","de Buyer","https://www.debuyer.com/en/blog/post/vanilla-apricot-and-honey-entremets.html"],["Apricot rosemary entremet","Pastry Workshop","https://pastry-workshop.com/apricot-rosemary-entremet/"]],"y":null},{"id":"p-cococar","n":"Coconut caramel","t":"car","s":"pack","tw":"Caramel deglazed with full-fat coconut milk. Dairy-free.","I":[["Sugar",200],["Water",50],["Glucose",30],["Coconut milk, full-fat, warm",250],["Salt",3]],"M":["Cook sugar, water and glucose to amber.","Off the heat, whisk in the warm coconut milk gradually.","Return to the heat and cook to 103–104 °C.","Add salt; cool. It thickens as it cools."],"N":["Add lime zest or a pandan leaf to the coconut milk for a twist."],"L":[["Coconut milk caramel","Wild Wild Whisk","https://wildwildwhisk.com/wprm_print/coconut-milk-caramel-recipe"]],"y":470},{"id":"p-walcr","n":"Walnut crunch","t":"crunch","s":"pack","tw":"Royaltine method with walnut praline and chopped toasted walnuts.","I":[["Walnut praline",150],["Milk chocolate",70],["Feuilletine",90],["Toasted walnuts, chopped",60],["Flaky salt",1]],"M":["Melt the chocolate; stir in the praline.","Fold in feuilletine, walnuts and salt.","Spread 3–4 mm thick; chill to set."],"N":[],"L":[["Chocolate feuilletine crunch","Sweetly Cakes","https://sweetlycakes.com/en/feuilletine-crunch/"]],"y":null},{"id":"p-strycr","n":"Strawberry yogurt crunch","t":"crunch","s":"pack","tw":"White chocolate with yogurt and strawberry powders and a crisp element.","I":[["White chocolate",150],["Cocoa butter",15],["Yogurt powder",20],["Freeze-dried strawberry powder",15],["Feuilletine",70],["Freeze-dried strawberry pieces",15]],"M":["Melt white chocolate and cocoa butter to about 40 °C.","Stir in the yogurt and strawberry powders.","Fold in feuilletine and strawberry pieces.","Spread 3 mm thick; set in the fridge. Store airtight."],"N":["Never add fresh fruit or wet yogurt; it seizes the chocolate and softens the crunch."],"L":[["Chocolate bar, strawberry yogurt","Lurch","https://www.lurch.de/en/recipes/Recipes/Chocolate-bar-strawberry-yoghurt"]],"y":null},{"id":"p-bcnam","n":"Black currant namelaka","t":"nam","s":"pack","tw":"Namelaka with black currant purée replacing part of the milk.","I":[["Whole milk",120],["Glucose",10],["Gelatin powder 200 bloom",6],["Water (for gelatin)",30],["White chocolate",360],["Black currant purée",120],["Cream 35%, cold",390]],"M":["Heat milk and glucose; add the bloomed gelatin.","Pour over the chocolate in thirds; emulsify.","Blend in the purée (room temperature), then the cold cream.","Film on contact; set 12 h. Whisk briefly before piping."],"N":["The extra gelatin compensates for the purée's acidity."],"L":[["Namelaka, Valrhona's method","Time to Cook Online","https://timetocookonline.com/2017/01/30/namelaka/"]],"y":null},{"id":"p-vanwg","n":"Whipped vanilla ganache","t":"wgan","s":"pack","tw":"White chocolate whipped ganache with vanilla. Pipes sharp.","I":[["Cream 35% (hot part)",150],["Vanilla pod",1,"pcs","split and scraped"],["Glucose",15],["White chocolate",180],["Gelatin powder 200 bloom",2,"g","optional"],["Water (for gelatin)",10],["Cream 35%, cold",300]],"M":["Infuse the hot-part cream with vanilla and glucose; bring to a simmer.","Pour over chocolate (and bloomed gelatin) in thirds; emulsify.","Blend in the cold cream.","Film on contact; chill 12 h.","Whip on medium to soft, pipeable peaks."],"N":[],"L":[["Whipped white chocolate ganache (Edd Kimber)","The Happy Foodie","https://thehappyfoodie.co.uk/recipes/whipped-white-chocolate-ganache/"],["Whipped white chocolate and vanilla ganache","Casserole & Chocolat","https://www.casseroleetchocolat.fr/?p=91584"]],"y":null},{"id":"p-bilcr","n":"Bilberry yogurt crispy layer","t":"crunch","s":"pack","tw":"Yogurt crunch with bilberry powder.","I":[["White chocolate",150],["Cocoa butter",15],["Yogurt powder",20],["Freeze-dried bilberry powder",15],["Feuilletine",80]],"M":["Melt white chocolate and cocoa butter to about 40 °C.","Stir in the powders.","Fold in feuilletine.","Spread thin; set and store airtight."],"N":["Toasted buckwheat (20 g) adds a Baltic note."],"L":[["Chocolate bar, strawberry yogurt","Lurch","https://www.lurch.de/en/recipes/Recipes/Chocolate-bar-strawberry-yoghurt"]],"y":null},{"id":"p-strgr","n":"Strawberry & grapefruit compote","t":"comp","s":"pack","tw":"Pectin NH strawberry compote; grapefruit segments folded in at the end.","I":[["Strawberries, quartered",400],["Grapefruit juice",60],["Grapefruit zest",2],["Sugar",90],["Pectin NH",6],["Grapefruit segments, cut small",150]],"M":["Warm strawberries, juice and zest to 45 °C.","Whisk in the sugar mixed with pectin.","Boil 2 min.","Off the heat, fold in the grapefruit segments.","Pour and set."],"N":["Segment carefully: any pith turns the whole compote bitter."],"L":[["Entremets with fresh Normandy flavours","Elle & Vire","https://www.elle-et-vire.com/int/en/pro/recipes/entremets-with-fresh-normandy-flavours"]],"y":null},{"id":"p-yogwg","n":"Whipped yogurt ganache","t":"wgan","s":"pack","tw":"White chocolate ganache with thick yogurt whisked in cold.","I":[["Cream 35% (hot part)",150],["Gelatin powder 200 bloom",2],["Water (for gelatin)",10],["White chocolate",200],["Cream 35%, cold",150],["Greek yogurt 10%, cold",200],["Lime zest",1,"pcs","lime, optional"]],"M":["Heat the hot-part cream; dissolve the bloomed gelatin.","Pour over the chocolate in thirds; emulsify.","Blend in the cold cream; cool to about 20 °C.","Whisk in the yogurt and zest.","Film on contact; chill 12 h. Whip gently; it whips faster than plain whipped ganache."],"N":[],"L":[["White chocolate & sheep's milk yogurt ganache (Mark Best)","Sitchu","https://www.sitchu.com.au/blog/summer-desserts-white-chocolate-ganache-recipe/"]],"y":null},{"id":"m-seab","n":"Sea buckthorn curd","t":"curd","s":"modern","tw":"Very acidic, oily Baltic berry. Strain well and blend the butter in thoroughly.","I":[["Sea buckthorn juice or sieved purée",180],["Sugar",160],["Whole eggs",150],["Egg yolks",40],["Butter, soft",160],["Salt",0.5]],"M":["Whisk sugar, eggs and yolks; add the juice.","Cook over a bain-marie, whisking, to 80–82 °C.","Strain through a fine sieve.","Cool to about 60 °C; blend in the butter and salt.","Chill at least 4 h."],"N":["Taste and adjust sugar; berries vary a lot in acidity."],"L":[["Sea buckthorn curd","Havoc in the Kitchen","https://www.havocinthekitchen.com/sea-buckthorn-curd/"],["Sea buckthorn tart with m 35% (warm part)",60],["Gelatin powder 200 bloom",3],["Water (for gelatin)",15],["Cream 35%, whipped",200]],"M":["Bloom the gelatin. Warm 60 g cream; dissolve gelatin; pour over the chocolate and emulsify.","Beat cream cheese, sugar and zest smooth.","Mix the warm chocolate into the cheese (it should be about 30 °C).","Fold in the whipped cream.","Pipe into choux or tart shells; chill 2 h."],"N":["Cheesecake was one of the named 2026 growth flavors. A fruit compote on top makes it a bakery-case item."],"L":[],"y":null},{"id":"m-kat","n":"Pistachio kataifi crunch","t":"crunch","s":"modern","tw":"Toasted kataifi in pistachio paste and white chocolate. The filled-bar style.","I":[["Kataifi pastry",150],["Butter",50],["Pistachio paste, 100%",200],["White chocolate",120],["Salt",2]],"M":["Chop the kataifi into 1–2 cm pieces.","Toast in butter in a wide pan, stirring, until deep golden; cool on paper.","Melt the white chocolate; mix in the pistachio paste and salt.","Fold in the kataifi.","Pipe into moulds or croissants after baking, or spread as a layer."],"N":["Pistachio paste is the main cost; work out cost per portion before pricing."],"L":[],"y":null},{"id":"m-buck","n":"Buckwheat & seed praline","t":"pral","s":"modern","tw":"Nut-free praline: seeds give the fat, toasted buckwheat the malty flavor.","I":[["Buckwheat groats",120],["Sunflower seeds",180],["Sugar",200],["Salt",2]],"M":["Toast buckwheat in a dry pan until fragrant and darker; toast seeds at 160 °C for 8–10 min.","Make a dry caramel to amber; add the warm buckwheat and seeds; stir to coat.","Pour onto a mat; cool.","Blend long, resting the motor, until a paste forms. Add salt."],"N":["It stays slightly textured; that's part of its charm. Test in a small batch first."],"L":[],"y":495},{"id":"m-yuzu","n":"Yuzu or makrut lime gel","t":"gel","s":"modern","tw":"Same agar method as lemon gel, with perfumed citrus.","I":[["Water",250],["Makrut lime leaves",6,"pcs","optional infusion"],["Yuzu juice (or lime juice)",150],["Sugar",120],["Agar powder",4]],"M":["Infuse lime leaves in the hot water 10 min, then remove (skip for plain yuzu).","Mix agar with sugar; whisk into the water and juice.","Boil 1 min.","Set in the fridge; blend until glossy and sieve."],"N":["Bottled yuzu juice is often salted; check the label and taste."],"L":[["The lemon by Cédric Grolet","Pastry Workshop","https://pastry-workshop.com/lemon-shaped-dessert-cedric-grolet/"]],"y":510},{"id":"m-olive","n":"Olive oil ganache","t":"setgan","s":"modern","tw":"Olive oil replaces butter: softer, glossier set with a peppery finish.","I":[["Cream 35%",200],["Glucose",20],["Dark chocolate 64–70%",200],["Mild extra virgin olive oil",60],["Flaky salt",1]],"M":["Heat cream and glucose; pour over the chocolate in thirds; emulsify.","At 35–40 °C, blend in the olive oil slowly.","Pour into a baked tart shell; finish with flaky salt once set."],"N":["Pair with citrus zest or rosemary."],"L":[],"y":null},{"id":"m-aqua","n":"Aquafaba whipped cream","t":"chant","s":"modern","tw":"Vegan whipped topping from reduced chickpea liquid.","I":[["Aquafaba, reduced",120,"g","from about 200 g, simmered and chilled"],["Cream of tartar",1],["Caster sugar",70],["Xanthan gum",0.5],["Vanilla extract",2]],"M":["Whip chilled aquafaba with cream of tartar to soft peaks.","Add the sugar mixed with xanthan gradually.","Whip to stiff, glossy peaks; add vanilla.","Use soon; fold into whipped coconut cream for a richer cream."],"N":[],"L":[["Vegan aquafaba whipped cream","My Quiet Kitchen","https://myquietkitchen.com/vegan-aquafaba-whipped-cream/"]],"y":null},{"id":"m-brown","n":"Brown butter crémeux","t":"cre","s":"modern","tw":"Vanilla crémeux finished with brown butter instead of plain butter.","I":[["Butter (to brown, gives ~80 g)",100],["Whole milk",150],["Cream 35%",150],["Egg yolks",60],["Sugar",40],["Gelatin powder 200 bloom",3],["Water (for gelatin)",15],["White chocolate",80],["Salt",1]],"M":["Brown the butter until nutty and the solids are hazelnut-brown; cool to about 40 °C.","Bloom the gelatin.","Make an anglaise with milk, cream, yolks and sugar to 82–84 °C.","Pour over chocolate and gelatin; emulsify.","At about 40 °C, blend in the brown butter and salt. Pour and chill 4 h, or freeze."],"N":["Scrape all the browned solids in: that's the flavor."],"L":[],"y":579},{"id":"s-patbake","n":"Bake-stable pastry cream","t":"pat","s":"staple","tw":"Extra starch so it holds inside danish and tarts.","I":[["Whole milk",1000],["Vanilla pod",1,"pcs"],["Sugar",220],["Egg yolks",180],["Cornstarch",110],["Butter",60]],"M":["Heat milk with vanilla and half the sugar.","Whisk yolks with the rest of the sugar and the cornstarch.","Temper, return to the pan, and whisk over heat until it boils.","Keep boiling and whisking 2 min.","Off the heat, add butter. Spread thin, film on contact, chill fast."],"N":["Beat smooth before piping. For a softer cream to pipe after baking, reduce cornstarch to 80 g."],"L":[],"y":1500},{"id":"s-dipl","n":"Diplomat cream","t":"pat","s":"staple","tw":"Pastry cream lightened with whipped cream and a little gelatin.","I":[["Whole milk",500],["Vanilla pod",1,"pcs"],["Sugar",100],["Egg yolks",90],["Cornstarch",45],["Gelatin powder 200 bloom",4],["Water (for gelatin)",20],["Cream 35%",250]],"M":["Make a pastry cream with milk, vanilla, sugar, yolks and cornstarch; boil 1–2 min.","Off the heat, add the bloomed gelatin. Chill with film on contact.","Beat the cold pastry cream smooth.","Whip the cream to soft peaks; fold into the pastry cream.","Pipe at once into choux, doughnuts or tarts."],"N":[],"L":[],"y":980},{"id":"s-mousse","n":"Praline mousseline (Paris-Brest)","t":"pat","s":"staple","tw":"Pastry cream beaten with soft butter and praline paste.","I":[["Whole milk",400],["Sugar",60],["Egg yolks",80],["Cornstarch",35],["Praline paste 50%",160],["Butter, soft",200]],"M":["Make the pastry cream; while hot, beat in half the butter. Chill with film on contact.","Bring to about 20 °C.","Beat the rest of the butter with the praline until light.","Add the pastry cream gradually, beating until smooth and airy.","Pipe at once."],"N":["Both parts at the same temperature (about 20 °C) is the key to no splitting."],"L":[["Millefeuille Pralin Feuilletine (praliné cream)","Barry Callebaut","https://www.barry-callebaut.com/en/recipes/artisans-chefs/le-royal/796"]],"y":910},{"id":"s-fran","n":"Frangipane","t":"fran","s":"staple","tw":"Crème d'amande with pastry cream folded in. Made to be baked.","I":[["Butter, soft",125],["Sugar",125],["Ground almonds",125],["Whole eggs",125],["Plain flour",20],["Pastry cream",250],["Rum",10]],"M":["Mix butter and sugar until smooth (don't whip).","Add almonds and flour, then eggs gradually.","Fold in the pastry cream and rum.","Pipe into tarts or pastries; bake at 160–180 °C until set and golden."],"N":["Swap almonds for walnuts, hazelnuts or pistachios."],"L":[["Walnut tart with walnut cream (Carl Marletti)","The Good Life France","https://thegoodlifefrance.com/recipe-for-walnut-tart-tarte-aux-noire/"]],"y":null},{"id":"s-cheese","n":"Danish cream cheese filling","t":"cheese","s":"staple","tw":"Baked filling: cream cheese, sugar, yolk, starch, zest.","I":[["Cream cheese, soft",500],["Sugar",100],["Egg yolks",40],["Cornstarch",20],["Lemon zest",3],["Vanilla extract",3]],"M":["Beat the cream cheese smooth on low.","Add sugar, then cornstarch, yolks, zest and vanilla. Don't overbeat.","Pipe into danish before baking.","Bake with the pastry."],"N":["Top with bilberry or black currant compote before baking."],"L":[],"y":null},{"id":"s-jam","n":"Bake-stable berry filling","t":"jam","s":"staple","tw":"Jam-style filling with yellow pectin that holds in the oven.","I":[["Berries (raspberry, bilberry, black currant)",500],["Sugar",300],["Yellow pectin",8],["Lemon juice",15]],"M":["Mix the pectin into 50 g of the sugar.","Bring berries and the remaining sugar to a boil.","Whisk in the sugar–pectin; boil to 104–105 °C (about 60–65% Brix).","Add lemon juice. Cool completely before piping."],"N":["Starch alternative: berries 500, sugar 120, cornstarch 30 slurried in water; boil until clear."],"L":[["Blueberry tartlets (pectin compote)","Relais Desserts","https://www.relais-desserts.net/en/?p=19348"]],"y":600},{"id":"c-halva","n":"Tahini halva","t":"halva","s":"classic","tw":"Classic tahini halva with pistachios. Crumbles beautifully into babka and buns.","I":[["Tahini, well stirred",300],["Vanilla extract",2],["Salt",2],["Sugar",250],["Water",70],["Glucose",30],["Pistachios, toasted (optional)",60]],"M":["Line a small loaf tin. Warm the tahini with vanilla and salt to about 45 °C; stir in pistachios.","Cook sugar, water and glucose to 120–125 °C.","Pour the syrup into the tahini and fold with a sturdy spatula until it just comes together and looks matte and stringy, 30–60 s.","Press firmly into the tin; cover and leave 12–24 h at room temperature.","Slice, or crumble for baking."],"N":["Stop mixing earlier rather than later; overmixing makes it sandy."],"L":[["Halva recipe","The Mediterranean Dish","https://www.themediterraneandish.com/wprm_print/halva-recipe"],["Tahini halva","Unicorns in the Kitchen","https://www.unicornsinthekitchen.com/tahini-halva-recipe/"]],"y":640},{"id":"c-sunhalva","n":"Sunflower halva","t":"halva","s":"classic","tw":"The Eastern European version, made from roasted sunflower seeds.","I":[["Hulled sunflower seeds",300],["Salt",1],["Vanilla extract",2],["Sugar",200],["Honey",50],["Water",60]],"M":["Roast the seeds at 160 °C for 10–12 min until golden; cool slightly.","Blend to a fine, oily meal, then a thick paste (several minutes, resting the motor). Add salt and vanilla.","Cook sugar, honey and water to 120 °C.","Pour into the warm seed paste and fold briefly until it tightens.","Press into a lined tin; set overnight."],"N":["Roasting depth is the flavor: aim for golden, not dark."],"L":[],"y":550},{"id":"c-halvacream","n":"Halva cream","t":"halva","s":"classic","tw":"Tahini
