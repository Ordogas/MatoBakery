whipped ganache with crumbled halva. For choux, croissants and babka tops.","I":[["Cream 35% (hot part)",100],["White chocolate",120],["Tahini",120],["Salt",1],["Cream 35%, cold",200],["Tahini halva, crumbled",80,"g","folded in after whipping"]],"M":["Bring the hot-part cream to a simmer; pour over the chocolate and emulsify.","Blend in the tahini and salt, then the cold cream.","Film on contact; chill 12 h.","Whip to soft peaks; fold in the crumbled halva and pipe."],"N":[],"L":[["Halva recipe","The Mediterranean Dish","https://www.themediterraneandish.com/wprm_print/halva-recipe"]],"y":null},{"id":"c-poppy","n":"Poppy seed filling","t":"poppy","s":"classic","tw":"For aguonų vyniotinis and makowiec: thick, bound and oven-safe.","I":[["Poppy seeds",250],["Whole milk",250],["Sugar",80],["Honey",40],["Butter",40],["Raisins",50],["Lemon zest",1,"pcs","lemon"],["Rum",10],["Whole egg",50],["Breadcrumbs or semolina",20]],"M":["Grind the poppy seeds finely (or scald with the hot milk, soak 1 h, then grind).","Cook with milk, sugar, honey and butter, stirring, until thick (10–15 min).","Off the heat, stir in raisins, zest, rum and crumbs; cool.","Mix in the egg.","Spread on rolled yeast dough, leaving a 2 cm border; roll and bake at 170–180 °C."],"N":["Taste the seeds before you start: rancid seeds make the whole filling bitter."],"L":[["Poppy seed roll (makowiec)","Polonist","https://www.polonist.com/poppy-seed-roll-makowiec/"],["Poppy seed roll","Where Is My Spoon","https://whereismyspoon.co/poppy-seed-roll"]],"y":700},{"id":"c-dulce","n":"Dulce de leche (from milk)","t":"dulce","s":"classic","tw":"Slow-cooked milk jam. The same caramel-milk flavor as boiled condensed milk.","I":[["Whole milk",1000],["Sugar",250],["Vanilla pod",1,"pcs"],["Baking soda",1.5],["Salt",1]],"M":["Bring milk, sugar and vanilla to a boil in a wide, heavy pan.","Remove from heat, stir in the baking soda (it foams), return to a low simmer.","Simmer 1.5–2.5 h, stirring every few minutes, more often as it thickens.","Stop when it's deep caramel-coloured and coats a spoon thickly; add salt.","Remove the vanilla; blend if grainy; jar while hot."],"N":["Condensed milk shortcut: pour a 397 g can into a dish, cover with foil, bake in a water bath at about 220 °C for 1–1.5 h, then whisk smooth. Avoid boiling sealed cans."],"L":[["Dulce de leche / confiture de lait","Not Quite Nigella","https://www.notquitenigella.com/2009/01/16/dulce-de-leche-or-confiture-de-lait/print/"],["Dulce de leche (David Lebovitz's oven method)","Cooking and Me","https://www.cookingandme.com/?p=411"]],"y":420},{"id":"c-marz","n":"Almond paste (50%)","t":"marz","s":"classic","tw":"Baking almond paste for croissants, bear claws and stollen.","I":[["Blanched almonds",250],["Icing sugar",250],["Egg white",35],["Bitter almond extract",1],["Lemon zest",0.5,"pcs","optional"]],"M":["Pulse almonds with half the icing sugar to a fine meal, without letting it turn oily.","Add the rest of the sugar, egg white and extract; pulse until it clumps.","Knead smooth; wrap tightly.","Rest overnight before using."],"N":["For dutch-style gevulde koek, mix 1:1 with frangipane for a softer bake."],"L":[["Gevulde koek (almond-paste filled pastry)","Wikipedia","https://en.wikipedia.org/wiki/Gevulde_koek"]],"y":null},{"id":"c-pdf","n":"Black currant pâte de fruit","t":"pdf","s":"classic","tw":"Intense, tart fruit jelly. A confection, or a bake-stable layer.","I":[["Black currant purée",500],["Sugar (with pectin)",50],["Yellow pectin",8],["Sugar",500],["Glucose",100],["Citric acid solution 50%",8],["Sugar for coating",50,"g","separate, for rolling"]],"M":["Line a frame or tin. Warm the purée to 50 °C.","Whisk in the pectin mixed with 50 g sugar; bring to a boil.","Add the remaining sugar in 3 additions, then the glucose, keeping it boiling.","Cook to 106–107 °C.","Off the heat, stir in the acid fast and pour. Set 12 h; cut and roll in sugar."],"N":["Sea buckthorn or raspberry swap in directly."],"L":[],"y":960},{"id":"c-mirror","n":"White mirror glaze","t":"glaze","s":"classic","tw":"Glossy, colourable glaze for frozen entremets.","I":[["Water",75],["Sugar",150],["Glucose",150],["Sweetened condensed milk",100],["Gelatin powder 200 bloom",10],["Water (for gelatin)",60],["White chocolate",150]],"M":["Bloom the gelatin.","Boil water, sugar and glucose to 103 °C.","Off the heat, add condensed milk and gelatin.","Pour over the chocolate; blend fully submerged; add colour; strain.","Chill overnight for best gloss. Rewarm to 32–35 °C and pour over the frozen dessert on a rack."],"N":[],"L":[],"y":670},{"id":"c-neutral","n":"Neutral glaze","t":"glaze","s":"classic","tw":"Clear, pectin-set shine for fruit tarts and danish.","I":[["Water",500],["Glucose",50],["Sugar",150],["Pectin NH",10],["Lemon juice",10]],"M":["Warm water and glucose to 45 °C.","Whisk in the sugar mixed with pectin.","Boil 1–2 min; add lemon juice.","Brush on at 40–60 °C. Remelts for reuse."],"N":[],"L":[],"y":690},{"id":"c-syrup","n":"Citrus soaking syrup","t":"syrup","s":"classic","tw":"1:1 syrup for babka, buns and sponges.","I":[["Water",250],["Sugar",250],["Orange or lemon zest strips",1,"pcs","fruit"],["Vanilla pod",0.5,"pcs"],["Liqueur (optional)",20]],"M":["Bring water, sugar, zest and vanilla to a boil.","Simmer 2 min; add liqueur off the heat.","Brush hot onto babka and buns straight from the oven, or cool for sponges."],"N":[],"L":[],"y":null},{"id":"n-almond","n":"Almond butter","t":"nutb","s":"classic","tw":"Roasted almond butter; the template for any nut.","I":[["Almonds (skin on)",400],["Salt",3],["Neutral oil (only if needed)",10]],"M":["Roast almonds at 160 °C for 10–12 min until fragrant.","Blend warm, scraping down every minute: powder, then a clump, then a fluid butter (10–15 min).","Add salt; add oil only if it refuses to loosen.","Jar while warm."],"N":["Same method for cashews, pecans or hazelnuts (rub off hazelnut skins)."],"L":[],"y":null},{"id":"n-hazcocoa","n":"Hazelnut cocoa spread","t":"nutb","s":"classic","tw":"Homemade gianduja-style spread, softer than gianduia.","I":[["Hazelnuts, roasted and peeled",200],["Icing sugar",90],["Cocoa powder",25],["Milk powder",30],["Neutral oil",20],["Vanilla extract",2],["Salt",1]],"M":["Blend warm hazelnuts to a fluid butter.","Add icing sugar, cocoa, milk powder, salt and vanilla; blend 2 min.","Add oil until spreadable.","Jar; it firms a little as it cools."],"N":[],"L":[],"y":null},{"id":"n-pistcream","n":"Pistachio cream","t":"nutb","s":"modern","tw":"The spreadable pistachio cream behind the filled-bar trend.","I":[["Pistachios, raw, shelled",150],["White chocolate",100],["Milk powder",25],["Icing sugar",20],["Neutral oil",20],["Salt",1]],"M":["Blend pistachios (lightly toasted at 150 °C, 6 min, if you want more depth) to a fluid butter.","Melt the white chocolate.","Blend in chocolate, milk powder, sugar and salt.","Loosen with oil; jar."],"N":["Keep pistachios pale for the green colour."],"L":[],"y":null},{"id":"n-sunflower","n":"Sunflower seed butter","t":"nutb","s":"classic","tw":"Nut-free, local, cheap; great in buns.","I":[["Hulled sunflower seeds",400],["Neutral or sunflower oil",20],["Honey (optional)",20],["Salt",3]],"M":["Roast seeds at 160 °C for 10 min until golden.","Blend warm 10–15 min, adding oil when it clumps.","Add salt and honey at the end (honey can stiffen it; blend longer)."],"N":["Sunflower butter can turn green in baking with baking soda; it's harmless (chlorogenic acid)."],"L":[],"y":null},{"id":"k-speculoos","n":"Speculoos butter","t":"cookieb","s":"classic","tw":"Spiced cookie butter, like the Belgian spread.","I":[["Speculoos biscuits",250],["Neutral oil",60],["Evaporated milk (or milk)",80],["Brown sugar",20],["Lemon juice",5],["Cinnamon",1],["Salt",1]],"M":["Grind the biscuits to a fine powder.","Warm the milk, oil and sugar until dissolved.","Blend into the crumbs until smooth.","Add lemon, cinnamon and salt; jar."],"N":[],"L":[],"y":null},{"id":"k-croissantb","n":"Croissant butter","t":"cookieb","s":"modern","tw":"Day-old croissants toasted and blended into a buttery spread.","I":[["Day-old croissants, torn",150],["Butter, soft",100],["Sweetened condensed milk",60],["Sugar",10],["Vanilla extract",2],["Salt",1]],"M":["Toast the croissant pieces at 160 °C until crisp and golden (10–12 min); cool.","Grind to fine crumbs.","Blend with soft butter, condensed milk, sugar, vanilla and salt until smooth.","Use soft; chill to firm."],"N":["Brown the butter first for a deeper version. A good use for unsold croissants."],"L":[],"y":null},{"id":"k-blackbreadb","n":"Black bread butter","t":"cookieb","s":"modern","tw":"Toasted juoda duona crumbs, butter and honey. A Baltic spread for buns.","I":[["Dry black rye bread crumbs",120],["Butter, soft",150],["Honey",30],["Salt",2],["Caraway (optional)",1]],"M":["Toast crumbs at 160 °C until crisp; cool and grind fine.","Beat butter with honey and salt.","Mix in the crumbs (and caraway).","Spread in buns before baking, or on warm bread."],"N":[],"L":[],"y":null},{"id":"y-hemp","n":"Hemp seed halva","t":"chbar","s":"yours","tw":"Your recipe: ground hemp seeds bound only with dark chocolate.","I":[["Hulled hemp seeds",160],["Cane sugar",10],["Dark chocolate",30]],"M":["Toast the hemp seeds lightly in a dry pan (2–3 min) if you want a nuttier flavor; cool.","Grind seeds with the sugar into a coarse, oily paste.","Melt the chocolate (or temper it) and mix it in thoroughly.","Press firmly into a lined small mould or frame.","Set at cool room temperature (or 20 min in the fridge); cut."],"N":["The seeds' own oil does most of the binding; the chocolate sets it."],"L":[],"y":null},{"id":"y-blackbread","n":"Black bread chocolate bar","t":"chbar","s":"yours","tw":"Your recipe: dry juoda duona crumbs bound with 80–90% dark chocolate.","I":[["Dark chocolate 80–90%",100],["Very dry black bread crumbs (juoda duona)",171],["Granulated sugar",14],["Salt",3.5]],"M":["Dry the crumbs fully (120 °C until crisp, if needed); cool.","Mix crumbs with sugar and salt.","Melt the chocolate to 45 °C and cool to 30–32 °C (or temper it).","Fold into the crumbs until every crumb is coated.","Press firmly into a lined bar mould; set at cool room temp, then cut."],"N":["For snap and gloss, temper the chocolate. Keep airtight: the crumbs absorb moisture."],"L":[],"y":null},{"id":"d-pistpud","n":"Pistachio pudding","t":"pud","s":"classic","tw":"Pudding thickened with cornstarch and eggs, flavored with homemade pistachio butter.","I":[["Raw pistachios",140,"g","blended to a butter"],["Sugar",140],["Cornstarch",28],["Salt",2],["Whole eggs",150,"g","about 3"],["Whole milk",680],["Butter",30],["Almond extract",3]],"M":["Blend pistachios to a smooth butter (5–10 min).","Whisk sugar, cornstarch and salt in a pan; whisk in eggs, milk and pistachio butter.","Cook over medium heat, whisking constantly, until thick with large bubbles (about 8 min).","Strain; whisk in butter and almond extract.","Pour into cups; film on contact; chill at least 3 h."],"N":["For a tart or cream pie, add about 8 g more cornstarch."],"L":[["From-scratch pistachio pudding","Everyday Pie","https://everydaypie.com/from-scratch-pistachio-pudding/"]],"y":null},{"id":"d-chocpud","n":"Chocolate pudding","t":"pud","s":"classic","tw":"Dark, silky pudding with yolks and chocolate.","I":[["Whole milk",700],["Cream 35%",200],["Sugar",120],["Cornstarch",45],["Cocoa powder",20],["Egg yolks",60],["Salt",2],["Dark chocolate 64%",120],["Butter",20],["Vanilla extract",3]],"M":["Whisk sugar, cornstarch, cocoa and salt; whisk in yolks, then milk and cream.","Cook, whisking, until thick and bubbling; boil 1 min.","Off the heat, whisk in chocolate, butter and vanilla.","Strain into cups; film on contact; chill 3 h."],"N":[],"L":[],"y":null},{"id":"i-royal","n":"Royal icing","t":"icing","s":"classic","tw":"Hard-setting icing for piping and decorated cookies.","I":[["Egg white (pasteurised for sale)",35],["Icing sugar, sifted",200],["Lemon juice",3]],"M":["Beat white and lemon with the icing sugar on low, then medium, 4–5 min, to stiff peaks.","Keep covered with a damp cloth while working.","For flooding, thin a portion with water a few drops at a time.","Let decorated items dry several hours."],"N":["Meringue powder version: 10 g meringue powder + 30 g water per 200 g icing sugar."],"L":[],"y":null},{"id":"i-glaze","n":"Icing glaze for buns & danish","t":"icing","s":"classic","tw":"Simple drizzle glaze; lemon or vanilla.","I":[["Icing sugar",200],["Lemon juice or milk",35],["Vanilla or zest",2]],"M":["Stir liquid into the icing sugar until smooth and thick but pourable.","Drizzle over warm (thin, translucent) or cooled (thicker, white) pastries."],"N":[],"L":[],"y":null},{"id":"i-ccfrost","n":"Cream cheese frosting","t":"icing","s":"classic","tw":"For cinnamon and cardamom buns and carrot cake.","I":[["Butter, soft",100],["Icing sugar",120],["Cream cheese, cold",200],["Vanilla extract",3],["Salt",0.5]],"M":["Beat butter and icing sugar until light.","Add cold cream cheese and vanilla; beat only until smooth (30–60 s).","Spread on warm buns, or chill before piping."],"N":[],"L":[],"y":null},{"id":"w-chantilly","n":"Classic Chantilly","t":"chant","s":"base","tw":"Plain sweetened whipped cream, for the same day.","I":[["Cream 35%, cold",500],["Icing sugar",40],["Vanilla pod",1,"pcs","seeds"]],"M":["Chill bowl and whisk.","Whip cream with sugar and vanilla on medium.","Stop at soft peaks for folding, firm for piping."],"N":["Pipes best when made just before use."],"L":[],"y":null},{"id":"w-gelatin","n":"Gelatin-stabilised whipped cream","t":"chant","s":"base","tw":"Holds piped shapes for a day or two.","I":[["Gelatin powder 200 bloom",3],["Water (for gelatin)",15],["Cream 35%, cold",500],["Icing sugar",40],["Vanilla extract",3]],"M":["Bloom gelatin; melt it with 50 g of the cream (warm, not hot).","Whip the rest of the cream with sugar to soft peaks.","With the mixer running, stream in the gelatin cream.","Whip to firm peaks; pipe at once."],"N":[],"L":[],"y":null},{"id":"w-creme","n":"Whipped crème fraîche","t":"chant","s":"base","tw":"Tangy, rich, less sweet. Great with fruit tarts and pavlova.","I":[["Cream 35%, cold",300],["Crème fraîche or smetana, cold",200],["Sugar",30]],"M":["Whip everything together on medium.","Stop at soft-medium peaks (it thickens fast)."],"N":[],"L":[],"y":null},{"id":"e-french","n":"French meringue shells","t":"mer","s":"base","tw":"Raw meringue baked low until dry and crisp.","I":[["Egg whites",100],["Caster sugar",100],["Icing sugar",100]],"M":["Whip whites to soft peaks.","Add caster sugar gradually; whip to stiff, glossy peaks.","Fold in sifted icing sugar.","Pipe; bake at 90–100 °C for 1.5–2 h until dry. Cool in the oven."],"N":[],"L":[],"y":200},{"id":"e-swiss","n":"Swiss meringue","t":"mer","s":"base","tw":"Heated meringue: stable, glossy, safe; for topping, torching and buttercream.","I":[["Egg whites",100],["Sugar",200],["Lemon juice or cream of tartar",1]],"M":["Whisk whites and sugar over a bain-marie to 70 °C, until the sugar dissolves.","Transfer to the mixer; whip on high until thick, glossy and cool.","Pipe onto tarts and torch, or use for buttercream."],"N":[],"L":[],"y":300},{"id":"e-pavlova","n":"Pavlova","t":"mer","s":"base","tw":"Crisp shell, marshmallowy centre.","I":[["Egg whites",150],["Caster sugar",300],["Cornstarch",10],["White wine vinegar",5],["Vanilla extract",3]],"M":["Whip whites to soft peaks; add sugar a spoon at a time until stiff and glossy.","Fold in cornstarch, vinegar and vanilla.","Shape a disc or individual nests on paper.","Bake at 120 °C, then lower to 100 °C; 1–1.5 h. Cool in the oven with the door ajar."],"N":["Top just before serving: whipped crème fraîche, curd, compote."],"L":[],"y":460},{"id":"l-kelpsalt","n":"Kelp salt","t":"flsalt","s":"nordic","tw":"Toasted seaweed and flaky salt: oceanic umami for caramel, chocolate and focaccia.","I":[["Dried kombu or kelp",25],["Flaky sea salt",75]],"M":["Toast the kelp briefly in a dry pan or at 160 °C for 3–4 min until crisp (don't burn).","Grind to a fine powder.","Mix with the flaky salt, crushing it slightly."],"N":["Use on salted caramel, chocolate bars, brown butter cookies, focaccia."],"L":[],"y":null},{"id":"l-mushsalt","n":"Porcini salt","t":"flsalt","s":"nordic","tw":"Forest mushroom salt for savoury pastries, butter and even dark chocolate.","I":[["Dried porcini or forest mushrooms",30],["Coarse sea salt",70],["Dried thyme",2]],"M":["Grind mushrooms (and thyme) to a fine powder.","Pulse with the salt briefly.","Sieve; store airtight."],"N":[],"L":[],"y":null},{"id":"l-sbsalt","n":"Sea buckthorn salt","t":"flsalt","s":"nordic","tw":"Bright orange, sour-salty finishing salt.","I":[["Freeze-dried sea buckthorn powder",20],["Flaky salt",80]],"M":["Mix powder and salt gently.","Store airtight; it pulls in moisture."],"N":["Great on white chocolate, whipped feta, smoked fish tartlets."],"L":[],"y":null},{"id":"l-sprucesugar","n":"Spruce-tip sugar","t":"flsalt","s":"nordic","tw":"Young spring spruce tips blended into sugar: piney, citrusy.","I":[["Young spruce tips (bright green, spring)",50],["Sugar",200]],"M":["Blend tips and sugar to a damp green sugar.","Spread thin; dry at 40–50 °C for a few hours.","Re-grind and sieve."],"N":["Forage only young tips from trees you can identify with certainty."],"L":[],"y":null},{"id":"l-beercar","n":"Beer caramel","t":"ucar","s":"nordic","tw":"Dark beer reduced, then built into a caramel. Malty and gently bitter.","I":[["Dark beer (porter, stout or dark ale)",400],["Sugar",200],["Cream 35%, hot",160],["Butter",40],["Salt",3]],"M":["Reduce the beer to about 100 g; keep warm.","Make a dry caramel with the sugar to amber.","Deglaze with the reduced beer, then the hot cream.","Cook to 104 °C; whisk in butter and salt."],"N":["Pairs with rye, apple, chocolate and walnuts."],"L":[],"y":420},{"id":"l-wheycar","n":"Whey caramel (brunost-style)","t":"ucar","s":"nordic","tw":"Leftover whey from varškė or labneh reduced with cream into a fudgy, cheesy caramel.","I":[["Whey",2000],["Cream 35%",200],["Brown sugar (optional)",40],["Salt",1]],"M":["Simmer the whey in a wide pan until reduced by about 80% (1.5–2 h).","Add cream and sugar; keep reducing, stirring more and more often, until thick and caramel-brown.","Blend smooth while hot.","Use as a sauce, or cook further until it sets like a soft brunost."],"N":["A zero-waste use for the whey from your labneh and strained kefir."],"L":[],"y":300},{"id":"l-gira","n":"Gira (kvass) syrup","t":"ucar","s":"nordic","tw":"Lithuanian bread kvass reduced into a sweet-sour, malty syrup.","I":[["Gira (kvass)",1000],["Sugar",80],["Salt",1]],"M":["Reduce the gira by about 80%.","Add sugar and salt; simmer until syrupy.","Use to soak rye cakes and babka, or drizzle on cream."],"N":[],"L":[],"y":250},{"id":"l-dilloil","n":"Dill oil","t":"infuse","s":"nordic","tw":"Vivid green herb oil for finishing drops.","I":[["Dill (fronds and thin stems)",100],["Neutral oil",200]],"M":["Blanch dill 5 s; ice; squeeze very dry.","Blend with the oil on high until the jug is warm (60–70 °C, about 3 min).","Strain through a cloth or coffee filter set over ice; don't press.","Keep in the dark, cold."],"N":["Same method: lovage, parsley, spruce tips."],"L":[],"y":180},{"id":"l-brownbutter","n":"Brown butter","t":"infuse","s":"nordic","tw":"Nutty, toasty butter: the most useful flavor upgrade in pastry.","I":[["Butter",500]],"M":["Melt butter in a light-coloured pan over medium heat.","Keep stirring as it foams; the solids turn golden, then hazelnut-brown.","Pour into a cold bowl at once, scraping in the solids.","Use liquid, or chill to set (re-add 15% water for baking if a recipe needs it)."],"N":["Use in frangipane, financiers, cookies, crémeux, praline."],"L":[],"y":400},{"id":"l-hay","n":"Hay-infused cream","t":"infuse","s":"nordic","tw":"Toasted hay gives cream a sweet, grassy, honeyed aroma. A base for whipped cream, anglaise or panna cotta.","I":[["Clean food-grade hay",25],["Cream 35%",500]],"M":["Rinse the hay; dry it, then toast at 200 °C for 5–8 min until fragrant.","Cover with cold cream; infuse 12–24 h in the fridge.","Strain, pressing gently. Use as cream in any recipe."],"N":["Use only clean, food-grade hay (from a trusted farm or supplier)."],"L":[],"y":450},{"id":"l-currantleaf","n":"Black currant leaf cream","t":"infuse","s":"nordic","tw":"Black currant leaves give a fragrant, fruity, muscat-like flavor.","I":[["Fresh black currant leaves",20],["Cream 35%",500]],"M":["Bring cream to a simmer; add the leaves; cover and remove from heat.","Infuse 15–30 min (hot) or overnight cold, tasting as you go.","Strain; chill. Use for whipped cream, ganache, anglaise."],"N":["Fig leaves work the same way."],"L":[],"y":470},{"id":"l-bildust","n":"Bilberry dust","t":"powder","s":"nordic","tw":"Intense purple berry powder from a dried purée.","I":[["Bilberry purée",400],["Sugar",20]],"M":["Spread purée 2 mm thick on a mat.","Dry at 55–60 °C until brittle (6–10 h).","Grind and sieve; store with a desiccant."],"N":["Freeze-dried fruit, ground, is the shortcut."],"L":[],"y":60},{"id":"l-bbpowder","n":"Brown butter powder","t":"powder","s":"nordic","tw":"Powdered brown butter that melts on the tongue.","I":[["Brown butter, cooled but liquid",100],["Tapioca maltodextrin",70],["Icing sugar",10],["Salt",1]],"M":["Put maltodextrin, sugar and salt in a bowl.","Whisk in the brown butter gradually until it becomes a powder.","Sieve; store airtight and dry."],"N":[],"L":[],"y":170},{"id":"l-leekash","n":"Leek ash","t":"powder","s":"nordic","tw":"Black, mineral, slightly sweet ash for savoury tartlets and cheese creams.","I":[["Leek tops (green parts)",300]],"M":["Roast leek tops at 250 °C (or over a flame) until completely black and dry.","Cool; grind fine and sieve.","Dust very lightly."],"N":["Use sparingly; it's a seasoning, not a coating."],"L":[],"y":15},{"id":"l-plum","n":"Lacto-fermented plums","t":"ferfruit","s":"nordic","tw":"Tangy, savoury plums plus a juice to season caramel and cream.","I":[["Plums, halved and pitted",1000],["Salt (2%)",20]],"M":["Toss plums with salt.","Vacuum-seal, or pack into a jar with a weight so juice covers them.","Ferment at 18–22 °C for 7–14 days, burping bags or jars.","Refrigerate when pleasantly sour."],"N":["Bake into a brown butter tart; reduce the juice with honey into a glaze."],"L":[],"y":null},{"id":"l-bilferm","n":"Lacto-fermented bilberries","t":"ferfruit","s":"nordic","tw":"Funky, deep berry ferment; the juice is a striking seasoning.","I":[["Bilberries",1000],["Salt (2%)",20],["Sugar (1%)",10]],"M":["Gently mix berries, salt and sugar.","Vacuum-seal or pack and weight in a jar.","Ferment 5–10 days at room temp; then refrigerate.","Use berries in tarts; use the juice in caramel, glazes or cream."],"N":[],"L":[],"y":null},{"id":"l-sprucepick","n":"Pickled spruce tips","t":"pick","s":"nordic","tw":"Bright, resinous little pickles for savoury and sweet garnishes.","I":[["Young spruce tips",150],["Cider vinegar",100],["Water",100],["Sugar",40],["Salt",6]],"M":["Pack the tips in a jar.","Pour over warm brine.","Chill; ready in a day."],"N":["Forage only young tips from trees you can identify with certainty."],"L":[],"y":150},{"id":"l-greenstraw","n":"Pickled green strawberries","t":"pick","s":"nordic","tw":"Unripe strawberries are firm and tart; pickled, they're crisp and floral.","I":[["Green (unripe) strawberries, halved",200],["Rice or white wine vinegar",100],["Water",60],["Sugar",40],["Salt",4]],"M":["Pack berries.","Pour over warm brine.","Chill 24 h."],"N":["Great with whipped cream, white chocolate, smoked fish."],"L":[],"y":200},{"id":"v-royale","n":"Quiche royale","t":"royale","s":"savoury","tw":"Soft-set savoury custard. About 600 g fills a 22–24 cm tart with ~250 g fillings.","I":[["Whole eggs",200,"g","about 4"],["Cream 35%",250],["Whole milk",150],["Salt",5],["Black pepper",1],["Nutmeg",0.5]],"M":["Whisk eggs gently; add cream, milk and seasoning without making foam.","Strain.","Spread cooked, dry fillings in a blind-baked, sealed shell.","Pour in the royale; bake at 160 °C until just set with a slight wobble (25–35 min for a large tart).","Rest 15 min before cutting."],"N":["Tartlets: about 40–50 g royale each, 15–20 min."],"L":[],"y":null},{"id":"v-mornay","n":"Pipeable mornay","t":"bech","s":"savoury","tw":"Thick cheese béchamel for croissants, croques and savoury danish.","I":[["Butter",70],["Plain flour",70],["Whole milk",800],["Hard cheese, grated (Džiugas, comté, gruyère)",150],["Dijon mustard",15],["Salt",6],["Black pepper",1],["Nutmeg",0.5],["Egg yolk (optional)",20]],"M":["Melt butter, add flour and cook 2 min without colour.","Whisk in the milk gradually; bring to a boil.","Boil 2–3 min, stirring the bottom.","Off the heat, add cheese, mustard, seasoning and yolk.","Film on contact; cool fully before piping."],"N":[],"L":[],"y":1050},{"id":"v-feta","n":"Whipped feta","t":"chcream","s":"savoury","tw":"Salty, tangy, pipeable. Finish with honey and thyme for a sweet–savoury bridge.","I":[["Feta",200],["Cream cheese",100],["Greek yogurt",60],["Olive oil",20],["Lemon zest",1,"pcs","lemon"],["Black pepper",0.5]],"M":["Crumble the feta into a food processor.","Blend with cream cheese and yogurt until completely smooth (2–3 min).","Stream in the olive oil; add zest and pepper.","Chill 30 min before piping."],"N":["Too salty? Soak the feta 30 min in cold water first."],"L":[],"y":null},{"id":"v-labneh","n":"Labneh","t":"chcream","s":"savoury","tw":"Strained salted yogurt: thick, tangy, spreadable.","I":[["Full-fat yogurt",1000],["Salt",8]],"M":["Stir the salt into the yogurt.","Spoon into a cloth-lined sieve over a bowl.","Strain in the fridge 24 h (36–48 h for a firmer labneh).","Spread, or roll into balls and keep under olive oil."],"N":["Plan a day ahead. Lithuanian kefir or rūgpienis strain the same way."],"L":[],"y":550},{"id":"v-varske","n":"Herbed varškė","t":"chcream","s":"savoury","tw":"Local curd cheese with sour cream, dill and chives.","I":[["Varškė (full-fat curd cheese)",300],["Sour cream (grietinė)",100],["Dill",15],["Chives",10],["Garlic",3],["Salt",4],["Black pepper",0.5],["Whole egg (only for baking in pastry)",50,"g","optional"]],"M":["Blend or sieve the varškė until smooth.","Mix in sour cream, chopped herbs, grated garlic and seasoning.","For baking inside pastry, add the egg; otherwise pipe it cold."],"N":[],"L":[],"y":null},{"id":"v-goat","n":"Whipped goat's cheese & honey","t":"chcream","s":"savoury","tw":"A sweet–savoury bridge for tartlets, figs and onion confit.","I":[["Soft goat's cheese",200],["Cream cheese",100],["Cream 35%",50],["Honey",25],["Thyme leaves",1],["Black pepper",0.5]],"M":["Whip goat's cheese and cream cheese smooth.","Add cream gradually until light.","Fold in honey, thyme and pepper."],"N":[],"L":[],"y":null},{"id":"v-blue","n":"Blue cheese cream","t":"chcream","s":"savoury","tw":"Mellow blue cheese cream for pear and walnut pastries.","I":[["Gorgonzola dolce or mild blue",120],["Mascarpone",180],["Black pepper",0.5]],"M":["Mash the blue cheese.","Beat in mascarpone until smooth.","Season with pepper; pipe after baking."],"N":[],"L":[],"y":null},{"id":"v-hummus","n":"Hummus","t":"dip","s":"savoury","tw":"Smooth, light hummus with lots of tahini.","I":[["Cooked chickpeas (from ~200 g dried)",450],["Tahini",200],["Lemon juice",70],["Garlic",1,"pcs","clove"],["Ice water",100],["Salt",7],["Ground cumin",1]],"M":["Cook chickpeas very soft (with ½ tsp baking soda in the water); drain.","Blend lemon juice, garlic and salt; rest 10 min, strain out the garlic if you want it milder.","Add tahini; blend, streaming in ice water until pale and fluffy.","Add the warm chickpeas and cumin; blend 3–4 min until very smooth.","Adjust salt and lemon."],"N":[],"L":[["Zahav's hummus tehina (Michael Solomonov)","Delicious Israel","https://www.deliciousisrael.com/blog/2019/9/22/zahavs-hummus-tehina"]],"y":null},{"id":"v-baba","n":"Baba ghanoush","t":"dipveg","s":"savoury","tw":"Charred eggplant with tahini and lemon.","I":[["Roasted eggplant flesh (from ~1 kg whole)",500],["Tahini",120],["Lemon juice",40],["Garlic",1,"pcs","clove"],["Salt",5],["Olive oil",20]],"M":["Char whole eggplants over a flame or under the grill until collapsed; cool.","Scoop the flesh and drain 20 min in a sieve.","Mash or pulse with tahini, lemon, garlic and salt.","Finish with olive oil."],"N":[],"L":[],"y":null},{"id":"v-muham","n":"Muhammara","t":"dipveg","s":"savoury","tw":"Roasted pepper and walnut spread with pomegranate molasses.","I":[["Roasted red peppers, peeled",300],["Walnuts, toasted",150],["Breadcrumbs",50],["Pomegranate molasses",30],["Lemon juice",15],["Chili flakes (Aleppo)",5],["Ground cumin",2],["Olive oil",50],["Salt",5]],"M":["Pulse walnuts and breadcrumbs coarsely.","Add peppers, molasses, lemon and spices; pulse to a textured spread.","Stream in olive oil; season."],"N":[],"L":[["Muhammara","The Mediterranean Dish","https://www.themediterraneandish.com/wprm_print/muhammara-recipe-roasted-red-pepper-dip"]],"y":null},{"id":"v-amba","n":"Quick amba","t":"chut","s":"savoury","tw":"Tangy mango pickle sauce with turmeric and fenugreek. Quick version; the traditional one ferments for days.","I":[["Firm green mango, peeled and diced",500],["Salt",15],["Neutral oil",30],["Mustard seeds",4],["Ground turmeric",6],["Ground fenugreek",3],["Chili flakes",2],["Garlic",2,"pcs","cloves"],["Water",150],["Cider vinegar",80],["Sugar",30]],"M":["Toss mango with salt; leave 2–24 h in the fridge (longer = more pickled).","Heat oil; fry mustard seeds until they pop, then the garlic and ground spices for 30 s.","Add mango with its liquid, water, vinegar and sugar.","Simmer until the mango is soft (15–20 min).","Blend partly or fully; cool and jar."],"N":["Fenugreek is what makes it amba, but too much turns it bitter."],"L":[["Amba, a pickled mango sauce","My Jewish Learning (The Nosher)","https://www.myjewishlearning.com/the-nosher/your-new-favorite-israeli-condiment-amba-a-pickled-mango-sauce/"],["Amba pickled mango chutney","Sense & Edibility","https://senseandedibility.com/amba-pickled-mango-chutney/"]],"y":700},{"id":"v-onion","n":"Onion confit","t":"cond","s":"savoury","tw":"Slow-cooked onions reduced with wine and vinegar. Oven-safe.","I":[["Onions, thinly sliced",1000],["Butter",40],["Olive oil",20],["Salt",8],["Thyme",3],["Brown sugar",70],["Red wine",100],["Balsamic or red wine vinegar",80]],"M":["Cook onions in butter and oil with the salt over medium-low, covered for 15 min.","Uncover; cook 30–45 min, stirring, until deep golden.","Add thyme, sugar, wine and vinegar.","Reduce until jammy.","Cool and jar."],"N":[],"L":[],"y":550},{"id":"v-tomjam","n":"Tomato jam","t":"cond","s":"savoury","tw":"Sweet, spicy tomato jam for cheese tartlets and galettes.","I":[["Ripe tomatoes, chopped",1000],["Sugar",300],["Red wine vinegar",60],["Lemon juice",30],["Fresh ginger, grated",10],["Chili flakes",2],["Ground cumin",2],["Salt",6]],"M":["Combine everything in a wide pan.","Simmer, stirring more as it thickens, for 1–1.5 h.","Stop when jammy and a spoon leaves a trail.","Jar hot."],"N":[],"L":[],"y":600},{"id":"v-toum","n":"Toum","t":"sauce","s":"savoury","tw":"Fluffy Lebanese garlic emulsion.","I":[["Garlic, peeled, germ removed",100],["Salt",6],["Lemon juice",50],["Neutral oil",400],["Ice water",50]],"M":["Blend garlic and salt to a paste, scraping down.","With the motor running, add oil a few drops at a time until it starts to emulsify.","Keep streaming in oil slowly, alternating with lemon juice and ice water.","It should be white, fluffy and thick. Chill."],"N":["Keep it cold and use within about a week."],"L":[["Toum (Lebanese garlic sauce)","The Woks of Life","https://thewoksoflife.com/toum-recipe-lebanese-garlic-sauce/"]],"y":null},{"id":"v-tahini","n":"Tahini sauce","t":"sauce","s":"savoury","tw":"Pourable lemony tahini.","I":[["Tahini",150],["Lemon juice",60],["Garlic",1,"pcs","clove, grated"],["Salt",3],["Ice water",120]],"M":["Whisk tahini, lemon, garlic and salt; it will seize.","Whisk in ice water gradually until smooth and pourable."],"N":[],"L":[],"y":null},{"id":"v-zhug","n":"Zhug","t":"herb","s":"savoury","tw":"Yemeni green chili-herb sauce.","I":[["Coriander (leaves and stems)",80],["Parsley",40],["Green chilies",30],["Garlic",10],["Ground cumin",2],["Ground cardamom",0.5],["Salt",4],["Olive oil",80],["Lemon juice",15]],"M":["Pulse herbs, chilies, garlic and spices to a coarse paste.","Add oil and lemon; season.","Chill; it keeps about a week."],"N":[],"L":[],"y":null},{"id":"v-wildg","n":"Wild garlic pesto","t":"herb","s":"savoury","tw":"Spring meškinis česnakas with sunflower seeds and Džiugas.","I":[["Wild garlic leaves",100],["Sunflower seeds, toasted",40],["Džiugas or parmesan, grated",40],["Cold-pressed rapeseed oil",120],["Lemon juice",10],["Salt",3]],"M":["Pulse seeds and cheese.","Add leaves; pulse.","Stream in oil; add lemon and salt.","Freeze in portions to use out of season."],"N":[],"L":[],"y":null},{"id":"v-dukkah","n":"Dukkah","t":"svcr","s":"savoury","tw":"Hazelnut, sesame and spice crunch.","I":[["Hazelnuts",100],["Sesame seeds",50],["Coriander seeds",20],["Cumin seeds",10],["Fennel seeds",5],["Black pepper",2],["Flaky salt",6]],"M":["Toast hazelnuts at 160 °C for 10 min; rub off skins.","Toast sesame until golden; toast whole spices until fragrant.","Pound or pulse coarsely; mix with salt."],"N":[],"L":[],"y":null},{"id":"v-zaatar","n":"Za'atar","t":"svcr","s":"savoury","tw":"Thyme, sumac and sesame blend for flatbreads and labneh.","I":[["Dried thyme",40],["Dried oregano",20],["Sumac",30],["Toasted sesame",15],["Salt",5]],"M":["Rub the dried herbs between your palms to break them up.","Mix with sumac, sesame and salt.","For manakish, mix 1 part za'atar with 1–1.5 parts olive oil and spread before baking."],"N":[],"L":[],"y":null},{"id":"v-shallot","n":"Crispy shallots","t":"crispy","s":"savoury","tw":"Golden fried shallots; the oil is a bonus.","I":[["Shallots, sliced 2 mm",300],["Neutral oil",500,"g","reusable as shallot oil"],["Salt",3]],"M":["Put shallots and oil in a pan cold.","Heat to a steady 120–140 °C, stirring, 15–20 min.","Lift out just before they reach golden (they keep colouring); drain on paper.","Salt; store airtight."],"N":[],"L":[],"y":90},{"id":"v-pickle","n":"Quick pickled red onion","t":"pick","s":"savoury","tw":"Pink, sharp, ready in an hour.","I":[["Red onion, thinly sliced",300],["Cider vinegar",150],["Water",150],["Sugar",50],["Salt",10],["Sumac (optional)",2]],"M":["Pack onions in a jar.","Heat vinegar, water, sugar and salt until dissolved; pour over warm.","Cool; chill at least 1 h. Drain to use."],"N":["Yield is the drained onion; brine is extra."],"L":[],"y":330},{"id":"v-dux","n":"Mushroom duxelles","t":"dux","s":"savoury","tw":"Finely chopped mushrooms cooked dry. Base for croissants, pithivier and kibinai variations.","I":[["Mushrooms (chestnut or forest)",1000],["Shallots, minced",120],["Butter",40],["Thyme",3],["White wine",50],["Cream (optional)",50],["Salt",8],["Black pepper",1]],"M":["Chop mushrooms finely (pulse in batches).","Sweat shallots in butter; add mushrooms and salt.","Cook over medium-high until all liquid has evaporated and it starts to sizzle (20–30 min).","Add wine and thyme; cook dry again; add cream and reduce.","Cool completely before using."],"N":[],"L":[],"y":450},{"id":"v-kib","n":"Kibinai filling (lamb)","t":"dux","s":"savoury","tw":"Traditional Karaim filling: chopped fatty lamb or mutton with onion. Cooks inside the pastry.","I":[["Lamb or mutton shoulder (with fat)",600],["Onion",200],["Salt",8],["Black pepper",2],["Ice water",40]],"M":["Chop the meat finely by knife (traditional) or coarse-mince.","Finely chop or grate the onion.","Mix with salt, pepper and ice water; keep cold.","Fill kibinai dough (about 60–70 g filling per piece), seal with a rope edge.","Bake at 190–200 °C until golden and the core reaches 72 °C (25–35 min)."],"N":["Variations: chicken, beef, or mushroom duxelles with varškė."],"L":[["Kibinai","Wikipedia","https://en.wikipedia.org/wiki/Kibinai"]],"y":null},{"id":"v-chorizo","n":"Mexican chorizo (sausage roll filling)","t":"dux","s":"savoury","tw":"Fresh pork mince seasoned with dried chilies, vinegar and warm spices. Cooks inside the pastry.","I":[["Pork mince (20–30% fat)",1000],["Ancho or guajillo chili powder",20],["Smoked paprika",10],["Chipotle in adobo, chopped (optional)",15],["Garlic, grated",15],["Ground cumin",3],["Dried oregano (Mexican if possible)",3],["Ground cinnamon",0.5],["Ground cloves",0.3],["Black pepper",2],["Salt (1.6%)",16],["Cider vinegar",30],["Panko or breadcrumbs (for rolls)",40],["Whole egg (for rolls)",50]],"M":["Keep the mince very cold. Mix all the spices, garlic, salt and vinegar into a paste.","Work the paste into the pork with your hands or a paddle for 1–2 min until slightly sticky (this binds it).","For sausage rolls, mix in the panko and egg; they hold the juices in the pastry.","Fry a small test patty and taste; adjust salt and heat.","Chill at least 1 h (overnight is better for flavor). Pipe or roll into logs on puff pastry, seal, egg wash and bake at 200 °C until golden and the core reaches 72 °C (25–30 min)."],"N":["Without panko and egg it's a classic loose chorizo for frying (tacos, eggs, topping a savoury danish).","Raw pork: keep below 4 °C, use within 2 days or freeze in portions."],"L":[],"y":null},{"id":"v-spinfeta","n":"Spinach & feta filling","t":"dux","s":"savoury","tw":"For burekas, danish and quiche.","I":[["Spinach, blanched and squeezed dry",300],["Feta, crumbled",200],["Varškė or ricotta",150],["Whole egg",50],["Dill",15],["Spring onion",40],["Nutmeg",0.3],["Black pepper",0.5]],"M":["Squeeze the spinach very dry and chop.","Mix with cheeses, egg, herbs and spring onion.","Season (feta is salty; taste before adding salt).","Fill pastry and bake."],"N":[],"L":[],"y":null},{"id":"v-eggplant","n":"Roasted eggplant (for sabich)","t":"dux","s":"savoury","tw":"Golden, soft eggplant slices.","I":[["Eggplant",600],["Olive oil",50],["Salt",6]],"M":["Slice 1 cm thick; salt and rest 20 min; pat dry.","Brush with oil; roast at 220 °C, turning once, until golden and soft (25 min)."],"N":[],"L":[],"y":350},{"id":"v-beet","n":"Beet hummus","t":"dip","s":"savoury","tw":"Deep pink, earthy-sweet hummus.","I":[["Cooked chickpeas",300],["Roasted beetroot, peeled",200],["Tahini",100],["Lemon juice",50],["Garlic",1,"pcs","clove"],["Ground cumin",1],["Salt",6],["Ice water",40]],"M":["Blend lemon, garlic and salt; add tahini and ice water until pale.","Add chickpeas and beet; blend 3–4 min until smooth.","Season; chill."],"N":["Top with dill and toasted hemp or sunflower seeds."],"L":[],"y":null},{"id":"v-whitebean","n":"White bean & rosemary dip","t":"dip","s":"savoury","tw":"Silky, mild dip; good under roasted vegetables.","I":[["Cooked white beans",400],["Olive oil",60],["Lemon juice",25],["Garlic",1,"pcs","clove, confit or raw"],["Rosemary, chopped",2],["Salt",5],["Bean cooking water",40]],"M":["Warm the oil with rosemary and garlic for 5 min; cool.","Blend beans with lemon and salt.","Stream in the infused oil and cooking water until silky."],"N":[],"L":[],"y":null},{"id":"v-pea","n":"Pea, mint & dill dip","t":"dip","s":"savoury","tw":"Bright green, fresh; the spring version.","I":[["Peas (frozen), blanched",400],["Tahini",30],["Mint",10],["Dill",10],["Lemon juice",25],["Olive oil",50],["Garlic",1,"pcs","clove"],["Salt",5]],"M":["Blanch peas 2 min; chill in ice water; drain.","Blend with herbs, tahini, lemon and garlic.","Stream in olive oil; season. Keep some texture if you like."],"N":["Colour fades within a day; make it fresh."],"L":[],"y":null},{"id":"v-romesco","n":"Romesco","t":"dipveg","s":"savoury","tw":"Catalan roasted pepper and nut sauce.","I":[["Roasted red peppers, peeled",250],["Roasted tomatoes",150],["Almonds, toasted",60],["Hazelnuts, toasted",40],["Toasted bread",30],["Garlic",2,"pcs","cloves, roasted"],["Sherry vinegar",25],["Smoked paprika",3],["Olive oil",80],["Salt",5]],"M":["Pulse nuts and bread fine.","Add peppers, tomatoes, garlic, vinegar and paprika; pulse.","Stream in oil; keep some texture. Season."],"N":[],"L":[],"y":null},{"id":"v-fig","n":"Fig & port jam","t":"cond","s":"savoury","tw":"For goat's cheese, blue cheese and gougères.","I":[["Dried figs, chopped",300],["Water",200],["Port",150],["Sugar",60],["Balsamic vinegar",20],["Black pepper",1],["Thyme",1]],"M":["Simmer figs, water and port 15 min until soft.","Add sugar, balsamic, pepper and thyme; cook until jammy.","Blend partly; jar."],"N":[],"L":[],"y":600},{"id":"v-bacon","n":"Bacon jam","t":"cond","s":"savoury","tw":"Smoky, sticky, sweet-savoury. For cheese scones, croissants and tartlets.","I":[["Smoked bacon, diced",500],["Onions, diced",300],["Brown sugar",80],["Maple syrup or honey",40],["Cider vinegar",60],["Strong brewed coffee",120],["Chili flakes",1],["Black pepper",1]],"M":["Render the bacon slowly until crisp; pour off most of the fat.","Cook the onions in the remaining fat until golden.","Add the rest; simmer 30–45 min until thick.","Pulse coarsely. Keep refrigerated."],"N":["Meat preserve: fridge, use within 2 weeks."],"L":[],"y":500},{"id":"v-rhubarb","n":"Rhubarb chutney","t":"chut","s":"savoury","tw":"Tart Baltic chutney for cheese and smoked meats.","I":[["Rhubarb, chopped",500],["Red onion, chopped",150],["Brown sugar",200],["Cider vinegar",150],["Fresh ginger, grated",15],["Mustard seeds",5],["Raisins",60],["Chili flakes",1],["Salt",4]],"M":["Simmer onion, sugar, vinegar, ginger and spices 10 min.","Add rhubarb and raisins; simmer 20–30 min until thick.","Jar hot."],"N":["Rest a few days before using; the vinegar mellows."],"L":[],"y":750},{"id":"v-plum","n":"Plum & chili chutney","t":"chut","s":"savoury","tw":"Late-summer plums with star anise and chili.","I":[["Plums, pitted and chopped",600],["Onion, chopped",150],["Brown sugar",180],["Red wine vinegar",150],["Fresh ginger, grated",15],["Chili flakes",3],["Star anise",1,"pcs"],["Cinnamon stick",1,"pcs"],["Salt",5]],"M":["Combine everything; bring to a boil.","Simmer 40–60 min, stirring more near the end, until thick.","Remove whole spices; jar hot."],"N":[],"L":[],"y":780},{"id":"v-aioli","n":"Aioli","t":"sauce","s":"savoury","tw":"Garlic mayonnaise.","I":[["Egg yolk",20,"g","1 yolk; pasteurised for sale"],["Garlic",2,"pcs","cloves, grated"],["Dijon mustard",5],["Lemon juice",15],["Salt",3],["Olive oil (mild)",80],["Neutral oil",120]],"M":["Whisk yolk, garlic, mustard, half the lemon and salt.","Whisk in oil drop by drop until it thickens, then in a thin stream.","Loosen with the rest of the lemon or a little water.","Chill; use within 2–3 days."],"N":[],"L":[],"y":null},{"id":"v-greentahini","n":"Green tahini","t":"sauce","s":"savoury","tw":"Tahini sauce blended with herbs.","I":[["Tahini",150],["Parsley",30],["Coriander",20],["Lemon juice",60],["Garlic",1,"pcs","clove"],["Ice water",120],["Salt",3]],"M":["Blend herbs, lemon, garlic and salt with half the water.","Add tahini and blend, adding water until pourable."],"N":[],"L":[],"y":null},{"id":"v-salsaverde","n":"Salsa verde","t":"herb","s":"savoury","tw":"Italian herb sauce with capers and anchovy.","I":[["Parsley",50],["Basil",15],["Mint",10],["Capers",25],["Anchovy fillets (optional)",10],["Garlic",1,"pcs","clove"],["Dijon mustard",10],["Red wine vinegar",15],["Olive oil",120],["Salt",2]],"M":["Chop herbs, capers, anchovy and garlic finely (or pulse briefly).","Stir in mustard and oil.","Add vinegar just before using; season."],"N":[],"L":[],"y":null},{"id":"v-chermoula","n":"Chermoula","t":"herb","s":"savoury","tw":"North African herb sauce with preserved lemon.","I":[["Coriander",60],["Parsley",30],["Garlic",10],["Ground cumin",4],["Sweet paprika",4],["Chili flakes",2],["Preserved lemon rind, chopped",15],["Lemon juice",25],["Olive oil",100],["Salt",3]],"M":["Pulse herbs, garlic and spices.","Add preserved lemon and oil.","Finish with lemon juice; season."],"N":[],"L":[],"y":null},{"id":"v-dillcuc","n":"Quick dill cucumbers","t":"pick","s":"savoury","tw":"Crisp fridge pickles, ready next day.","I":[["Small cucumbers, sliced 5 mm",500],["Dill (with flower heads if possible)",15],["Garlic",2,"pcs","cloves, sliced"],["Mustard seeds",3],["Vinegar 6%",150],["Water",250],["Sugar",30],["Salt",15]],"M":["Pack cucumbers with dill, garlic and mustard seeds.","Heat vinegar, water, sugar and salt until dissolved; cool to warm.","Pour over; chill overnight."],"N":["Yield is drained cucumbers."],"L":[],"y":500},{"id":"v-chilies","n":"Pickled chilies","t":"pick","s":"savoury","tw":"Sliced pickled chilies for heat and acidity.","I":[["Fresh chilies (jalapeño or red), sliced",250],["Garlic",2,"pcs","cloves"],["Vinegar",150],["Water",150],["Sugar",20],["Salt",8]],"M":["Pack sliced chilies and garlic.","Pour over hot brine.","Cool and chill; ready in a few hours."],"N":["Wear gloves for hot chilies."],"L":[],"y":250},{"id":"v-beets","n":"Pickled beets","t":"pick","s":"savoury","tw":"Sweet-sour cooked beets with clove and bay.","I":[["Cooked beets, sliced or diced",500],["Vinegar",200],["Water",200],["Sugar",80],["Salt",8],["Cloves",3,"pcs"],["Bay leaf",1,"pcs"]],"M":["Pack the cooked beets.","Boil the brine with spices; pour over hot.","Cool; chill 24 h."],"N":[],"L":[],"y":500},{"id":"v-mustard","n":"Pickled mustard seeds","t":"pick","s":"savoury","tw":"'Mustard caviar': pops on the tongue. Great with smoked fish and cheese.","I":[["Yellow mustard seeds",100],["Cider vinegar",150],["Water",100],["Sugar",50],["Salt",4],["Ground turmeric",1]],"M":["Rinse the seeds.","Simmer everything gently, stirring, 30–40 min, adding water if it gets dry.","Seeds should be plump and tender. Cool and jar."],"N":["They thicken overnight; loosen with a little water."],"L":[],"y":300},{"id":"v-giard","n":"Italian giardiniera","t":"giard","s":"savoury","tw":"Crunchy mixed vegetables in a bright vinegar pickle.","I":[["Cauliflower florets",300],["Carrots, sliced",150],["Celery, sliced",100],["Red pepper, strips",150],["Pearl or small onions",100],["Water (salt brine)",1000],["Salt (salt brine)",50],["White wine vinegar",500],["Water (pickle)",250],["Sugar",60],["Salt (pickle)",10],["Bay leaf",2,"pcs"],["Black peppercorns",8,"pcs"],["Chili flakes",1]],"M":["Soak vegetables overnight in the salt brine, refrigerated.","Drain and rinse; pack into jars.","Boil vinegar, water, sugar, salt and spices; pour over hot.","Cool; refrigerate 2–3 days before eating."],"N":["Yield is drained vegetables."],"L":[],"y":800},{"id":"v-chicago","n":"Chicago hot giardiniera","t":"giard","s":"savoury","tw":"Chopped, spicy and oil-packed. For focaccia, sandwiches and pizza.","I":[["Serrano or jalapeño chilies, chopped",200],["Cauliflower, chopped small",200],["Carrot, diced",100],["Celery, diced",100],["Red pepper, diced",100],["Water (salt brine)",1000],["Salt (salt brine)",60],["White vinegar",250],["Garlic",4,"pcs","cloves, minced"],["Dried oregano",3],["Chili flakes",3],["Olive or neutral oil",250]],"M":["Soak the vegetables in the salt brine overnight in the fridge; drain and rinse.","Toss with vinegar, garlic, oregano and chili flakes; marinate 2 h.","Pack into jars and cover completely with oil.","Refrigerate at least 2 days before using; keep refrigerated."],"N":["The vinegar step must come before the oil. Keep it in the fridge and use within 3–4 weeks."],"L":[],"y":900},{"id":"v-kraut","n":"Sauerkraut","t":"ferm","s":"savoury","tw":"Raugintas kopūstas: 2% salt cabbage, the classic ferment.","I":[["White cabbage, finely shredded",1000],["Salt (2%)",20],["Carrot, grated (optional)",80],["Caraway seeds",3]],"M":["Weigh the shredded cabbage (and carrot) and take exactly 2% salt.","Massage with salt and caraway 5–10 min until it's wet and limp.","Pack tightly into a jar or crock, pressing until brine covers it; weight it down.","Ferment at 18–22 °C, loosely covered; taste from day 5.","Refrigerate when sour enough (1–4 weeks)."],"N":["Skim any surface film; anything with fuzzy mould above the brine gets removed generously."],"L":[],"y":null},{"id":"v-agurkai","n":"Rauginti agurkai (fermented cucumbers)","t":"ferm","s":"savoury","tw":"Whole cucumbers in a 4% brine with dill, garlic and horseradish leaf.","I":[["Small pickling cucumbers",1000],["Water",1000],["Salt (4% of water)",40],["Dill heads and stems",30],["Garlic",6,"pcs","cloves"],["Horseradish leaf",1,"pcs","or black currant/oak leaves"],["Black peppercorns",10,"pcs"]],"M":["Soak cucumbers in cold water 1–2 h; trim the blossom ends.","Dissolve salt in the water.","Pack cucumbers upright with dill, garlic, leaves and pepper.","Cover with brine; weight down.","Ferment 3–7 days at room temp (1–3 days for lightly salted 'malosolnye'), then refrigerate."],"N":["Leaves add tannins that keep them crunchy. Yield is cucumbers."],"L":[],"y":1000},{"id":"v-kimchi","n":"Napa cabbage kimchi","t":"ferm","s":"savoury","tw":"Spicy fermented cabbage for kimchi croissants and cheese pastries.","I":[["Napa cabbage, cut 4 cm",1000],["Salt (for salting, rinsed off)",30],["Glutinous rice flour",10],["Water (rice paste)",100],["Gochugaru",40],["Fish sauce",30],["Garlic",20],["Fresh ginger",10],["Sugar",10],["Daikon or radish, julienned",150],["Spring onions",50]],"M":["Toss cabbage with salt; rest 1.5–2 h, turning, until bendy. Rinse 3 times; drain well.","Cook rice flour and water to a thin paste; cool.","Blend garlic, ginger, fish sauce and sugar; mix into the paste with gochugaru.","Mix cabbage, radish and spring onions with the paste (gloves).","Pack, press out air; 1–2 days at room temp, then fridge."],"N":["For baking, squeeze and chop it so it doesn't wet the dough."],"L":[],"y":null},{"id":"v-hotsauce","n":"Fermented chili sauce","t":"ferm","s":"savoury","tw":"3% chili mash, fermented then blended with vinegar.","I":[["Red chilies, stemmed",500],["Garlic",20],["Salt (3%)",16],["Vinegar",80],["Sugar (optional)",10]],"M":["Pulse chilies and garlic to a coarse mash; mix in the salt.","Pack into a jar; press down; cover the surface with a weighted bag or film.","Ferment 1–3 weeks at 18–22 °C.","Blend with vinegar (and sugar); strain if you want it smooth. Refrigerate."],"N":["Adding 100 g of fruit (mango, plum) makes it rounder."],"L":[],"y":600},{"id":"v-preslemon","n":"Preserved lemons","t":"salt","s":"savoury","tw":"Salt-cured lemons; the rind becomes soft and floral.","I":[["Unwaxed lemons",1000],["Coarse salt",150],["Extra lemon juice",200],["Bay leaf",1,"pcs"],["Black peppercorns",6,"pcs"]],"M":["Quarter each lemon from the top, leaving the base attached.","Pack salt inside each lemon.","Press into a jar, crushing to release juice; add bay and pepper.","Top up with juice to cover. Shake daily for a week.","Ready in 3–4 weeks. Rinse and use the rind."],"N":[],"L":[],"y":1150},{"id":"v-yolk","n":"Cured egg yolks","t":"salt","s":"savoury","tw":"Grate over savoury pastries like a hard cheese.","I":[["Egg yolks",6,"pcs"],["Salt",300],["Sugar",300]],"M":["Mix salt and sugar; spread half in a dish and make hollows.","Slip a yolk into each hollow; cover with the rest of the cure.","Refrigerate 5–7 days until firm.","Brush off the cure, rinse, pat dry.","Dry at 60–65 °C for 1–2 h, or air-dry in the fridge for a few days."],"N":["The cure is discarded; yield is about 10 g per yolk."],"L":[],"y":60},{"id":"v-everything","n":"Everything seasoning","t":"svcr","s":"savoury","tw":"Bagel-style topping for focaccia, croissants and gougères.","I":[["White sesame",40],["Black sesame",20],["Poppy seeds",20],["Dried garlic flakes",15],["Dried onion flakes",20],["Flaky salt",15]],"M":["Toast the white sesame lightly; cool.","Mix everything.","Sprinkle on egg-washed dough before baking."],"N":[],"L":[],"y":null},{"id":"v-chilicrisp","n":"Chili crisp","t":"crispy","s":"savoury","tw":"Crunchy chili oil with fried shallot and garlic.","I":[["Neutral oil",400],["Shallots, thinly sliced",120],["Garlic, thinly sliced",60],["Chili flakes (Sichuan or gochugaru)",50],["Sichuan pepper, ground",6],["Toasted sesame",15],["Sugar",10],["Salt",6]],"M":["Fry shallots in the oil from cold until golden; lift out. Repeat with garlic.","Put chili, Sichuan pepper, sesame, sugar and salt in a heatproof bowl.","Heat the oil to 120–130 °C and pour over the chili mix.","Stir in the fried shallots and garlic once cooled. Jar."],"N":[],"L":[],"y":560},{"id":"v-chickpea","n":"Crispy chickpeas","t":"crispy","s":"savoury","tw":"Roasted crunchy chickpeas for dips and tartlets.","I":[["Cooked chickpeas, dried well",400],["Olive oil",25],["Salt",4],["Smoked paprika",3],["Ground cumin",2]],"M":["Dry the chickpeas thoroughly (peel loose skins).","Toss with oil; roast at 200 °C, shaking, 30–40 min until crisp.","Toss with salt and spices while hot. Cool fully before storing."],"N":["Best within 2 days; re-crisp in the oven."],"L":[],"y":280},{"id":"f-macer","n":"Macerated berries","t":"fruitbasic","s":"base","tw":"Juicy sugared berries for topping after baking.","I":[["Mixed berries (strawberries halved)",500],["Sugar",50],["Lemon juice",10],["Salt",0.5,"g","pinch"]],"M":["Hull and cut larger berries so the pieces are similar in size.","Toss with sugar, lemon and salt.","Rest 20–60 min, stirring once, until glossy and juicy.","For pastry, drain them and reduce the juice into a glaze."],"N":["Try black pepper, mint, basil, elderflower syrup or a splash of mead."],"L":[],"y":560},{"id":"f-roastfruit","n":"Roasted stone fruit","t":"fruitbasic","s":"base","tw":"Plums, apricots or peaches roasted until jammy. Oven-safe.","I":[["Plums, apricots or peaches, halved and stoned",1000],["Brown sugar",80],["Butter, in pieces",30],["Lemon juice",15],["Star anise",2,"pcs"],["Vanilla pod, split",1,"pcs"]],"M":["Lay fruit cut side up in one layer in a baking dish.","Sprinkle with sugar, dot with butter, add lemon, star anise and vanilla.","Roast at 200 °C for 15–25 min until tender with syrupy juices.","Cool. Reduce the juices if you need a thicker glaze."],"N":["Firm, just-ripe fruit holds its shape best for danish."],"L":[],"y":800},{"id":"f-poachpear","n":"Poached pears","t":"fruitbasic","s":"base","tw":"Pears in spiced syrup, wine or mead.","I":[["Firm pears",6,"pcs"],["Water (or part wine, mead or tea)",1000],["Sugar",300],["Lemon (zest strips and juice)",1,"pcs"],["Vanilla pod, split",1,"pcs"],["Cinnamon stick or star anise",1,"pcs"]],"M":["Bring water, sugar, lemon and spices to a simmer.","Peel, halve and core the pears and drop them straight into the syrup.","Cover with a paper lid and poach at a bare simmer for 15–30 min, until a knife slides in.","Cool in the syrup. Reduce some of the syrup for glazing."],"N":["Red wine or black currant juice turns them deep purple."],"L":[],"y":900},{"id":"f-carapple","n":"Caramelized apples","t":"fruitbasic","s":"base","tw":"Quick pan-caramelized apples for danish, buns and tarts. Oven-safe.","I":[["Firm tart apples, peeled and cubed",1000],["Sugar",100],["Butter",50],["Lemon juice",15],["Ground cinnamon",2],["Salt",1]],"M":["Melt sugar in a wide pan to a light amber caramel.","Add butter, then the apples, in batches if needed.","Cook over high heat for 8–12 min, tossing, until golden and just tender with no liquid left.","Add lemon, cinnamon and salt. Cool on a tray."],"N":["Cook them dry; any juice left will soak the pastry. A splash of calvados is classic."],"L":[],"y":750},{"id":"f-candpeel","n":"Candied citrus peel","t":"fruitbasic","s":"base","tw":"Translucent candied orange, lemon or grapefruit peel.","I":[["Citrus peel strips (orange, lemon, grapefruit)",300],["Sugar",450],["Water",300],["Sugar for rolling",100]],"M":["Cut peel into strips, keeping a little pith.","Blanch three times, starting in cold water each time, to remove bitterness.","Simmer very gently in the sugar and water for 45–60 min, until translucent (about 108 °C).","Leave overnight in the syrup.","Drain, dry on a rack for several hours, then roll in sugar or dip in chocolate."],"N":["Keep the syrup to flavor soaking syrups and glazes."],"L":[],"y":500},{"id":"f-candnuts","n":"Candied nuts","t":"fruitbasic","s":"base","tw":"Sugar-crusted, caramelized nuts for crunch.","I":[["Nuts (pecans, almonds or hazelnuts)",500],["Sugar",150],["Water",50],["Butter",10],["Salt",3]],"M":["Boil sugar and water to 118 °C.","Add the nuts and stir off the heat until the sugar turns sandy and coats them.","Return to medium heat and keep stirring until the sugar melts into a caramel coat.","Stir in butter and salt, spread on baking paper and separate while warm."],"N":["Add spices (cinnamon, chili, smoked paprika) with the salt. Store airtight."],"L":[],"y":620},{"id":"f-toastnuts","n":"Toasted nuts & seeds","t":"fruitbasic","s":"base","tw":"Times and tips for toasting every common nut and seed.","I":[["Nuts or seeds",500],["Salt (optional)",3]],"M":["Spread in a single layer on a tray.","Toast at 160–170 °C: walnuts and pecans 8–10 min; almonds 10–14 min; hazelnuts 12–15 min (then rub off the skins); pine nuts, sesame and sunflower seeds 5–8 min, watching closely.","Shake the tray halfway. They are ready when fragrant and golden inside.","Cool fully before chopping, grinding or storing airtight."],"N":["Nuts keep cooking on the hot tray, so move them to a cold one.","Pan-toast small amounts, stirring constantly."],"L":[],"y":500},{"id":"f-fruitcrisp","n":"Oven-dried fruit crisps","t":"fruitbasic","s":"base","tw":"Thin apple or pear crisps for garnish.","I":[["Apples or pears",4,"pcs"],["Sugar",100],["Water",100],["Lemon juice",10]],"M":["Boil sugar and water into a syrup, add lemon, and cool.","Slice the fruit 1–2 mm thick on a mandoline.","Dip the slices in syrup, drain, and lay flat on a silicone mat.","Dry at 90 °C for 1.5–2.5 h, flipping once, until dry. They crisp as they cool.","Store airtight, ideally with a desiccant sachet."],"N":["Shape them over a rolling pin while warm for curved crisps."],"L":[],"y":120},{"id":"y-poppy","n":"Poppy seed halva","t":"chbar","s":"modern","tw":"Ground poppy seeds bound with white chocolate, in the style of the hemp seed halva.","I":[["Blue poppy seeds",150],["White chocolate",50],["Honey or sugar",12],["Salt",1],["Lemon zest (optional)",2]],"M":["Toast the poppy seeds lightly in a dry pan for 2–3 min, then cool.","Grind in a spice grinder or high-speed blender until they clump into a damp paste.","Melt the chocolate and mix with the poppy paste, honey, salt and zest.","Press into a lined tin 1–1.5 cm thick and chill until firm. Cut into bars, or crumble it as a filling."],"N":["Dark chocolate works too and is less sweet. With apple, plum or sour cherry it makes a Lithuanian-style poppy pastry filling."],"L":[],"y":215},{"id":"v-caronion","n":"Caramelized onions","t":"roastveg","s":"savoury","tw":"Slow-cooked deep amber onions with no added sugar. Oven-safe.","I":[["Onions, thinly sliced",1000],["Butter",40],["Neutral oil",15],["Salt",8],["Water, for deglazing",60]],"M":["Melt butter with oil in a wide heavy pan, then add the onions and salt.","Cover and cook on medium-low for 10–15 min until collapsed.","Uncover and cook 45–60 min, stirring every few minutes.","Whenever the pan browns, add a splash of water and scrape the brown bits back in. Repeat until deep amber and jammy.","Cool on a tray. Finish with thyme, or a splash of sherry or balsamic vinegar."],"N":["The sweetness comes from the onions themselves.","Shortcut: a tiny pinch of baking soda (about 1 g per kg) raises pH and speeds browning. Any more and they go mushy.","Make big batches; they freeze well in flat bags."],"L":[],"y":300},{"id":"v-rgarlic","n":"Roasted garlic","t":"roastveg","s":"savoury","tw":"Soft, sweet, spreadable roasted garlic.","I":[["Whole garlic heads",6,"pcs"],["Olive oil",30],["Salt",2]],"M":["Cut the tops off the heads to expose the cloves.","Drizzle with oil and salt, then wrap in foil.","Roast at 200 °C for 40–50 min until soft and golden.","Cool slightly, squeeze out the cloves and mash."],"N":["Refrigerate and use within 4 days, or freeze in portions. Garlic in oil must never sit at room temperature (botulism risk).","Beat it into butter, cheese creams, mash or béchamel."],"L":[],"y":180},{"id":"v-rpepper","n":"Roasted red peppers","t":"roastveg","s":"savoury","tw":"Charred, peeled peppers for focaccia, tartlets and dips.","I":[["Red peppers",6,"pcs"],["Olive oil",20],["Salt",3],["Sherry or red wine vinegar",10]],"M":["Char the peppers over a flame or under the grill, or roast at 230 °C for 25–30 min, turning, until blistered all over.","Cover in a bowl and steam for 15 min.","Peel, seed and tear into strips.","Dress with oil, salt and vinegar. Drain well before using in pastry."],"N":["Keep the juices for dressings or muhammara."],"L":[],"y":450},{"id":"v-confittom","n":"Slow-roasted tomatoes","t":"roastveg","s":"savoury","tw":"Jammy, concentrated tomatoes. Oven-safe once roasted.","I":[["Cherry or plum tomatoes, halved",1000],["Olive oil",40],["Salt",8],["Sugar",8],["Garlic, sliced",3,"pcs","cloves"],["Thyme",2]],"M":["Arrange cut side up on a lined tray.","Drizzle with oil and season with salt, sugar, garlic and thyme.","Roast at 130 °C for 2–2.5 h until shrunken and jammy but not dry.","Cool, and store in the fridge under a little oil."],"N":["Lay them on cheese creams before baking; they won't flood the pastry."],"L":[],"y":450},{"id":"v-sautmush","n":"Sautéed mushrooms","t":"roastveg","s":"savoury","tw":"Browned mushrooms with garlic and thyme.","I":[["Mushrooms, sliced",1000],["Neutral oil",20],["Butter",40],["Salt",9],["Garlic, chopped",2,"pcs","cloves"],["Thyme",3],["Sherry or white wine",50]],"M":["Heat oil in a wide pan until hot.","Add mushrooms in batches, never crowded, and cook until their liquid has evaporated and they brown.","Add butter, garlic and thyme, and cook 1 min.","Deglaze with sherry, reduce to dry, and season."],"N":["For pastry, cook them completely dry. For a finer filling, see Mushroom duxelles."],"L":[],"y":450},{"id":"v-leeks","n":"Melted leeks","t":"roastveg","s":"savoury","tw":"Silky butter-braised leeks for tarts and pithivier.","I":[["Leeks, white and pale green, sliced",1000],["Butter",60],["Salt",7],["Water",50],["Dijon mustard (optional)",15],["Lemon juice",10]],"M":["Wash the sliced leeks well and drain.","Cook gently in butter with salt and water, covered, for 20–25 min until silky, without browning.","Uncover and evaporate the liquid.","Stir in mustard and lemon."],"N":["Mix with cheese and egg for a quick tart filling."],"L":[],"y":500},{"id":"v-redcab","n":"Braised red cabbage","t":"roastveg","s":"savoury","tw":"Sweet-sour cabbage with apple and caraway.","I":[["Red cabbage, shredded",1000],["Onion, sliced",150],["Apple, grated",200],["Butter",40],["Brown sugar",50],["Red wine vinegar",80],["Salt",10],["Caraway seeds",3],["Bay leaf",1,"pcs"]],"M":["Soften the onion in butter.","Add the cabbage, apple, sugar, vinegar, salt, caraway, bay and a splash of water.","Cover and cook on low for 60–75 min, stirring now and then.","Uncover and reduce until no liquid is left."],"N":["Vinegar keeps it purple: the pigments (anthocyanins) are red in acid and turn blue-grey in alkaline conditions."],"L":[],"y":900},{"id":"v-squash","n":"Roasted squash purée","t":"roastveg","s":"savoury","tw":"Caramelized squash blended with brown butter.","I":[["Butternut or Hokkaido squash, cubed",1000],["Olive oil",30],["Salt",8],["Brown butter",30],["Maple syrup or honey",20]],"M":["Toss the squash with oil and salt.","Roast at 200 °C for 30–40 min until soft with browned edges.","Blend with brown butter and syrup.","If it's loose, stir it in a pan over low heat until thick."],"N":["Hokkaido doesn't need peeling. Sage, chili and feta all go well."],"L":[],"y":650},{"id":"v-greens","n":"Garlicky greens","t":"roastveg","s":"savoury","tw":"Wilted, squeezed spinach or chard for fillings.","I":[["Spinach or chard",1000],["Olive oil",30],["Garlic, sliced",3,"pcs","cloves"],["Chili flakes",1],["Salt",6],["Lemon zest",2]],"M":["Wilt the greens in batches in hot oil with garlic.","Tip into a colander and cool.","Squeeze hard, then chop.","Season with salt, chili and lemon zest."],"N":["Squeeze until no more water comes out. For pastry this decides between crisp and soggy."],"L":[],"y":350},{"id":"v-potato","n":"Crushed potato filling","t":"roastveg","s":"savoury","tw":"Buttery crushed potatoes with caramelized onion, for turnovers and buns.","I":[["Floury potatoes, peeled",1000],["Butter",60],["Salt",10],["Caramelized onions",100],["Black pepper",1],["Dill or chives, chopped",10]],"M":["Boil in salted water until tender.","Drain and steam-dry in the pot for 5 min.","Crush with butter.","Fold in caramelized onions, pepper and herbs, and season."],"N":["Good with varškė or smoked cheese, in pierogi-style turnovers, knishes and kibinai-style pastries."],"L":[],"y":1100},{"id":"v-pulledpork","n":"Pulled pork","t":"braise","s":"savoury","tw":"Cider-braised pork shoulder for buns, pies and sausage rolls.","I":[["Pork shoulder (neck), boneless",1500],["Salt",20],["Brown sugar",20],["Smoked paprika",6],["Ground cumin",3],["Garlic powder",3],["Onion, sliced",200],["Apple cider or apple juice",250],["Cider vinegar",40],["Dijon mustard",20]],"M":["Rub the pork with salt, sugar and spices, and rest overnight in the fridge.","Brown well in a casserole, add the onion, then the cider and vinegar.","Cover and braise at 150 °C for 3.5–4 h until it falls apart.","Shred. Skim the liquid, reduce it with the mustard, and mix in to bind.","Chill until set before filling pastry."],"N":["Bake filled pastries until the core reaches at least 72 °C."],"L":[],"y":1000},{"id":"v-shortrib","n":"Beer-braised short ribs","t":"braise","s":"savoury","tw":"Rich stout-braised beef for pies and hand pies.","I":[["Beef short ribs, bone-in",2000],["Salt",24],["Neutral oil",20],["Onion, chopped",250],["Carrot, chopped",150],["Garlic",4,"pcs","cloves"],["Tomato paste",30],["Dark beer (stout or porter)",500],["Beef stock",300],["Thyme",3],["Bay leaves",2,"pcs"]],"M":["Salt the ribs, ideally overnight.","Brown them hard in oil, then set aside.","Brown the vegetables and tomato paste, deglaze with beer, and add stock and herbs.","Return the ribs, cover and braise at 150 °C for 3–3.5 h.","Pull the meat off the bones. Strain and skim the liquid, then reduce it to a syrup.","Mix enough in to bind the meat, then chill until set."],"N":["Horseradish cream or pickled onions cut the richness."],"L":[],"y":1000},{"id":"v-chickthigh","n":"Chicken & mushroom filling","t":"braise","s":"savoury","tw":"Braised chicken thigh in a creamy mustard sauce, for classic pies.","I":[["Chicken thighs, bone-in",1500],["Salt",18],["Butter",30],["Onion, chopped",200],["Mushrooms, sliced",300],["Garlic",3,"pcs","cloves"],["White wine",150],["Chicken stock",300],["Thyme",3],["Cream",100],["Dijon mustard",15]],"M":["Season and brown the thighs skin side down, then set aside.","Brown the onion and mushrooms, add garlic, and deglaze with wine.","Add the stock and thyme, return the chicken, cover and braise at 160 °C for 60–75 min.","Shred the meat, discarding skin and bones.","Reduce the liquid with cream and mustard until thick, bind the meat, and chill."],"N":["Bake to a core of at least 72 °C."],"L":[],"y":900},{"id":"v-lambshoulder","n":"Slow-cooked lamb shoulder","t":"braise","s":"savoury","tw":"Cumin and apricot lamb for hand pies and filled flatbreads.","I":[["Lamb shoulder, bone-in",2000],["Salt",24],["Cumin seeds, toasted and ground",6],["Coriander seeds, ground",4],["Ground cinnamon",1],["Onion, sliced",250],["Garlic",5,"pcs","cloves"],["Tomato paste",30],["Water or stock",400],["Dried apricots, chopped",120],["Lemon juice",20],["Mint or parsley, chopped",15]],"M":["Rub the lamb with salt and spices.","Brown it, then add onion, garlic and tomato paste and cook 5 min.","Add the liquid, cover, and braise at 150 °C for about 4 h.","Shred. Reduce the liquid with the apricots until thick and bind.","Finish with lemon and herbs, then chill."],"N":["Serve with labneh or tahini sauce on the side."],"L":[],"y":1100}],"SCI":[{"n":"Sugar is more than sweetness","w":"Sugar holds onto water (it's hygroscopic). That keeps cakes moist, slows staling, lowers the freezing point of ice creams, and ties up water so microbes can't use it. It also gets in the way of gluten and egg proteins, which makes things more tender, and it browns.","m":"Cut sugar and you don't only lose sweetness: shelf life drops, mousses freeze harder, meringues weep and jams don't set.","tips":["To reduce sweetness, swap part of the sugar for a less sweet one (glucose, dextrose, trehalose) rather than just removing it.","Dissolve sugar fully in meringue; undissolved crystals pull water and make beads of syrup."],"t":["mer","comp","pdf","setgan"]},{"n":"Caramelisation vs Maillard","w":"Caramelisation is sugar alone breaking down with heat (from about 160 °C for sucrose). Maillard reactions happen between sugars and proteins at lower temperatures (noticeable from ~120 °C, faster with heat) and give roasted, toasty, savoury notes. Alkaline conditions speed Maillard up; acid slows it.","m":"Brown butter, dulce de leche, crust colour and toasted milk powder are Maillard. Caramel is caramelisation. Knowing which you're doing tells you how to push it.","tips":["A pinch of baking soda speeds browning in dulce de leche and makes it less likely to curdle.","Add 10% milk powder to butter before browning for more of the tasty brown bits.","Toast white chocolate at 120 °C, stirring every 10 min, for 'blond' caramelised chocolate."],"t":["car","dulce","ucar","infuse"]},{"n":"Controlling sugar crystals","w":"A concentrated sugar syrup wants to recrystallise. A single crystal (a stray grain, a spoon, a speck of dust) seeds a chain reaction. Agitation helps it along. Other sugars (glucose, invert), acid and fat get in the way of crystals forming.","m":"This decides whether caramel turns grainy, whether fondant is smooth, and whether halva and fudge get their texture.","tips":["Brush down the pan sides with a wet brush, or put a lid on for a minute so steam washes crystals down.","Add 10–20% glucose (of the sugar weight) to caramel and syrups as insurance.","For halva and fudge you want controlled crystallisation, so stir at the right moment, not before."],"t":["car","halva","syrup","pdf"]},{"n":"Sugar stages","w":"As a syrup boils, water leaves and the temperature climbs. Each temperature range leaves a different amount of water, so the sugar sets anywhere from a soft syrup to glass. Above about 160 °C it starts to caramelise.","m":"The stage sets the texture of every confection: soft or firm marshmallow, chewy or hard nougat, glassy brittle, pâte de fruit that holds.","tips":["105–107 °C, thread: syrups, glazes, pâte de fruit.","112–118 °C, soft ball: fudge, Italian meringue (118–121), caramelised nuts.","118–125 °C, firm to hard ball: marshmallow (117–120), honey for nougat (120).","132–143 °C, soft crack: toffee, soft caramels at the low end.","146–155 °C, hard crack: nougat syrup (145–155), brittle base, pulled and blown sugar.","160–180 °C, caramel: light golden for nougatine and brittle, darker for sauces. Past 190 °C it turns bitter fast.","Check a thermometer in boiling water first; at sea level it should read 100 °C."],"t":["car","brit","noug","mallow","pdf","candy"]},{"n":"How eggs set","w":"Egg proteins unfold and bond when heated. Whites start to set around 62–65 °C, yolks around 65–70 °C. Sugar, dairy and starch dilute and protect them, so custards thicken at 80–85 °C. Go past that without starch and the proteins squeeze together and curdle.","m":"This is why anglaise stops at 82–84 °C, why pastry cream can boil (the starch protects it), and why a royale must leave the oven with a wobble.","tips":["Temper: whisk a little hot liquid into the eggs before combining.","Strain every custard; it catches the few overcooked bits.","Bake custards low (150–160 °C) or in a water bath for a silky set."],"t":["ang","cre","pat","royale","curd"]},{"n":"Egg-white foams & meringue","w":"Whipping unfolds egg-white proteins, and they wrap around air bubbles. Fat (even a trace of yolk or a greasy bowl) coats the proteins and stops them bonding. Acid (cream of tartar, lemon) and copper ions strengthen the foam. Sugar stabilises it but slows whipping, so it goes in once the foam has formed.","m":"The difference between a meringue that holds for hours and one that collapses or weeps.","tips":["Wipe the bowl and whisk with a paper towel dipped in vinegar or lemon juice before whipping whites; it removes any grease.","Separate eggs cold (cleaner split), but whip whites at room temperature (faster, more volume).","Start adding sugar at soft peaks, a spoon at a time.","Aged whites (2–3 days in the fridge, covered) are more stable for macarons.","Weeping beads on baked meringue mean undissolved sugar or humidity."],"t":["mer","mou","bc"]},{"n":"Why cream whips","w":"Cream is fat droplets in water. Whipping partly breaks the droplets' coating so they stick together around air bubbles (partial coalescence). That needs enough fat (30–35%+) and solid fat, so the cream must be cold. Keep going and the network collapses into butter.","m":"Explains why warm cream won't whip, why low-fat cream fails, and why whipped ganache needs a night in the fridge (cocoa butter has to crystallise).","tips":["Chill cream, bowl and whisk; cream below about 7 °C.","Overwhipped? Fold in a little liquid cream by hand to smooth it.","Mascarpone, gelatin or white chocolate give the fat network extra support."],"t":["chant","wgan","mou"]},{"n":"Emulsions","w":"An emulsion holds tiny droplets of one liquid inside another, like oil in water. Emulsifiers sit on the surface of the droplets and keep them apart: lecithin and proteins in egg yolk, mustard, garlic, milk proteins, cocoa solids. Too much oil too fast, or the wrong temperature, and the droplets merge and the sauce splits.","m":"Ganache, mayonnaise, toum, buttercream, curd with butter and hollandaise are all emulsions.","tips":["Emulsify ganache with a stick blender, head fully submerged, at 35–40 °C.","Broken ganache: blend in a spoon of warm milk or cream. Broken mayo or toum: start a new base and drip the broken sauce into it.","Add oil drop by drop at the start, then in a stream once it thickens."],"t":["setgan","wgan","sauce","curd","bc"]},{"n":"Chocolate and tempering","w":"Cocoa butter can crystallise in six forms. Only Form V gives snap, gloss and slow melting. Tempering melts all crystals, then cools and gently rewarms so only Form V remains. Untempered chocolate sets soft, dull and streaky (fat bloom).","m":"Tempering matters for bars, shells, decorations and chocolate-bound crunch. Ganache and baking don't need it.","tips":["Typical curves: dark 45–50 → 27–28 → 31–32 °C; milk 45 → 26 → 29–30 °C; white 45 → 25–26 → 28–29 °C.","Seeding is easiest: melt two thirds to 45 °C, stir in the last third as callets until it reaches working temperature.","A few drops of water seize chocolate; a lot of liquid (cream) makes ganache. The amount is what matters."],"t":["chbar","gian","crunch","setgan"]},{"n":"Starch: gelatinisation and staling","w":"Starch granules absorb water and swell as they heat (most starches from about 60–80 °C), thickening the liquid. Cornstarch needs a full boil to reach full thickness. As it cools and ages, starch molecules realign and squeeze out water (retrogradation). That's why creams weep and bread stales.","m":"It's why pastry cream must boil, why starch creams don't freeze well, and why fridge bread goes stale faster than bread at room temperature.","tips":["Boil pastry cream 1–2 min after it thickens. Egg yolks contain an enzyme that will thin it overnight unless it's boiled.","Film on contact and chill fast.","Modified starches (custard powder, Ultratex) resist weeping and freezing."],"t":["pat","pud","jam"]},{"n":"Gels compared","w":"Gelatin is an animal protein that melts at mouth temperature, giving a melting, wobbly set. Agar and gellan are from seaweed and bacteria; they set firmer and hold heat. Pectin is from fruit cell walls and needs sugar and acid, or calcium. Each sets and melts at different temperatures.","m":"Choosing the gel decides whether a dessert melts in the mouth, survives a warm plate, can be remelted, or freezes.","tips":["Gelatin strength (bloom) varies; sheets are standardised by count, powders by weight. Don't swap gram for gram between strengths.","Pectin NH can be remelted and repoured; yellow pectin can't.","Acid weakens gelatin; raw pineapple, kiwi and papaya destroy it."],"t":["gel","comp","pdf","glaze"]},{"n":"Butter and fat","w":"Butter is about 82% fat and 16% water, plus milk solids. It stays plastic (bendable) over a narrow range, about 13–16 °C, which matters for lamination. Browning drives off the water and toasts the milk solids. Fat coats flour and sugar, which makes things tender and short.","m":"Explains flaky versus short pastry, why laminating needs cold control, and why brown butter needs a little water added back in baking.","tips":["Dry butter (84% fat) is easier for lamination.","For flaky, keep butter in pieces; for short and tender, rub it in fully.","Brown butter loses 15–20% weight; replace some of that water if a recipe depends on it."],"t":["fran","streu","infuse","bc"]},{"n":"Flour and gluten","w":"Wheat proteins form gluten when hydrated and worked: stretchy and elastic. More protein (bread flour) means more structure; less (cake flour) means more tenderness. Resting lets gluten relax. Fat, sugar and acid all limit gluten.","m":"Why tart dough shrinks if not rested, why choux needs a strong flour, and why streusel stays crumbly.","tips":["Rest doughs cold before rolling and again before baking to stop shrinking.","T45 (fine, low ash) for viennoiserie, T55 for tarts and general use, T65 for bread.","Rye has little gluten; its structure comes from pentosans, which is why rye doughs are sticky."],"t":["streu","fran"]},{"n":"Leavening","w":"Air, steam and gas make things rise. Yeast makes CO₂ (fastest around 24–30 °C). Baking soda needs an acid to react; baking powder carries its own acid. Steam alone puffs choux and puff pastry.","m":"Why choux needs enough egg (the water makes the steam), and why puff rises without any raising agent.","tips":["Bake choux hot at first so steam builds fast, then lower to dry it out.","Too much soda tastes soapy and over-browns."],"t":["mer"]},{"n":"Acid and pH","w":"Acid brightens flavor, slows browning, curdles hot dairy, weakens gelatin and triggers pectin sets. Alkaline conditions (baking soda) do the opposite: more browning, softer legumes, darker cocoa.","m":"Timing the acid is a technique in itself: last in pectin, off the heat in curd, early in pickles.","tips":["Add acid at the end in pectin sets, or it gels in the pan.","Dutch-processed cocoa is alkalised: darker, milder, and doesn't react with baking soda.","A few drops of lemon in fruit compotes lifts the flavor without tasting sour."],"t":["comp","pdf","curd","pick"]},{"n":"Water activity and shelf life","w":"Water activity (aw) measures how much water is free for microbes to use. Sugar, salt, alcohol and drying all lower it. Most bacteria need aw above about 0.91; many moulds can grow down to about 0.80; very little grows below 0.6.","m":"Why jam and praline keep at room temp and pastry cream doesn't, and how bonbon ganache lasts weeks (high sugar, invert sugar, butter).","tips":["To extend ganache life: more chocolate, a little invert sugar or sorbitol, less cream.","Dry components (crunch, powders, salts) keep longest; keep them airtight."],"t":["setgan","jam","pral","flsalt"]},{"n":"Brix (sugar concentration)","w":"Brix is the % of dissolved solids, mostly sugar, measured with a refractometer. It predicts set, sweetness, shelf life and how hard
