<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakery Planner</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316846f'/><path d='M14 40c0-11 8-20 18-20s18 9 18 20H14z' fill='%23fffdf9'/><path d='M22 40c1-6 4-11 10-13M32 40c0-6 2-10 6-12' stroke='%2316846f' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --surface:#fffdf9; --sunk:#eee8dc; --line:#e2dacb; --ink:#1e1913; --muted:#6f6556; --faint:#a39a8a;
  --accent:#16846f; --accent-ink:#ffffff; --accent-soft:#d9f1ea;
  --reg:#5b5347; --reg-soft:#ece6da;
  --sea:#a86410; --sea-soft:#fbead0;
  --spe:#7b3fa0; --spe-soft:#efe2f7;
  --warn:#b4321f; --warn-soft:#fbe1dc;
  --ok:#2c7a3f; --ok-soft:#dcf0e0;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 2px 8px rgba(40,30,10,.05);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16130f; --surface:#1f1b16; --sunk:#2a251e; --line:#3a3329; --ink:#f3ede3; --muted:#b5aa98; --faint:#7d7466;
  --accent:#4fd1b5; --accent-ink:#0d1f1a; --accent-soft:#163a32;
  --reg:#cfc5b4; --reg-soft:#2d281f; --sea:#f0b45c; --sea-soft:#3a2a12; --spe:#d3a6ee; --spe-soft:#33213f;
  --warn:#ff8a75; --warn-soft:#45201a; --ok:#7fd396; --ok-soft:#1c3523; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16130f; --surface:#1f1b16; --sunk:#2a251e; --line:#3a3329; --ink:#f3ede3; --muted:#b5aa98; --faint:#7d7466;
  --accent:#4fd1b5; --accent-ink:#0d1f1a; --accent-soft:#163a32;
  --reg:#cfc5b4; --reg-soft:#2d281f; --sea:#f0b45c; --sea-soft:#3a2a12; --spe:#d3a6ee; --spe-soft:#33213f;
  --warn:#ff8a75; --warn-soft:#45201a; --ok:#7fd396; --ok-soft:#1c3523; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:12px}

/* app shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:10px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;position:relative}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav .dot{position:absolute;top:-5px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:14px}
main{max-width:1500px;margin:0 auto;padding:16px 16px 80px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:24px;letter-spacing:-.02em}
.weeknav{display:flex;align-items:center;gap:4px}
.weeknav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:18px}
.weeknav .btn{width:auto;white-space:nowrap;height:36px}

/* badges */
.b{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.b.reg{background:var(--reg-soft);color:var(--reg)}
.b.sea{background:var(--sea-soft);color:var(--sea)}
.b.spe{background:var(--spe-soft);color:var(--spe)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.acc{background:var(--accent-soft);color:var(--accent)}

/* decision lane */
.lane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.lane h3{font-size:15px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lane-items{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.dcard{flex:0 0 auto;min-width:200px;max-width:260px;text-align:left;border:1px dashed var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.dcard.late{border-color:var(--warn);background:var(--warn-soft)}
.dcard b{display:block;font-size:14px}
.dcard .small{display:block}
.lane-empty{font-size:14px;color:var(--muted)}

/* week board */
.board{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.col{background:var(--sunk);border-radius:14px;padding:8px;min-height:300px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.col.today{outline:2px solid var(--accent);outline-offset:-2px}
.col.drop{background:var(--accent-soft)}
.colh{display:flex;align-items:baseline;gap:6px;padding:2px 4px}
.colh b{font-family:var(--f-display);font-size:17px}
.colh .small{color:var(--muted)}
.colh .add{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
.sale{background:var(--surface);border-radius:10px;padding:8px;border:1px solid var(--line);text-align:left;width:100%}
.sale-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:4px}
.sale ul{list-style:none;margin:0;padding:0;font-size:13px}
.sale li{display:flex;gap:6px;align-items:baseline;padding:1px 0}
.sale li .q{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:24px;text-align:right}
.sale li .ch{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sale li .miss{color:var(--warn);font-weight:700;font-size:12px}
.sale .empty{font-size:13px;color:var(--muted)}
.tod{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:4px 4px 0}

.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--reg);border-radius:10px;padding:8px 10px;text-align:left;width:100%;display:flex;gap:8px;align-items:flex-start;box-shadow:var(--shadow)}
.card.k-order{border-left-color:var(--spe)}
.card.k-restock{border-left-color:var(--accent)}
.card.k-custom{border-left-color:var(--faint)}
.card.sea{border-left-color:var(--sea)}
.card.done{opacity:.55}
.card.done .ct{text-decoration:line-through}
.card[draggable="true"]{cursor:grab}
.chk{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;margin-top:1px;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:14px;height:14px}
.cbody{flex:1;min-width:0;cursor:pointer}
.ct{font-weight:600;font-size:14px;line-height:1.3}
.cm{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.cur{background:var(--ink)}
.csrc{font-size:12px;color:var(--muted);margin-top:3px}

/* sheets & dialogs */
.scrim{position:fixed;inset:0;background:rgba(20,15,8,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding:18px 18px 40px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.sheet-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.sheet-h h3{font-size:22px;letter-spacing:-.01em}
.x{margin-left:auto;border:0;background:var(--sunk);border-radius:8px;width:34px;height:34px;font-size:20px;flex:0 0 auto}
.sec{margin-top:18px}
.sec h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:var(--f-body);font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:14px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=password],input[type=time],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.li .grow{flex:1;min-width:0}
.chain{display:flex;flex-direction:column;gap:4px}
.chain .st{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border-radius:8px;background:var(--bg)}
.chain .st.cur{outline:2px solid var(--accent)}
.chain .st .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:84px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px}
.pill:hover{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.err{background:var(--warn);color:#fff}

/* today */
.today-wrap{max-width:760px}
.tl{display:flex;flex-direction:column;gap:8px}
.big .card{padding:12px}
.big .ct{font-size:16px}
.big .chk{width:28px;height:28px}
.logrow{display:grid;grid-template-columns:1fr repeat(4,72px);gap:6px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.logrow input{padding:6px;font-size:15px;text-align:center}
.logrow.h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
@media (max-width:560px){.logrow{grid-template-columns:1fr repeat(4,56px)}}

/* month */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 4px}
.md{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;font-size:12px}
.md.out{opacity:.4}
.md.today{outline:2px solid var(--accent)}
.md .n{font-family:var(--f-display);font-weight:700;font-size:15px}
.md .ln{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
@media (max-width:700px){.md{min-height:70px;padding:4px}.md .ln .t{display:none}}

/* orders */
.otabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.otabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.otabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ocard.req{border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-soft)}
.oh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.oh b{font-family:var(--f-display);font-size:18px}
.oitems{margin:0;padding-left:18px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.kv span{color:var(--muted)}
.links{display:flex;flex-direction:column;gap:8px}
.linkbox{display:flex;gap:6px}
.linkbox input{font-family:var(--f-mono);font-size:12px}

/* setup */
.stabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.stabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.stabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tbl td input{width:64px;text-align:center;padding:5px}
.tbl tr.grp td{background:var(--sunk);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.pcard h4{font-size:16px}
.stepday{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.stepday h5{margin:0 0 6px;font-size:13px;font-family:var(--f-body);font-weight:700;color:var(--muted)}
.steprow{display:grid;grid-template-columns:1fr 120px 70px auto;gap:6px;margin-bottom:6px;align-items:center}
.ingrow{display:grid;grid-template-columns:1fr 80px 70px auto;gap:6px;margin-bottom:6px}
.partrow{display:grid;grid-template-columns:1fr 130px 80px 64px auto;gap:6px;margin-bottom:6px;align-items:center}
@media (max-width:560px){.steprow,.partrow{grid-template-columns:1fr 1fr}.ingrow{grid-template-columns:1fr 70px 60px auto}}
.stock{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:18px}
.stepper input{width:70px;text-align:center}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.low i{background:var(--warn)}

/* login */
.login{max-width:380px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:28px;letter-spacing:-.02em}
.err{color:var(--warn);font-size:14px}
.note{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:900px){.board{grid-template-columns:repeat(7,82vw)}}
@media (prefers-reduced-motion:no-preference){.card,.btn,.dcard{transition:background .15s,border-color .15s,opacity .15s}}

/* loading */
.top{position:sticky}
.busy{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden;background:transparent}
.busy i{position:absolute;top:0;bottom:0;width:30%;background:var(--accent);border-radius:2px;animation:busy 1s ease-in-out infinite}
@keyframes busy{0%{left:-30%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.busy i{animation:none;left:0;width:100%;opacity:.6}}
.sk{background:linear-gradient(90deg,var(--sunk) 0%,var(--surface) 50%,var(--sunk) 100%);background-size:200% 100%;border-radius:10px;height:64px;animation:sk 1.2s ease-in-out infinite}
.col .sk{background:linear-gradient(90deg,var(--line) 0%,var(--surface) 50%,var(--line) 100%);background-size:200% 100%}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
main[aria-busy="true"] .board{transition:opacity .2s}

/* recipe colours */
.card.rc{border-left-color:var(--rc);background:color-mix(in srgb,var(--rc) 7%,var(--surface))}
.card.rc .dots i.on{background:color-mix(in srgb,var(--rc) 45%,var(--surface))}
.card.rc .dots i.cur{background:var(--rc)}
.card.rc .dots i{background:color-mix(in srgb,var(--rc) 18%,var(--surface))}
.card.rc .rname{color:color-mix(in srgb,var(--rc) 70%,var(--ink));font-weight:600}
.dots i{width:7px;height:7px}
.pdot{display:none;width:8px;height:8px;border-radius:50%;background:var(--rc);margin-right:5px;vertical-align:middle;flex:0 0 auto}
[style*="--rc"] > span > .pdot,.sheet-h .pdot{display:inline-block}
.pcard.rc{border-left:5px solid var(--rc)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{position:relative;width:32px;height:32px;cursor:pointer}
.sw input[type=radio]{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw input:checked + span{box-shadow:0 0 0 2px var(--ink)}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.sw.none span{background:var(--bg);color:var(--muted);font-weight:700}
.sw.custom{width:auto;display:flex;align-items:center}
.sw.custom input[type=radio]{width:0;height:0}
.sw.custom input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;padding:2px;background:var(--surface);cursor:pointer}
.sw.custom input[type=radio]:checked ~ input[type=color]{box-shadow:0 0 0 2px var(--ink)}

/* lab */
.labwrap{display:flex;flex-direction:column;height:calc(100dvh - 58px)}
.labwrap.hidden{display:none}
.labbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--accent-soft);color:var(--ink);font-size:14px;border-bottom:1px solid var(--line)}
.labbar.hidden{display:none}
#labFrame{flex:1;width:100%;border:0;background:var(--bg)}

.labbody{position:relative;flex:1;display:flex;min-height:0}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);overflow:auto;padding:16px;z-index:5}

.li.fresh{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* stock */

.onhand > div:first-child{flex:1;min-width:140px}
.onhand .big{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px}
.strip .cell{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--ok-soft);border-radius:7px;padding:4px 0;font-size:11px;min-width:0}
.strip .cell b{font-size:13px;font-family:var(--f-mono)}
.strip .cell .dw{color:var(--muted);font-weight:700;text-transform:uppercase}
.strip .cell .dn{color:var(--muted)}
.strip .cell .nd{color:var(--muted);font-family:var(--f-mono)}
.strip .cell.low{background:var(--sea-soft)}
.strip .cell.short{background:var(--warn-soft);color:var(--warn)}
.strip .cell.inc{box-shadow:inset 0 0 0 2px var(--accent)}
.warnt{color:var(--warn)}

/* header: sections + grouped nav */

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ================= CONFIG & DATA LAYER ================= */
const CFG = Object.assign({
  url: "https://qoawsxutvxwzdgerzunw.supabase.co",
  key: "sb_publishable_6CxO-uSs9sAsFUQL5rrj-w_RWlsJc3t",
  fillingLab: "https://claude.ai/artifact/8UoCucTi42c7fzcozt5N4H"
}, window.BAKERY_CONFIG || {});

function makeSupabaseDB(sb){
  const apply = (q, o = {}) => {
    for (const [k, v] of Object.entries(o.eq || {})) q = q.eq(k, v);
    for (const [k, v] of Object.entries(o.gte || {})) q = q.gte(k, v);
    for (const [k, v] of Object.entries(o.lte || {})) q = q.lte(k, v);
    for (const [k, v] of Object.entries(o.in || {})) q = q.in(k, v);
    if (o.notnull) q = q.not(o.notnull, "is", null);
    for (const [c, asc] of (o.order || [])) q = q.order(c, { ascending: asc !== false });
    return q;
  };
  const chk = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  return {
    sel: async (t, o = {}) => chk(await apply(sb.from(t).select(o.cols || "*"), o).limit(o.limit || 5000)),
    ins: async (t, rows) => { rows = [].concat(rows); if (!rows.length) return []; return chk(await sb.from(t).insert(rows).select()); },
    ups: async (t, rows, onConflict) => chk(await sb.from(t).upsert([].concat(rows), { onConflict }).select()),
    upd: async (t, id, patch) => (chk(await sb.from(t).update(patch).eq("id", id).select()) || [])[0],
    del: async (t, ids) => { ids = [].concat(ids).filter(Boolean); if (!ids.length) return; chk(await sb.from(t).delete().in("id", ids)); },
    rpc: async (fn, args) => chk(await sb.rpc(fn, args || {}))
  };
}
function makeSupabaseAuth(sb){
  const here = () => location.href.split("#")[0].split("?")[0];
  return {
    session: async () => (await sb.auth.getSession()).data.session,
    signIn: async (email, password) => { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
    signUp: async (email, password) => { const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: here() } }); if (error) throw error; return data; },
    reset: async (email) => { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: here() }); if (error) throw error; },
    setPassword: async (password) => { const { error } = await sb.auth.updateUser({ password }); if (error) throw error; },
    signOut: async () => sb.auth.signOut(),
    onChange: (cb) => sb.auth.onAuthStateChange((ev, session) => cb(ev, session))
  };
}
let DB, AUTH;
if (window.__BAKERY_MOCK) { DB = window.__BAKERY_MOCK.DB; AUTH = window.__BAKERY_MOCK.AUTH; }
else { const sb = supabase.createClient(CFG.url, CFG.key); DB = makeSupabaseDB(sb); AUTH = makeSupabaseAuth(sb); }

/* ================= UTILS ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const todayISO = () => iso(new Date());
const weekday = s => { const g = parse(s).getDay(); return g === 0 ? 7 : g; };
const mondayOf = s => addDays(s, 1 - weekday(s));
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DOWL = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtD = s => { const d = parse(s); return `${DOW[weekday(s) - 1]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const weekNo = s => { const d = parse(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
const money = n => n == null || n === "" ? "–" : `€${(+n).toFixed(2).replace(/\.00$/, "")}`;
const fmtAmt = (a, u) => { if (a == null) return ""; if (u === "g" && a >= 1000) return `${(a / 1000).toFixed(2).replace(/0$/, "")} kg`; return `${Math.round(a * 10) / 10} ${u}`; };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "x" + Math.random().toString(36).slice(2));
const TOD = ["early morning", "morning", "midday", "afternoon", "evening"];
const todRank = t => { const i = TOD.indexOf((t || "").toLowerCase()); return i < 0 ? 9 : i; };
const KIND = { regular: ["Regular", "reg"], seasonal: ["Seasonal", "sea"], special: ["Special order", "spe"] };
const CHECK = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

let toastT;
function toast(msg, err) {
  let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.className = "toast" + (err ? " err" : ""); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, err ? 5000 : 2200);
}
async function guard(fn) { try { return await fn(); } catch (e) { console.error(e); toast(e.message || String(e), true); } }

/* ================= STATE ================= */
const S = {
  view: store.get("bk.view", "week"), week: mondayOf(todayISO()), month: todayISO().slice(0, 8) + "01",
  otab: "req", stab: store.get("bk.stab", "products"),
  products: [], parts: [], recipes: [], steps: [], ings: [], tmpl: [], stock: [], settings: {}, kIngr: [], book: [], bookIngs: [],
  plan: [], tasks: [], orders: [], oitems: [], requests: 0, user: null
};
const RB = { id: null, x: 1, kind: "all", q: "", from: null }; /* recipe book view state */
const prod = id => S.products.find(p => p.id === id);
const rec = id => S.recipes.find(r => r.id === id);
const partsOf = pid => S.parts.filter(x => x.product_id === pid).sort((a, b) => a.position - b.position);
const stepsOf = rid => S.steps.filter(s => s.recipe_id === rid).sort((a, b) => a.day - b.day || a.position - b.position);
const daysOf = rid => Math.max(1, ...stepsOf(rid).map(s => s.day));
const order = id => S.orders.find(o => o.id === id);
const PALETTE = ["#d19a10", "#c4a516", "#6f9a2e", "#1f9486", "#3f7fd0", "#55637d", "#8a55c2", "#d6437c", "#c0405e", "#e07800", "#c96a2b", "#9c5a2c", "#b08a4e", "#6d4535"];
const recColor = id => rec(id)?.color || null;
const prodColor = pid => { for (const x of partsOf(pid)) { const c = recColor(x.recipe_id); if (c) return c; } return prod(pid)?.color || null; };
const cvar = c => c ? ` style="--rc:${esc(c)}"` : "";
const itemsOf = oid => S.oitems.filter(i => i.order_id === oid);
const setting = (k, d = {}) => S.settings[k] || d;

async function loadStatic() {
  const [products, parts, recipes, steps, ings, tmpl, stock, settings] = await Promise.all([
    DB.sel("bk_products", { order: [["position"], ["name"]] }),
    DB.sel("bk_product_parts"), DB.sel("bk_recipes", { order: [["position"], ["name"]] }),
    DB.sel("bk_recipe_steps"), DB.sel("bk_recipe_ingredients", { order: [["position"]] }),
    DB.sel("bk_template_items"), DB.sel("bk_stock", { order: [["name"]] }), DB.sel("bk_settings"), loadBook()
  ]);
  Object.assign(S, { products, parts, recipes, steps, ings, tmpl, stock });
  S.settings = Object.fromEntries(settings.map(r => [r.key, r.value]));
}
async function loadKitchenIngredients() {
  if (S.kIngr.length) return;
  try { S.kIngr = await DB.sel("ingredients", { cols: "id,name,unit,category", order: [["name"]] }); } catch { S.kIngr = []; }
}
async function loadOrders() {
  const from = addDays(todayISO(), -45);
  const [recent, reqs] = await Promise.all([
    DB.sel("bk_orders", { gte: { pickup_date: from }, order: [["pickup_date"], ["created_at"]] }),

/* ================= CHAIN ENGINE =================
   A product sold on day D is made of parts. Each part is a recipe whose steps are spread over N days;
   the last day of the recipe is its "ready" day = D + ready_offset. Step on recipe day d lands on ready − (N − d).
   Steps of the same recipe ready on the same day are merged into one card (shared doughs). */
function desiredTasks(plans, A, B, batches = []) {
  const want = new Map();
  const add = (pid, date, qty, src) => {
    const p = prod(pid); if (!p) return;
    for (const part of partsOf(pid)) {
      const steps = stepsOf(part.recipe_id); if (!steps.length) continue;
      const N = daysOf(part.recipe_id);
      const ready = addDays(date, src.batch ? 0 : (part.ready_offset || 0));
      if (ready < A || ready > B) continue;
      for (const s of steps) {
        const key = `${part.recipe_id}|${s.id}|${ready}`;
        let t = want.get(key);
        if (!t) {
          t = { gen_key: key, date: addDays(ready, -(N - s.day)), title: s.title, kind: "step", recipe_id: part.recipe_id, step_id: s.id,
                chain_key: `${part.recipe_id}|${ready}`, day_index: s.day, day_count: N, time_hint: s.time_hint || null, position: s.position || 0, sources: [] };
          want.set(key, t);
        }
        t.sources.push({ ...src, p: p.name, q: qty, a: part.qty_per_unit ? Math.round(part.qty_per_unit * qty * 10) / 10 : null, u: part.unit });
      }
    }
  };
  for (const pl of plans) {
    if (pl.status === "cancelled" || !(pl.qty > 0)) continue;
    const p = prod(pl.product_id); if (!p || (p.stock_mode && !pl.order_id)) continue;
    const o = pl.order_id ? order(pl.order_id) : null;
    add(pl.product_id, pl.date, pl.qty, { plan: pl.id, c: pl.choice || null, o: o ? o.code : null });
  }
  for (const b of batches) if (b.status !== "cancelled" && b.qty > 0) add(b.product_id, b.date, b.qty, { batch: b.id, c: null, o: null });

}

    DB.sel("bk_tasks", { gte: { date: addDays(A, -14) }, lte: { date: B }, order: [["date"], ["position"]] }),
    DB.sel("bk_batches", { gte: { date: A }, lte: { date: addDays(B, 14) } })
  ]);
  if (plans.some(pl => pl.order_id && !order(pl.order_id))) await loadOrders();
  const want = desiredTasks(plans.filter(pl => pl.date >= A && pl.date <= addDays(B, 14)), A, B, batches.filter(b => b.date >= A && b.date <= addDays(B, 14)));
  const have = all.filter(t => t.gen_key && t.kind === "step" && readyOfKey(t.gen_key) >= A && readyOfKey(t.gen_key) <= B);
  const haveMap = new Map(have.map(t => [t.gen_key, t]));
  const ins = [], dels = [], ups = [];
  for (const [k, t] of want) {
    const h = haveMap.get(k);

  const upMap = new Map((upsd || []).map(u => [u.id, u]));

        <div class="colh"><b>${DOW[i]}</b><span class="small">${fmtShort(d)}</span><button type="button" class="add" data-act="newtask" data-date="${d}" aria-label="Add task on ${DOWL[i]}">+</button></div>
        ${saleBox(d)}${cards}</section>`;
    }).join("")}</div>`;
  const col = $(`.col.today`); if (col && window.innerWidth < 900) col.scrollIntoView({ inline: "start", block: "nearest" });

/* ================= TEMPLATE FILL ================= */
async function fillFromTemplate(from, days) {
  const to = addDays(from, days - 1);
  const existing = await DB.sel("bk_plan", { gte: { date: from }, lte: { date: to } });
  const rows = [];
  for (let i = 0; i < days; i++) {
    const d = addDays(from, i), wd = weekday(d);
    for (const ti of S.tmpl.filter(x => x.weekday === wd && x.qty > 0)) {
      const p = prod(ti.product_id); if (!p || !p.active) continue;
      if (existing.some(pl => pl.date === d && pl.product_id === ti.product_id && !pl.order_id)) continue;
      rows.push({ date: d, product_id: ti.product_id, qty: ti.qty });
    }
  }
  if (rows.length) await DB.ins("bk_plan", rows);
  return rows.length;
}

async function pickupTask(o, remove) {

  const ex = await DB.sel("bk_tasks", { eq: { gen_key: key } });

async function approveOrder(id) {

  await DB.del("bk_plan", (await DB.sel("bk_plan", { eq: { order_id: id } })).map(x => x.id));

  await DB.upd("bk_orders", id, { status: "confirmed", confirmed_at: new Date().toISOString() });
  await loadOrders();

  await syncTasks(addDays(o.pickup_date, -14), o.pickup_date);
  toast(`${o.code} confirmed. Its steps are on the calendar.`);
}

  const rows = await DB.sel("bk_plan", { eq: { order_id: o.id } });
  await DB.del("bk_plan", rows.map(x => x.id));
  await pickupTask(o, true);
  await syncTasks(addDays(o.pickup_date, -14), o.pickup_date);
}

/* --- task sheet --- */
async function taskSheet(id) {
  const t = S.tasks.find(x => x.id === id) || (await DB.sel("bk_tasks", { eq: { id } }))[0]; if (!t) return;
  const r = t.recipe_id ? rec(t.recipe_id) : null;
  const chain = t.chain_key ? (await DB.sel("bk_tasks", { eq: { chain_key: t.chain_key }, order: [["date"], ["position"]] })) : [];
  const srcs = t.sources || [], su = [...new Set(srcs.map(s => s.u))];
  const total = srcs.length && su.length === 1 && srcs.every(s => s.a != null) ? srcs.reduce((a, s) => a + s.a, 0) : null;
  const bk = r ? bookForChain(r.id) : null, by = bk ? recYield(bk) : null;
  const ings = bk ? bookIngs(bk.id) : r ? S.ings.filter(i => i.recipe_id === r.id) : [];
  const factor = total != null && by && by.u === su[0] ? total / by.q : total != null && su[0] === "g" && r && r.yield_g ? total / r.yield_g : null;
  const fmtI = i => bk ? fmtQty(i.qty * (factor || 1), i.unit, bk.lang) : fmtAmt(i.qty * (factor || 1), i.unit);
  const step = t.step_id ? S.steps.find(s => s.id === t.step_id) : null;
  openSheet(`${head(esc(t.title), `${fmtD(t.date)}${r ? ` · ${r.color ? `<i class="pdot" style="--rc:${esc(r.color)}"></i>` : ""}` + esc(r.name) : ""}${t.day_count > 1 ? ` · day ${t.day_index} of ${t.day_count}` : ""}`)}
    <div class="row" role="group" aria-label="Status">${["todo", "doing", "done"].map(s => `<button type="button" class="btn sm ${t.status === s ? "primary" : ""}" data-act="tstatus" data-id="${t.id}" data-s="${s}">${{ todo: "To do", doing: "Doing", done: "Done" }[s]}</button>`).join("")}</div>
    ${step && step.notes ? `<p class="note">${esc(step.notes)}</p>` : ""}
    ${(t.sources || []).length ? `<div class="sec"><h4>For</h4><div class="list">${t.sources.map(s => `<div class="li"><span class="grow">${esc(s.p)}${s.o ? ` <span class="b spe">${esc(s.o)}</span>` : ""}${s.c ? `<br><span class="small muted">${esc(s.c)}</span>` : ""}</span><b>${s.q}</b>${s.a != null ? `<span class="small muted">${fmtAmt(s.a, s.u)}</span>` : ""}</div>`).join("")}
      ${total != null ? `<div class="small"><b>Total ≈ ${su[0] === "g" ? fmtAmt(total, "g") : `${Math.round(total * 10) / 10} ${esc(su[0])}`}</b>${factor ? ` · ${(factor).toFixed(2)}× the recipe` : ""}</div>` : ""}</div></div>` : ""}
    ${ings.length ? `<div class="sec"><h4>${factor ? "Scaled ingredients" : "Ingredients"}</h4><div class="list">${ings.map(i => `<div class="li"><span class="grow">${esc(i.name)}${i.note ? ` <span class="small muted">${esc(i.note)}</span>` : ""}</span><b>${i.qty != null ? fmtI(i) : ""}</b></div>`).join("")}</div>${!factor && r && !r.yield_g && !by ? `<p class="small muted">Link a recipe from the Recipes section (with how much it makes) to scale this automatically.</p>` : ""}</div>` : ""}
    ${bk ? `<div class="row"><button type="button" class="btn" data-act="openbook" data-id="${bk.id}" data-x="${factor || 1}" data-from="${esc(`Scaled for ${fmtD(t.date)}: ${t.title}`)}">Open full recipe${factor && Math.abs(factor - 1) > 0.01 ? ` ×${Math.round(factor * 100) / 100}` : ""} →</button></div>` : ""}
    ${chain.length > 1 ? `<div class="sec"><h4>Chain</h4><div class="chain">${chain.map(c => `<div class="st ${c.id === t.id ? "cur" : ""}"><span class="d">${fmtD(c.date)}</span><span class="grow">${esc(c.title)}</span>${c.status === "done" ? `<span class="b ok">Done</span>` : ""}</div>`).join("")}</div></div>` : ""}
    <div class="sec"><h4>Details</h4><div class="list">
      ${t.kind !== "step" ? `<label class="f">Title<input type="text" id="tTitle" value="${esc(t.title)}"></label>` : ""}
      <div class="grid2"><label class="f">Date<input type="date" id="tDate" value="${t.date}"></label>
      <label class="f">Time<select id="tTod"><option value="">Any time</option>${TOD.map(x => `<option ${x === (t.time_hint || "").toLowerCase() ? "selected" : ""}>${x}</option>`).join("")}</select></label></div>
      <label class="f">Notes<textarea id="tNotes">${esc(t.notes || "")}</textarea></label>
      ${t.kind === "step" ? `<p class="small muted">Moving a step only moves this card. To move the whole chain, change the sale day in the plan.</p>` : ""}
    </div></div>
    <div class="row sec"><button type="button" class="btn primary" data-act="tsave" data-id="${t.id}">Save</button><span class="spacer"></span>${t.kind !== "step" ? `<button type="button" class="btn warn" data-act="tdel" data-id="${t.id}">Delete</button>` : ""}</div>`);

/* --- day plan sheet --- */
function dayPlanSheet(date) {
  const rows = S.plan.filter(pl => pl.date === date && pl.status !== "cancelled");
  const own = rows.filter(r => !r.order_id), ord = rows.filter(r => r.order_id);
  const avail = S.products.filter(p => p.active && p.kind !== "special");
  openSheet(`${head(`On sale · ${fmtD(date)}`, "Quantities and choices for this day. Steps are rebuilt when you save.")}
    <div class="list" id="dpRows">${own.map(pl => planRow(pl)).join("")}</div>
    <div class="row" style="margin-top:8px"><select id="dpAdd" aria-label="Add product"><option value="">+ Add product…</option>${avail.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>
    ${ord.length ? `<div class="sec"><h4>From orders</h4><div class="list">${ord.map(pl => { const o = order(pl.order_id); return `<div class="li"><span class="b spe">${esc(o?.code || "")}</span><span class="grow">${pl.qty}× ${esc(prod(pl.product_id)?.name || "")}${pl.choice ? `<br><span class="small muted">${esc(pl.choice)}</span>` : ""}</span></div>`; }).join("")}</div></div>` : ""}
    <div class="row sec"><button type="button" class="btn primary" data-act="dpsave" data-date="${date}">Save day</button><button type="button" class="btn" data-act="dpfill" data-date="${date}">Add missing from template</button></div>`,
    sh => { sh.querySelector("#dpAdd").addEventListener("change", e => { const p = prod(e.target.value); if (!p) return; sh.querySelector("#dpRows").insertAdjacentHTML("beforeend", planRow({ id: "new-" + uid(), product_id: p.id, qty: p.default_qty || 0, choice: "" })); e.target.value = ""; }); });
}
function planRow(pl) {
  const p = prod(pl.product_id);
  return `<div class="li" data-plan="${pl.id}" data-product="${pl.product_id}"><div class="grow"><b>${esc(p?.name || "")}</b>${p?.choice_label ? `<input type="text" data-f="choice" value="${esc(pl.choice || "")}" placeholder="${esc(p.choice_label)}${p.choice_count > 1 ? ` (${p.choice_count})` : ""}" style="margin-top:4px" aria-label="${esc(p.choice_label)}">` : ""}</div>
    <input type="number" inputmode="numeric" min="0" data-f="qty" value="${pl.qty}" style="width:76px" aria-label="Quantity"><button type="button" class="btn sm ghost" data-act="dprm" aria-label="Remove">✕</button></div>`;
}

/* --- decision sheet --- */
async function decisionSheet(planId, add) {
  const pl = S.plan.find(x => x.id === planId) || (await DB.sel("bk_plan", { eq: { id: planId } }))[0]; if (!pl) return;
  const p = prod(pl.product_id);
  const hist = (await DB.sel("bk_plan", { eq: { product_id: p.id }, notnull: "choice", order: [["date", false]], limit: 60 })).map(x => x.choice);
  const past = [...new Set(hist)].slice(0, 12);
  const cat = p.category || p.name, ideas = (setting("ideas")[cat] || []).filter(i => !past.includes(i));
  const same = S.plan.filter(x => x.product_id === p.id && !x.order_id && !x.choice && x.id !== pl.id && x.date >= todayISO() && mondayOf(x.date) === mondayOf(pl.date)).sort((a, b) => a.date.localeCompare(b.date));
  const fl = setting("links").filling_lab || CFG.fillingLab;
  openSheet(`${head(`${esc(p.name)}: ${esc(p.choice_label)}`, `For ${fmtD(pl.date)} · decide by ${fmtD(addDays(pl.date, -(p.decide_days || 0)))}`)}
    <label class="f">${esc(p.choice_label)}${p.choice_count > 1 ? ` (${p.choice_count}, one per line or comma-separated)` : ""}<textarea id="dcVal" placeholder="e.g. Plum, thyme & brown butter">${esc(add != null ? add : (pl.choice || ""))}</textarea></label>
    ${past.length ? `<div class="sec"><h4>Used before</h4><div class="pills">${past.map(c => `<button type="button" class="pill" data-act="dcpick" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>` : ""}
    ${ideas.length ? `<div class="sec"><h4>Ideas</h4><div class="pills">${ideas.map(c => `<button type="button" class="pill" data-act="dcpick" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>` : ""}
    <div class="sec"><button type="button" class="btn" data-act="labpick" data-id="${pl.id}">Find it in the Lab →</button> <span class="small muted">Browse recipes, trios, pairings or the generator, then tap “Use in planner”.</span></div>
    ${same.length ? `<label class="f inline sec"><input type="checkbox" id="dcSame" checked> Use for the other ${same.length} day${same.length > 1 ? "s" : ""} this week too (${same.map(x => DOW[weekday(x.date) - 1]).join(", ")})</label>` : ""}
    <label class="f inline"><input type="checkbox" id="dcIdea"> Save to ideas for ${esc(cat)}</label>
    <div class="row sec"><button type="button" class="btn primary" data-act="dcsave" data-id="${pl.id}" data-same="${same.map(x => x.id).join(",")}">Save</button></div>`);
}

    </form>`, sh => { sh.querySelector("#oForm").addEventListener("submit", e => { e.preventDefault(); guard(() => saveOrder(o, e.target)); }); });

async function saveOrder(o, form) {
  const fd = Object.fromEntries(new FormData(form));
  const items = $$("#oItems [data-item]", form).map(el => ({ id: el.dataset.item, product_id: $("[data-f=product_id]", el).value, details: $("[data-f=details]", el).value.trim(), qty: Math.max(1, +$("[data-f=qty]", el).value || 1) })).filter(i => i.product_id);
  if (!fd.customer_name.trim()) throw new Error("Add the customer's name.");
  if (!items.length) throw new Error("Add at least one item.");
  const num = v => v === "" || v == null ? null : +v;
  const patch = { customer_name: fd.customer_name.trim(), phone: fd.phone || null, email: fd.email || null, pickup_date: fd.pickup_date, pickup_time: fd.pickup_time || null,
    allergies: fd.allergies || null, notes: fd.notes || null, total: num(fd.total), deposit: num(fd.deposit), paid: num(fd.paid) || 0, payment_method: fd.payment_method || null, payment_status: fd.payment_status };
  let id = o.id, oldDate = o.pickup_date;
  if (!id) {
    const confirm = !!fd.confirm;
    const [row] = await DB.ins("bk_orders", { ...patch, source: "in_person", status: confirm ? "confirmed" : "request", confirmed_at: confirm ? new Date().toISOString() : null });
    id = row.id;
  } else await DB.upd("bk_orders", id, patch);
  const old = itemsOf(id);
  const keep = items.filter(i => !i.id.startsWith("new"));
  await DB.del("bk_order_items", old.filter(x => !keep.some(k => k.id === x.id)).map(x => x.id));
  for (const i of keep) { const p = prod(i.product_id); await DB.upd("bk_order_items", i.id, { product_id: i.product_id, name: p?.name || "Item", qty: i.qty, details: i.details || null, price: p?.price ?? null }); }
  const add = items.filter(i => i.id.startsWith("new")).map(i => { const p = prod(i.product_id); return { order_id: id, product_id: i.product_id, name: p?.name || "Item", qty: i.qty, details: i.details || null, price: p?.price ?? null }; });
  if (add.length) await DB.ins("bk_order_items", add);
  await loadOrders();
  const fresh = order(id);
  if (["confirmed", "ready"].includes(fresh.status)) {
    await DB.del("bk_plan", (await DB.sel("bk_plan", { eq: { order_id: id } })).map(x => x.id));
    await DB.ins("bk_plan", await orderPlanRows(fresh));
    await pickupTask(fresh);
    if (oldDate && oldDate !== fresh.pickup_date) await syncTasks(addDays(oldDate, -14), oldDate);
    await syncTasks(addDays(fresh.pickup_date, -14), fresh.pickup_date);
  }
  closeSheet(); toast(o.id ? "Order saved." : `Order ${fresh.code} added.`); await refresh();
}

async function saveProduct(p, form) {
  const fd = new FormData(form), g = k => fd.get(k);

/* ================= STOCK (pastries made in batches) =================
   Daily plan quantities for stock products are expected sales. On hand + planned batches − expected sales
   gives a projection; when it goes below zero, a batch is suggested in time for the recipe's chain. */
S.sPlan = []; S.batches = [];
const stockProducts = () => S.products.filter(p => p.stock_mode && p.active);
async function loadStock() {
  const ids = S.products.filter(p => p.stock_mode).map(p => p.id);
  if (!ids.length) { S.sPlan = []; S.batches = []; return; }
  const t = todayISO();
  const [pl, bt, fresh] = await Promise.all([
    DB.sel("bk_plan", { in: { product_id: ids }, gte: { date: t }, lte: { date: addDays(t, 27) } }),
    DB.sel("bk_batches", { in: { product_id: ids }, gte: { date: addDays(t, -60) }, order: [["date"]] }),
    DB.sel("bk_products", { in: { id: ids }, cols: "id,on_hand,counted_at" })
  ]);
  S.sPlan = pl; S.batches = bt;
  for (const f of fresh) { const p = prod(f.id); if (p) { p.on_hand = f.on_hand; p.counted_at = f.counted_at; } }
}
function projection(p, days = 21) {
  const t = todayISO(), out = []; let s = +p.on_hand || 0;
  const planned = S.batches.filter(b => b.product_id === p.id && b.status === "planned");
  for (let i = 0; i < days; i++) {
    const d = addDays(t, i);
    const inc = planned.filter(b => (i === 0 ? b.date <= d : b.date === d)).reduce((a, b) => a + b.qty, 0);
    const need = S.sPlan.filter(x => x.product_id === p.id && x.date === d && x.status !== "cancelled" && !x.order_id && x.sold == null).reduce((a, x) => a + x.qty, 0);
    const start = s + inc, end = start - need;
    out.push({ d, need, inc, start, end }); s = Math.max(0, end);
  }
  return out;
}
const projAt = (p, d) => d < todayISO() ? null : projection(p, Math.min(28, diffDays(todayISO(), d) + 1)).find(x => x.d === d) || null;
const leadDays = p => Math.max(1, ...partsOf(p.id).map(x => daysOf(x.recipe_id)));
function coverage(p) {
  const pr = projection(p), short = pr.find(x => x.end < 0);
  return { pr, short, lastsUntil: short ? (pr.indexOf(short) > 0 ? pr[pr.indexOf(short) - 1].d : null) : null, days: short ? pr.indexOf(short) : pr.length };
}
function stockAlerts() {
  const t = todayISO();
  return stockProducts().map(p => { const c = coverage(p); if (!c.short) return null; const makeBy = addDays(c.short.d, -(leadDays(p) - 1)); return { p, c, makeBy, late: makeBy <= t }; })
    .filter(Boolean).sort((a, b) => a.makeBy.localeCompare(b.makeBy));
}
function suggestQty(p, from) { if (p.batch_size) return p.batch_size; const pr = projection(p, 28).filter(x => x.d >= from).slice(0, p.shelf_days || 7); return Math.max(1, pr.reduce((a, x) => a + x.need, 0)); }
function alertCard(a, t) {
  return `<button type="button" class="dcard ${a.late ? "late" : ""}" data-act="batch" data-pid="${a.p.id}" data-date="${a.c.short.d}" data-qty="${suggestQty(a.p, a.c.short.d)}"><b>${esc(a.p.name)}: runs out ${fmtD(a.c.short.d)}</b><span class="small">${+a.p.on_hand || 0} on hand · ${a.c.short.need} needed that day</span><span class="small">Make a batch by ${a.late ? "<b>today</b>" : fmtD(a.makeBy)}</span></button>`;
}
function oldestInStock(p) {
  let left = +p.on_hand || 0, oldest = null;
  for (const b of S.batches.filter(x => x.product_id === p.id && x.status === "made").sort((a, b) => (b.made_at || b.date).localeCompare(a.made_at || a.date))) {
    if (left <= 0) break; oldest = b; left -= b.qty;
  }
  if (!oldest) return null;
  const made = (oldest.made_at || oldest.date).slice(0, 10);
  return { made, until: addDays(made, p.shelf_days || 7), unknownOlder: left > 0 };
}
const ago = ts => { if (!ts) return "not counted yet"; const d = diffDays(ts.slice(0, 10), todayISO()); const hm = new Date(ts); return d === 0 ? `counted today ${pad(hm.getHours())}:${pad(hm.getMinutes())}` : d === 1 ? "counted yesterday" : `counted ${d} days ago`; };
async function setOnHand(p, v) {
  const row = { on_hand: v, counted_at: new Date().toISOString() };
  await DB.upd("bk_products", p.id, row); Object.assign(p, row); rerender();
}
async function markBatch(b, made) {
  const p = prod(b.product_id); if (!p) return;
  const fresh = (await DB.sel("bk_products", { eq: { id: p.id } }))[0] || p;
  const oh = Math.max(0, (+fresh.on_hand || 0) + (made ? b.qty : -b.qty));
  await DB.upd("bk_products", p.id, { on_hand: oh }); p.on_hand = oh;
  await DB.upd("bk_batches", b.id, { status: made ? "made" : "planned", made_at: made ? new Date().toISOString() : null });
  const lb = S.batches.find(x => x.id === b.id); if (lb) Object.assign(lb, { status: made ? "made" : "planned", made_at: made ? new Date().toISOString() : null });
  toast(made ? `${p.name}: +${b.qty} in stock (${oh} on hand).` : `${p.name}: batch back to planned (${oh} on hand).`);
}
async function batchHook(t, status) {
  if (!t || t.kind !== "step" || t.day_index !== t.day_count) return;
  for (const s of t.sources || []) {
    if (!s.batch) continue;
    const b = (await DB.sel("bk_batches", { eq: { id: s.batch } }))[0]; if (!b) continue;
    if (status === "done" && b.status === "planned") await markBatch(b, true);
    else if (status !== "done" && b.status === "made") await markBatch(b, false);
  }
}

function renderStock() {
  const t = todayISO(), list = stockProducts();
  const cards = list.map(p => {
    const c = coverage(p), old = oldestInStock(p), lead = leadDays(p);
    const status = c.short ? (diffDays(t, c.short.d) <= lead ? ["warn", `Runs out ${fmtD(c.short.d)}`] : ["sea", `Lasts until ${fmtD(c.lastsUntil || t)}`]) : ["ok", `Enough for ${c.pr.length}+ days`];
    const bs = S.batches.filter(b => b.product_id === p.id && b.status !== "cancelled" && (b.status === "planned" || b.date >= addDays(t, -(p.shelf_days || 7))));
    return `<article class="scard"${cvar(prodColor(p.id))}>

document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]"); if (v) { go(v.dataset.view); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  e.preventDefault(); guard(() => fn(a));
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#scrim")) { closeSheet(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".cbody[role=button]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e => {
  if (e.target.matches("[data-stock]")) guard(async () => { const s = S.stock.find(x => x.id === e.target.dataset.stock); const v = Math.max(0, +e.target.value || 0); await DB.upd("bk_stock", s.id, { in_stock: v, updated_at: new Date().toISOString() }); s.in_stock = v; rerender(); });
  if (e.target.closest("[data-sale]") && e.target.matches("[data-f]")) queueSale(e.target.closest("[data-sale]").dataset.sale);
  if (e.target.matches("[data-onhand]")) guard(async () => { const p = prod(e.target.dataset.onhand); await setOnHand(p, Math.max(0, +e.target.value || 0)); });
});
document.addEventListener("input", e => { const r = e.target.closest?.("[data-sale]"); if (r) updateLeftBadge(r.dataset.sale); });
document.addEventListener("submit", e => {
  if (e.target.id !== "setForm") return; e.preventDefault();
  guard(async () => {
    const fd = new FormData(e.target), form = { ...setting("form") };
    for (const k of ["title", "intro", "pickup_place", "bank_recipient", "bank_iban", "payment_note", "contact"]) form[k] = (fd.get(k) || "").trim();
    const ideas = { ...setting("ideas") }; $$("[data-idea]", e.target).forEach(t => { ideas[t.dataset.idea] = t.value.split("\n").map(s => s.trim()).filter(Boolean); });
    await DB.ups("bk_settings", [{ key: "form", value: form }, { key: "ideas", value: ideas }, { key: "links", value: { ...setting("links"), filling_lab: (fd.get("filling_lab") || "").trim() } }], "key");
    await loadStatic(); toast("Settings saved.");
  });
});
/* drag & drop between days */
document.addEventListener("dragstart", e => { const c = e.target.closest?.(".card[data-task]"); if (!c) return; e.dataTransfer.setData("text/plain", c.dataset.task); e.dataTransfer.effectAllowed = "move"; });
document.addEventListener("dragover", e => { const col = e.target.closest?.(".col[data-col]"); if (!col) return; e.preventDefault(); $$(".col.drop").forEach(c => c !== col && c.classList.remove("drop")); col.classList.add("drop"); });
document.addEventListener("dragleave", e => { const col = e.target.closest?.(".col[data-col]"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop"); });
document.addEventListener("drop", e => {
  const col = e.target.closest?.(".col[data-col]"); if (!col) return; e.preventDefault(); col.classList.remove("drop");
  const id = e.dataTransfer.getData("text/plain"); const t = S.tasks.find(x => x.id === id); if (!t || t.date === col.dataset.col) return;

/* ================= AUTH & BOOT ================= */
function showLogin(msg, signedIn) {
  $("#app").classList.add("hidden"); const L = $("#login"); L.classList.remove("hidden");
  L.innerHTML = `<form class="login" id="loginForm"><h1>Bakery <span style="color:var(--accent)">Planner</span></h1>
    <p class="muted" style="margin:0">Sign in to plan the week, decide flavours and handle orders.</p>
    ${msg ? `<div class="err" role="alert">${esc(msg)}</div>` : ""}
    ${signedIn ? `<button type="button" class="btn" id="lOut">Sign out</button>` : `
    <label class="f">Email<input type="email" name="email" autocomplete="username" required></label>
    <label class="f">Password<input type="password" name="password" autocomplete="current-password" required minlength="8"></label>
    <button type="submit" class="btn primary">Sign in</button>
    <div class="row"><button type="button" class="btn ghost sm" id="lUp">First time? Create login</button><span class="spacer"></span><button type="button" class="btn ghost sm" id="lReset">Forgot password</button></div>`}
  </form>`;
  const f = $("#loginForm");
  if (signedIn) { $("#lOut").onclick = async () => { await AUTH.signOut(); showLogin(); }; return; }
  const creds = () => { const fd = new FormData(f); return [String(fd.get("email")).trim(), String(fd.get("password"))]; };
  f.onsubmit = e => { e.preventDefault(); guard(async () => { const [em, pw] = creds(); await AUTH.signIn(em, pw); await boot(); }); };
  $("#lUp").onclick = () => guard(async () => { if (!f.reportValidity()) return; const [em, pw] = creds(); await AUTH.signUp(em, pw); showLogin("Check your inbox and confirm the email, then sign in here."); });
  $("#lReset").onclick = () => guard(async () => { const em = String(new FormData(f).get("email")).trim(); if (!em) { toast("Enter your email first.", true); return; } await AUTH.reset(em); toast("Password reset email sent."); });
}
function showSetPassword() {
  $("#app").classList.add("hidden"); const L = $("#login"); L.classList.remove("hidden");
  L.innerHTML = `<form class="login" id="pwForm"><h1>New password</h1><label class="f">Password<input type="password" name="pw" minlength="8" required autocomplete="new-password"></label><button class="btn primary" type="submit">Save password</button></form>`;
  $("#pwForm").onsubmit = e => { e.preventDefault(); guard(async () => { await AUTH.setPassword(new FormData(e.target).get("pw")); toast("Password saved."); await boot(); }); };
}
let booted = false;
async function boot() {
  const sess = await AUTH.session();
  if (!sess) { showLogin(); return; }
  let ok = false; try { ok = await DB.rpc("bk_is_admin"); } catch (e) { showLogin(e.message); return; }
  if (!ok) { showLogin("This login isn't allowed here yet, or its email isn't confirmed.", true); return; }
  S.user = sess.user;
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  await guard(async () => { await Promise.all([loadStatic(), loadOrders()]); });
  await refresh();
  if (!booted) { booted = true; setInterval(() => { if (document.visibilityState === "visible" && !$("#scrim")) guard(async () => { const before = S.requests; await loadOrders(); if (S.requests !== before) { renderNav(); if (S.requests > before) toast("New order request."); } }); }, 120000); }
}
(() => {
  const th = store.get("bk.theme", null); if (th) document.documentElement.dataset.theme = th;
  const hv = parseView(location.hash.slice(1)); if (VIEWKEYS.includes(hv)) { S.view = hv; if (PLANNERV.includes(hv)) store.set("bk.lastPlanner", hv); } else if (!VIEWKEYS.includes(S.view)) S.view = "week";
  if (AUTH.onChange) AUTH.onChange(ev => { if (ev === "PASSWORD_RECOVERY") showSetPassword(); });
  boot();
})();

/* ================= RECIPE BOOK ================= */
/* Own tables (bk_book_recipes, bk_book_ingredients). ingredient_id refers to Kitchen OS ingredients and
   chain_recipe_id to a planner schedule (bk_recipes), by id only. */
const RKINDS = [["dough", "Doughs"], ["bake", "Bakes"], ["filling", "Fillings & creams"], ["topping", "Toppings"], ["glaze", "Glazes & finishes"], ["other", "Other"]];
const RKIND1 = { dough: "Dough", bake: "Bake", filling: "Filling", topping: "Topping", glaze: "Glaze", other: "Other" };
const UNITS = ["g", "kg", "ml", "l", "pcs", "tbsp", "tsp", "pinch"];
const ULBL = { en: { pcs: "pcs", tbsp: "tbsp", tsp: "tsp", pinch: "pinch" }, lt: { pcs: "vnt.", tbsp: "v. š.", tsp: "a. š.", pinch: "žiupsn." } };
const book = id => S.book.find(r => r.id === id);
const bookIngs = id => S.bookIngs.filter(i => i.recipe_id === id).sort((a, b) => a.position - b.position);
const recYield = r => r && r.yield_qty && r.yield_unit ? { q: +r.yield_qty, u: r.yield_unit } : null;
const FRAC = { 0.25: "¼", 0.5: "½", 0.75: "¾", 0.33: "⅓", 0.67: "⅔" };
function fmtQty(q, u, lang) {
  if (q == null || q === "") return "";
  let v = +q, unit = u || "g";
  if (unit === "g" && v >= 1000) { v /= 1000; unit = "kg"; }
  if (unit === "ml" && v >= 1000) { v /= 1000; unit = "l"; }
  let num;
  if (["pcs", "tbsp", "tsp", "pinch"].includes(unit)) {
    const whole = Math.floor(v + 1e-9), rest = Math.round((v - whole) * 100) / 100, fr = FRAC[rest];
    num = fr ? (whole ? whole + " " : "") + fr : String(Math.round(v * 100) / 100);
  } else num = String(unit === "g" || unit === "ml" ? (v >= 10 ? Math.round(v) : Math.round(v * 10) / 10) : Math.round(v * 100) / 100);
  if (lang === "lt") num = num.replace(".", ",");
  return `${num} ${(ULBL[lang] || ULBL.en)[unit] || unit}`;
}
const ovenLine = o => (o || []).map(s => `${s.t} °C · ${s.m} min`).join(" → ");
const ovenMin = o => (o || []).reduce((a, s) => a + (+s.m || 0), 0);
/* where the scheduled planner recipe is used */
const usedBy = r => r && r.chain_recipe_id ? [...new Set(S.parts.filter(p => p.recipe_id === r.chain_recipe_id).map(p => prod(p.product_id)?.name).filter(Boolean))] : [];

function renderRecipeNav() {
  const counts = Object.fromEntries(RKINDS.map(([k]) => [k, S.book.filter(r => r.kind === k).length]));
  $("#subnav").innerHTML = `<nav class="nav" aria-label="Recipe kinds"><button type="button" data-act="rkind" data-k="all" ${RB.kind === "all" && !RB.id ? 'aria-current="page"' : ""}>All <span class="muted small">${S.book.length}</span></button>${RKINDS.map(([k, l]) => `<button type="button" data-act="rkind" data-k="${k}" ${RB.kind === k && !RB.id ? 'aria-current="page"' : ""}>${l}${counts[k] ? ` <span class="muted small">${counts[k]}</span>` : ""}</button>`).join("")}</nav><span class="spacer"></span><button type="button" class="btn sm primary bnewbtn" data-act="bnew">+ New<span class="lg"> recipe</span></button>`;
}
function renderRecipes() {
  renderRecipeNav();
  if (RB.id && book(RB.id)) return renderRecipe(book(RB.id));
  RB.id = null;
  $("#main").innerHTML = `<div class="bar"><h2>Recipes</h2><span class="spacer"></span><input type="search" id="rSearch" class="rsearch" placeholder="Search recipes or ingredients" value="${esc(RB.q)}" aria-label="Search recipes"></div><div id="rList"></div>`;
  renderRecipeList();
}
function renderRecipeList() {
  const q = RB.q.trim().toLowerCase();
  const hit = r => !q || r.name.toLowerCase().includes(q) || bookIngs(r.id).some(i => i.name.toLowerCase().includes(q));
  const kinds = RKINDS.filter(([k]) => RB.kind === "all" || RB.kind === k);
  $("#rList").innerHTML = kinds.map(([k, l]) => {
    const list = S.book.filter(r => r.kind === k && hit(r)).sort((a, b) => a.position - b.position || a.name.localeCompare(b.name));
    if (!list.length && (q || (RB.kind === "all" && k !== "dough"))) return "";
    return `<section class="sec"><h4>${l} <span class="muted">${list.length}</span></h4><div class="cards">${list.map(recipeCard).join("")}
      <button type="button" class="pcard addcard" data-act="bnew" data-k="${k}">+ Add ${RKIND1[k].toLowerCase()}</button></div></section>`;
  }).join("") || `<p class="muted">Nothing matches “${esc(RB.q)}”.</p>`;
}
function recipeCard(r) {
  const ings = bookIngs(r.id), y = recYield(r), used = usedBy(r);
  return `<button type="button" class="pcard ${r.color ? "rc" : ""}" data-act="bopen" data-id="${r.id}"${cvar(r.color)}>
    <div class="row"><h4>${esc(r.name)}</h4><span class="spacer"></span>${r.lang === "lt" ? `<span class="b">LT</span>` : ""}</div>
    <div class="small muted">${[r.yield_note || (y ? fmtQty(y.q, y.u, r.lang) : ""), ings.length ? `${ings.length} ingredients` : "", (r.oven || []).length ? `${ovenMin(r.oven)} min in the oven` : ""].filter(Boolean).join(" · ") || "No details yet"}</div>
    ${ings.length ? "" : `<div class="small"><span class="b warn">Draft</span> no ingredients yet</div>`}
    ${used.length ? `<div class="small muted">Used in: ${esc(used.join(", "))}</div>` : ""}</button>`;
}
function renderRecipe(r) {
  const ings = bookIngs(r.id), y = recYield(r), x = RB.x || 1, lang = r.lang || "en";
  const groups = []; ings.forEach(i => { const g = i.grp || ""; let G = groups.find(z => z.g === g); if (!G) groups.push(G = { g, items: [] }); G.items.push(i); });
  const chain = r.chain_recipe_id ? stepsOf(r.chain_recipe_id) : [], cdays = r.chain_recipe_id ? daysOf(r.chain_recipe_id) : 0, used = usedBy(r);
  const method = (r.method || "").split(/\n+/).map(s => s.trim()).filter(Boolean);
  const target = y ? Math.round(y.q * x * 100) / 100 : null;
  $("#main").innerHTML = `<div class="bar noprint"><button type="button" class="btn sm ghost" data-act="bback">← All recipes</button><span class="spacer"></span><button type="button" class="btn sm" data-act="bprint">Print</button><button type="button" class="btn sm primary" data-act="bedit" data-id="${r.id}">Edit</button></div>
    <article class="rpage">
      <header class="rhead ${r.color ? "rc" : ""}"${cvar(r.color)}>
        <div class="eyebrow">${RKIND1[r.kind] || r.kind}${r.yield_note ? " · " + esc(r.yield_note) : ""}</div>
        <h2>${esc(r.name)}</h2>
        <div class="rfacts">${(r.oven || []).length ? `<span><b>Oven</b> ${esc(ovenLine(r.oven))}</span>` : ""}${cdays ? `<span><b>Schedule</b> ${cdays} day${cdays > 1 ? "s" : ""}</span>` : ""}${used.length ? `<span><b>Used in</b> ${esc(used.join(", "))}</span>` : ""}</div>
      </header>
      ${RB.from ? `<p class="note noprint">${esc(RB.from)}</p>` : ""}
      <div class="rgrid">
        <section class="rcol">
          <div class="rscale noprint" role="group" aria-label="Batch size"><span class="ulbl">Batch</span>${[0.5, 1, 2, 3].map(f => `<button type="button" class="chip" data-act="bx" data-x="${f}" aria-pressed="${x === f}">×${FRAC[f] || f}</button>`).join("")}
            ${y ? `<label class="rtarget">Make <input type="number" id="rTarget" min="0" step="any" value="${target}" inputmode="decimal"> ${esc((ULBL[lang] || ULBL.en)[y.u] || y.u)}</label>` : ""}</div>
          ${x !== 1 ? `<p class="small muted">Scaled ×${Math.round(x * 100) / 100}${y ? ` · ${fmtQty(target, y.u, lang)}` : ""}</p>` : ""}
          <h3>Ingredients</h3>
          ${ings.length ? groups.map(G => `${G.g ? `<h4 class="igrp">${esc(G.g)}</h4>` : ""}<ul class="ilist">${G.items.map(i => `<li><span class="iname">${esc(i.name)}${i.note ? ` <span class="muted">${esc(i.note)}</span>` : ""}</span><b>${fmtQty(i.qty == null ? null : i.qty * x, i.unit, lang)}</b></li>`).join("")}</ul>`).join("") : `<p class="muted">No ingredients yet. Tap Edit to add them.</p>`}
        </section>
        <section class="rcol">
          <h3>Method</h3>
          ${method.length ? `<ol class="method">${method.map(m => `<li>${esc(m)}</li>`).join("")}</ol>` : `<p class="muted">No method yet.</p>`}
          ${(r.oven || []).length ? `<div class="oven"><h4>Oven</h4>${r.oven.map((s, k) => `<div class="ost"><b>${s.t} °C</b><span>${s.m} min</span>${s.n ? `<span class="muted">${esc(s.n)}</span>` : ""}</div>`).join("")}<div class="small muted">${ovenMin(r.oven)} min in total</div></div>` : ""}
          ${r.notes ? `<h4>Notes</h4><p class="rnotes">${esc(r.notes)}</p>` : ""}
          ${chain.length ? `<h4>Production schedule</h4><div class="chain">${chain.map(s => `<div class="st"><span class="d">Day ${s.day}${s.day === cdays ? " · ready" : ""}</span><span class="grow">${esc(s.title)}</span>${s.time_hint ? `<span class="small muted">${esc(s.time_hint)}</span>` : ""}</div>`).join("")}</div><p class="small muted noprint">Days and steps are edited in Setup → Schedules.</p>` : ""}
          ${r.source ? `<p class="small muted">Source: ${esc(r.source)}</p>` : ""}
        </section>
      </div>
    </article>`;
}
function openBook(id, x, from) { RB.id = id; RB.x = x || 1; RB.from = from || null; if (S.view !== "recipes") go("recipes/" + id); else { try { history.pushState(null, "", "#recipes/" + id); } catch {} renderRecipes(); window.scrollTo({ top: 0 }); } }

/* --- edit sheet --- */
function bookSheet(id, kind) {
  const r = id ? book(id) : { id: null, name: "", kind: kind || "bake", lang: "en", yield_qty: null, yield_unit: "pcs", yield_note: "", method: "", oven: [], notes: "", source: "", color: null, chain_recipe_id: null };
  const ings = id ? bookIngs(id) : [];
  const groups = [...new Set(S.bookIngs.map(i => i.grp).filter(Boolean))];
  const unitSel = (u, attr) => `<select ${attr}>${UNITS.map(x => `<option value="${x}" ${x === (u || "g") ? "selected" : ""}>${x}</option>`).join("")}</select>`;
  const ingRow = i => `<div class="bing" data-ing>
      <input type="text" data-f="name" list="kIngr" value="${esc(i.name || "")}" placeholder="Ingredient" aria-label="Ingredient">
      <input type="number" step="any" data-f="qty" value="${i.qty ?? ""}" placeholder="Amount" aria-label="Amount">
      ${unitSel(i.unit, 'data-f="unit" aria-label="Unit"')}
      <input type="text" data-f="grp" list="bGroups" value="${esc(i.grp || "")}" placeholder="Group" aria-label="Group">
      <input type="text" data-f="note" value="${esc(i.note || "")}" placeholder="Note" aria-label="Note">
      <button type="button" class="btn sm ghost" data-act="rmrow" aria-label="Remove ingredient">✕</button></div>`;
  const ovRow = o => `<div class="boven" data-oven><input type="number" data-f="t" value="${o.t ?? ""}" placeholder="°C" aria-label="Temperature"><input type="number" data-f="m" value="${o.m ?? ""}" placeholder="min" aria-label="Minutes"><input type="text" data-f="n" value="${esc(o.n || "")}" placeholder="Note (e.g. turn the tin)" aria-label="Note"><button type="button" class="btn sm ghost" data-act="rmrow" aria-label="Remove stage">✕</button></div>`;
  openSheet(`${head(id ? esc(r.name) : "New recipe", "Ingredients, method and oven. Linked ingredients use your Kitchen OS list.")}
    <form id="bForm" class="list">
      <div class="grid2"><label class="f">Name<input type="text" name="name" required value="${esc(r.name)}"></label>
      <label class="f">Kind<select name="kind">${RKINDS.map(([k, l]) => `<option value="${k}" ${k === r.kind ? "selected" : ""}>${l}</option>`).join("")}</select></label></div>
      <div class="grid3"><label class="f">Makes<input type="number" step="any" name="yield_qty" value="${r.yield_qty ?? ""}"></label>
        <label class="f">Unit${unitSel(r.yield_unit || "pcs", 'name="yield_unit"')}</label>
        <label class="f">Language<select name="lang"><option value="en" ${r.lang !== "lt" ? "selected" : ""}>English</option><option value="lt" ${r.lang === "lt" ? "selected" : ""}>Lietuvių</option></select></label></div>
      <label class="f">Batch description<input type="text" name="yield_note" value="${esc(r.yield_note || "")}" placeholder="e.g. 1 loaf (~8 slices)"></label>
      <div class="sec"><h4>Ingredients</h4><div id="bIngs">${ings.map(ingRow).join("")}</div><button type="button" class="btn sm" data-act="bading">+ Ingredient</button>
        <template id="bIngTpl">${ingRow({})}</template>
        <datalist id="kIngr">${S.kIngr.map(k => `<option value="${esc(k.name)}"></option>`).join("")}</datalist>
        <datalist id="bGroups">${groups.map(g => `<option value="${esc(g)}"></option>`).join("")}</datalist>
        <p class="small muted">Use the same group name to keep rows together (e.g. Dry, Wet, Topping). Names that match Kitchen OS get linked for costing.</p></div>
      <label class="f">Method <span class="small muted">one step per line</span><textarea name="method" style="min-height:160px">${esc(r.method || "")}</textarea></label>
      <div class="sec"><h4>Oven</h4><div id="bOven">${(r.oven || []).map(ovRow).join("")}</div><button type="button" class="btn sm" data-act="badov">+ Oven stage</button><template id="bOvTpl">${ovRow({})}</template></div>
      <label class="f">Production schedule<select name="chain_recipe_id"><option value="">Not linked</option>${S.recipes.map(c => `<option value="${c.id}" ${c.id === r.chain_recipe_id ? "selected" : ""}>${esc(c.name)} (${daysOf(c.id)} d)</option>`).join("")}</select><span class="small muted">Links this recipe to its days on the calendar, so task cards can open it at the right batch size.</span></label>
      <label class="f">Notes<textarea name="notes">${esc(r.notes || "")}</textarea></label>
      <label class="f">Source<input type="text" name="source" value="${esc(r.source || "")}" placeholder="Book, page, link"></label>
      <div class="sec"><h4>Colour</h4><div class="swatches" role="radiogroup" aria-label="Colour">${PALETTE.map(c => `<label class="sw" style="--c:${c}" title="${c}"><input type="radio" name="color" value="${c}" ${r.color === c ? "checked" : ""}><span></span></label>`).join("")}<label class="sw none" title="No colour"><input type="radio" name="color" value="" ${!r.color ? "checked" : ""}><span>×</span></label></div></div>
      <div class="row sec"><button type="submit" class="btn primary">Save</button><span class="spacer"></span>${id ? `<button type="button" class="btn warn" data-act="bdelete" data-id="${id}">Delete</button>` : ""}</div>
    </form>`, sh => { sh.querySelector("#bForm").addEventListener("submit", e => { e.preventDefault(); guard(() => saveBook(r, e.target)); }); });
}
async function saveBook(r, form) {
  const fd = new FormData(form), g = k => (fd.get(k) ?? "").toString();
  const oven = $$("#bOven [data-oven]", form).map(el => ({ t: +$("[data-f=t]", el).value || null, m: +$("[data-f=m]", el).value || null, n: $("[data-f=n]", el).value.trim() })).filter(o => o.t || o.m);
  const row = { name: g("name").trim(), kind: g("kind"), lang: g("lang") || "en", yield_qty: g("yield_qty") === "" ? null : +g("yield_qty"), yield_unit: g("yield_unit") || null, yield_note: g("yield_note").trim() || null,
    method: g("method").trim() || null, oven, notes: g("notes").trim() || null, source: g("source").trim() || null, color: g("color") || null, chain_recipe_id: g("chain_recipe_id") || null, updated_at: new Date().toISOString() };
  if (!row.name) throw new Error("Give the recipe a name.");
  let id = r.id;
  if (id) await DB.upd("bk_book_recipes", id, row); else { row.position = S.book.length + 1; id = (await DB.ins("bk_book_recipes", row))[0].id; }
  const ings = $$("#bIngs [data-ing]", form).map((el, i) => { const v = f => $(`[data-f=${f}]`, el).value.trim(); const name = v("name"); const k = S.kIngr.find(x => x.name.toLowerCase() === name.toLowerCase());
    return { recipe_id: id, name, ingredient_id: k ? k.id : null, qty: v("qty") === "" ? null : +v("qty"), unit: v("unit") || "g", grp: v("grp") || null, note: v("note") || null, position: i + 1 }; }).filter(i => i.name);
  await DB.del("bk_book_ingredients", S.bookIngs.filter(i => i.recipe_id === id).map(i => i.id));
  if (ings.length) await DB.ins("bk_book_ingredients", ings);
  await loadBook(); closeSheet(); toast("Recipe saved."); RB.id = id; RB.x = 1; RB.from = null;
  if (S.view === "recipes") { try { history.replaceState(null, "", "#recipes/" + id); } catch {} renderRecipes(); } else go("recipes/" + id);
}
async function loadBook() {
  const [b, bi] = await Promise.all([DB.sel("bk_book_recipes", { order: [["position"], ["name"]] }), DB.sel("bk_book_ingredients", { order: [["position"]] })]);
  S.book = b; S.bookIngs = bi;
}
/* book recipe for a planner task (via its schedule recipe) */
const bookForChain = cid => cid ? S.book.find(r => r.chain_recipe_id === cid) : null;

Object.assign(ACT, {
  rkind: el => { RB.kind = el.dataset.k; RB.id = null; RB.from = null; if (S.view !== "recipes") go("recipes"); else { try { history.pushState(null, "", "#recipes"); } catch {} renderRecipes(); } },
  bopen: el => openBook(el.dataset.id),
  bback: () => { RB.id = null; RB.from = null; try { history.pushState(null, "", "#recipes"); } catch {} renderRecipes(); window.scrollTo({ top: 0 }); },
  bnew: el => guard(async () => { await loadKitchenIngredients(); bookSheet(null, el.dataset.k || (RB.kind !== "all" ? RB.kind : "bake")); }),
  bedit: el => guard(async () => { await loadKitchenIngredients(); bookSheet(el.dataset.id); }),
  bading: () => { $("#bIngs").insertAdjacentHTML("beforeend", $("#bIngTpl").innerHTML); const rows = $$("#bIngs [data-ing]"); const last = rows[rows.length - 1], prev = rows[rows.length - 2]; if (prev) $("[data-f=grp]", last).value = $("[data-f=grp]", prev).value; $("[data-f=name]", last).focus(); },
  badov: () => $("#bOven").insertAdjacentHTML("beforeend", $("#bOvTpl").innerHTML),
  bdelete: el => guard(async () => { const r = book(el.dataset.id); if (!r || !confirm(`Delete ${r.name}?`)) return; await DB.del("bk_book_recipes", [r.id]); await loadBook(); closeSheet(); RB.id = null; renderRecipes(); toast("Recipe deleted."); }),
  bx: el => { RB.x = +el.dataset.x; renderRecipe(book(RB.id)); },
  bprint: () => window.print(),
  openbook: el => { closeSheet(); openBook(el.dataset.id, +el.dataset.x || 1, el.dataset.from || null); }
});
document.addEventListener("input", e => {
  if (e.target.id === "rSearch") { RB.q = e.target.value; renderRecipeList(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "rTarget") { const r = book(RB.id), y = recYield(r); const v = +e.target.value; if (y && v > 0) { RB.x = v / y.q; renderRecipe(r); } }
});

</script>
